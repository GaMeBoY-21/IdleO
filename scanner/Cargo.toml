[package]
name = "idleo-scanner"
description = "Checks renters' own container images on our server before they reach a host (ADR 0042)"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[lib]
name = "idleo_scanner"

[[bin]]
name = "idleo-scanner"
path = "src/main.rs"

[features]
# The tar builder the tests make layers with, for the integration tests; never in the scanner's image.
testing = []

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[dependencies]
base64 = "0.22.1"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider", "stream"] }
ruzstd = "0.9.1"
rustix = { version = "1", features = ["fs"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
rustls-platform-verifier = "0.7.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.2", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"

[dev-dependencies]
flate2 = "1.1.10"
idleo-scanner = { path = ".", features = ["testing"] }
tempfile = "3.27.0"
wiremock = "0.6.5"
