# cargo deny check: supply-chain rules for the renter CLI, which runs on people's own machines.

[graph]
# Check every platform the CLI ships for, not just the one running the check.
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "aarch64-apple-darwin"]
all-features = true

[advisories]
# Every RustSec advisory fails the check, including unmaintained and unsound crates, unless an
# entry below ignores it with a reason.
version = 2
yanked = "deny"
unmaintained = "all"
ignore = [
    # The zbus family (keyring's Secret Service store, Linux only) was merged into `zbus` itself and the standalone
    # crates are flagged unmaintained. There is no upgrade: keyring 4.2 still depends on them. They are only the D-Bus
    # wire format, with no vulnerability reported. Drop these when keyring moves to zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "zvariant is folded into zbus; only reachable through keyring on Linux" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names is folded into zbus; only reachable through keyring on Linux" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive is folded into zbus; only reachable through keyring on Linux" },
]

[licenses]
# Permissive licences only: no GPL, LGPL, AGPL or other copyleft in the CLI.
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93

[licenses.private]
# Our own crates aren't published and carry no licence field.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between our own unpublished crates carry no version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
