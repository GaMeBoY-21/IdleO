[package]
name = "idleo-cli"
description = "The IdleO renter command line"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
build = "build.rs"

[lib]
name = "idleo_cli"

[[bin]]
# The binary's name is one constant too (src/brand.rs), so the brand stays one change; this must match it.
name = "idleo"
path = "src/main.rs"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[dependencies]
bytes = "1.11.1"
chrono = { version = "0.4.45", default-features = false, features = ["serde", "std", "clock"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = { version = "0.3.32", default-features = false, features = ["std"] }
keyring = "4.2.0"
# HTTP over our own rustls config (ring, the operating system's trust store), as the host agent does.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls-no-provider", "stream"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
rustls-platform-verifier = "0.7.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11"
tokio = { version = "1.53.2", features = ["fs", "io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1.27.0", features = ["serde", "v7"] }

[build-dependencies]
prettyplease = "0.3.0"
schemars = "1.2.3"
serde_json = "1.0.151"
serde_norway = "0.9.42"
syn = "3.0.8"
typify = "0.8.0"

[dev-dependencies]
tempfile = "3.27.0"
serde_norway = "0.9.42"
