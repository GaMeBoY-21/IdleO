[package]
name = "tray"
description = "The Windows app's tray icon: the host's state at a glance, hosting on and off, pause, auto-pause and the dashboard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "idleo_tray"

[[bin]]
name = "idleo-tray"
path = "src/main.rs"

[dependencies]
brand = { path = "../brand" }
release = { path = "../release" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
time = { version = "0.3.55", features = ["formatting", "local-offset", "macros", "parsing", "serde"] }
tokio = { version = "1.53.2", features = ["io-util", "macros", "rt", "sync", "time"] }
tracing = "0.1.44"

[target.'cfg(windows)'.dependencies]
agent-windows = { path = "../agent-windows" }
# The menu is muda's, re-exported by tray-icon as tray_icon::menu, so the two always agree.
tao = { version = "0.37.1", default-features = false, features = ["rwh_06"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
tray-icon = { version = "0.26.1", default-features = false }
# The IdleO window: the same WebView2 as the setup window (ADR 0061).
wry = { version = "0.57.0", default-features = false, features = ["os-webview"] }

[build-dependencies]
brand = { path = "../brand", features = ["build"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["io-util", "macros", "rt", "sync", "test-util", "time"] }
