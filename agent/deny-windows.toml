# cargo deny --config deny-windows.toml check: the same rules as deny.toml, for the Windows target alone, where the
# tray and the setup app ship (deny.toml leaves them out, because it joins every target's edges and their GUI crates
# would bring Linux and macOS backends we never build). scripts/checks/agent.sh runs both.

[graph]
# Windows only: what the tray and the setup app are built for.
targets = ["x86_64-pc-windows-msvc"]
all-features = true

[advisories]
# Every RustSec advisory fails the check, including unmaintained and unsound crates, unless an
# entry below ignores it with a reason.
version = 2
yanked = "deny"
unmaintained = "all"
ignore = []

[licenses]
# Permissive licences only: no GPL, LGPL, AGPL or other copyleft in the agent.
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93

[licenses.private]
# Our own crates aren't published and carry no licence field.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between our own unpublished crates carry no version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
