[package]
name = "release"
description = "What the Windows app's programs share: the folders, the signed release manifest, download-and-verify, versions, the WSL wrapper and the local channel's protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "idleo_release"

[[bin]]
name = "idleo-release"
path = "src/bin/idleo-release.rs"

[features]
# Bakes agent/release-keys/release.pub into the build instead of the development key; refuses to compile while it's
# empty. Only a release build sets it (scripts/build-windows.sh --release-keys).
prod-keys = []
# The fake machine and fake wsl.exe the setup app's, the launcher's and the agent's tests run against. Never in a
# shipped build.
fakes = ["dep:tempfile"]

[dependencies]
base64 = "0.22.1"
clap = { version = "4.6.7", features = ["derive"] }
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
rustls-platform-verifier = "0.7.1"
rusty-s3 = { version = "0.10.2", default-features = false, features = ["rustcrypto", "full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = { version = "3.27.0", optional = true }
time = { version = "0.3.55", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1.53.2", features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
tokio-stream = { version = "0.1.19", default-features = false }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
agent-windows = { path = "../agent-windows" }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["fs", "io-util", "macros", "net", "rt", "sync", "test-util", "time"] }
