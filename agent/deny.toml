# cargo deny check: supply-chain rules for the host agent, which runs on other people's machines.

[graph]
# Check every platform the agent ships for, not just the one running the check.
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "aarch64-apple-darwin"]
all-features = true
# The tray and the setup app ship only for Windows. cargo-deny joins every target's edges, so their GUI crates (tao,
# wry, tray-icon) would bring their GTK, WebKit and macOS backends, which we never build; deny-windows.toml checks the
# whole workspace, them included, for the Windows target alone, under the same rules.
exclude = ["tray", "setup"]

[advisories]
# Every RustSec advisory fails the check, including unmaintained and unsound crates, unless an
# entry below ignores it with a reason.
version = 2
yanked = "deny"
unmaintained = "all"
ignore = []

[licenses]
# Permissive licences only: no GPL, LGPL, AGPL or other copyleft in the agent.
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93

[licenses.private]
# Our own crates aren't published and carry no licence field.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between our own unpublished crates carry no version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
