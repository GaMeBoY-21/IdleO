[package]
name = "agent"
description = "The IdleO host agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "idleo_agent"

[[bin]]
name = "idleo-agent"
path = "src/main.rs"

[features]
default = ["nvml"]
# Reads real GPUs through NVIDIA's NVML. Only Windows and Linux builds have it; elsewhere it's empty.
nvml = ["dep:nvml-wrapper"]

[dependencies]
agent-proto = { path = "../agent-proto" }
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.4.3"
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
pem = "4.0.0"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
# HTTP for object storage, over our own rustls config (ring, the operating system's roots).
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
rustls-platform-verifier = "0.7.1"
# Signs S3 requests with a storage grant's temporary keys; does no I/O of its own (ADR 0016).
rusty-s3 = { version = "0.10.2", default-features = false, features = ["rustcrypto", "full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
time = { version = "0.3.55", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1.53.2", features = ["macros", "net", "rt", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
tokio-stream = { version = "0.1.19", default-features = false }
toml = { version = "1.1.6", default-features = false, features = ["parse", "serde"] }
tonic = { version = "0.14.6", default-features = false, features = ["channel", "codegen"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "fmt", "json", "std"] }
uuid = { version = "1.27.0", features = ["serde", "v7"] }
x509-parser = "0.18.1"

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
nvml-wrapper = { version = "0.13.0", optional = true }

[target.'cfg(unix)'.dependencies]
# The lease clock: CLOCK_BOOTTIME on Linux, CLOCK_MONOTONIC on macOS, without unsafe code.
rustix = { version = "1.1.5", default-features = false, features = ["std", "time"] }

[target.'cfg(windows)'.dependencies]
agent-windows = { path = "../agent-windows" }

[dev-dependencies]
prost-types = "0.14.4"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["macros", "net", "rt", "signal", "sync", "test-util", "time"] }
tonic = { version = "0.14.6", default-features = false, features = ["channel", "codegen", "router", "server", "tls-ring"] }
