[workspace]
resolver = "3"
members = ["agent", "agent-proto", "agent-windows", "brand", "launcher", "release", "setup", "tray"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# The Windows app's programs go to people's laptops: small and stripped (scripts/build-windows.sh).
[profile.release]
codegen-units = 1
lto = "thin"
strip = true
