      operationId: sessionList
      parameters:
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      - in: query
        name: active
        required: false
        schema:
          type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      tags:
      - session
    post:
      operationId: sessionCreate
      parameters:
      - description: "A unique key for this create request, 1 to 255 visible ASCII\
          \ characters. A repeat returns the first response; the same key with a different\
          \ body is refused."
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
          description: "A repeat with the same Idempotency-Key: the session it booked"
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
          description: The booked session
          headers:
            Location:
              description: The session's URL
              schema:
                type: string
              style: simple
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      tags:
      - session
  /v1/sessions/{id}:
    get:
      operationId: sessionGet
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      tags:
      - session
  /v1/sessions/{id}/cancel:
    post:
      operationId: sessionCancel
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      tags:
      - session
  /v1/sessions/{id}/events:
    get:
      operationId: sessionEvents
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                oneOf:
                - $ref: "#/components/schemas/SessionResponse"
                - $ref: "#/components/schemas/SessionLogsEvent"
          description: "Server-Sent Events. `event: session` carries the whole session\
            \ as JSON, the same as GET /v1/sessions/{id}: sent on connect, then whenever\
            \ it changes. `event: logs` carries an attempt and its newest log chunk\
            \ (SessionLogsEvent) whenever a new one exists; read them with GET /v1/sessions/{id}/logs.\
            \ A comment line keeps a quiet stream open every 15 seconds. The stream\
            \ closes after the last session event once `settled` is true, and after\
            \ 30 minutes in any case: reconnect with a fresh token. A renter has at\
            \ most 10 streams open (too-many-streams)."
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      tags:
      - session
  /v1/sessions/{id}/logs:
    get:
      operationId: sessionLogs
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionLogPage"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      tags:
      - session
  /v1/sessions/{id}/outputs:
    get:
      operationId: sessionOutputs
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
