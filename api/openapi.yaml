openapi: 3.1.0
info:
  description: The renter and host API. Money is integer paise; times are UTC. Every
    request needs the caller's ID token from the identity provider as a bearer token.
  title: IdleO control plane API
  version: v1
servers:
- url: /
security:
- idToken: []
paths:
  /admin/v1/audit:
    get:
      operationId: auditLogList
      parameters:
      - in: query
        name: actor
        required: false
        schema:
          type: string
      - in: query
        name: action
        required: false
        schema:
          type: string
      - in: query
        name: targetType
        required: false
        schema:
          type: string
      - in: query
        name: targetId
        required: false
        schema:
          type: string
      - in: query
        name: from
        required: false
        schema:
          type: string
          format: date-time
      - in: query
        name: to
        required: false
        schema:
          type: string
          format: date-time
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPage"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      security:
      - adminSession: []
        idToken: []
      tags:
      - auditLog
  /admin/v1/credit-grants:
    get:
      operationId: adminMoneyList
      parameters:
      - in: query
        name: user
        required: true
        schema:
