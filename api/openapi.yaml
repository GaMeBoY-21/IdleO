openapi: 3.1.0
info:
  description: The renter and host API. Money is integer paise; times are UTC. Every
    request needs the caller's ID token from the identity provider as a bearer token.
  title: IdleO control plane API
  version: v1
servers:
- url: /
security:
- idToken: []
paths:
  /v1/availability:
    get:
      operationId: availabilityGet
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Availability"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      tags:
      - availability
  /v1/hosts:
    get:
      operationId: hostList
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostList"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      tags:
      - host
    post:
      operationId: hostCreate
      parameters:
      - description: "A unique key for this create request, 1 to 255 visible ASCII\
          \ characters. A repeat returns the first response; the same key with a different\
          \ body is refused."
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHostRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostResponse"
          description: The new host; a repeat with the same key returns the first
            response
          headers:
            Location:
              description: The host's URL
              schema:
                type: string
              style: simple
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      tags:
      - host
  /v1/hosts/{hostId}/earnings:
    get:
      operationId: hostEarningsGet
      parameters:
      - in: path
        name: hostId
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Earnings"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      tags:
      - hostEarnings
  /v1/hosts/{id}:
    get:
      operationId: hostGet
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      tags:
      - host
  /v1/hosts/{id}/enrolment-code:
    post:
      operationId: hostIssueEnrolmentCode
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrolmentCodeResponse"
          description: "A one-time code, shown once and never stored"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      tags:
      - host
  /v1/hosts/{id}/listing:
    put:
      operationId: hostPutListing
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      tags:
      - host
  /v1/me:
    get:
      operationId: meGet
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
          description: "The signed-in user, created on their first request"
          headers:
            ETag:
              description: Send it back as If-Match to change the user
              schema:
                type: string
              style: simple
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      tags:
      - me
    patch:
      operationId: meUpdate
      parameters:
      - description: "The ETag from the last read of this resource; 428 without it,\
          \ 412 when it's stale."
        in: header
        name: If-Match
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
          description: The changed user
          headers:
            ETag:
              description: "The new version, for the next If-Match"
              schema:
                type: string
              style: simple
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      tags:
      - me
  /v1/session-quotes:
    post:
      operationId: quoteCreate
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      tags:
      - quote
  /v1/sessions:
    get:
      operationId: sessionList
      parameters:
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      - in: query
        name: active
        required: false
        schema:
          type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      tags:
      - session
    post:
      operationId: sessionCreate
      parameters:
      - description: "A unique key for this create request, 1 to 255 visible ASCII\
          \ characters. A repeat returns the first response; the same key with a different\
          \ body is refused."
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
          description: "A repeat with the same Idempotency-Key: the session it booked"
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
          description: The booked session
          headers:
            Location:
              description: The session's URL
              schema:
                type: string
              style: simple
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      tags:
      - session
  /v1/sessions/{id}:
    get:
      operationId: sessionGet
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      tags:
      - session
  /v1/sessions/{id}/cancel:
    post:
      operationId: sessionCancel
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      tags:
      - session
  /v1/sessions/{id}/events:
    get:
      operationId: sessionEvents
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                oneOf:
                - $ref: "#/components/schemas/SessionResponse"
                - $ref: "#/components/schemas/SessionLogsEvent"
          description: "Server-Sent Events. `event: session` carries the whole session\
            \ as JSON, the same as GET /v1/sessions/{id}: sent on connect, then whenever\
            \ it changes. `event: logs` carries an attempt and its newest log chunk\
            \ (SessionLogsEvent) whenever a new one exists; read them with GET /v1/sessions/{id}/logs.\
            \ A comment line keeps a quiet stream open every 15 seconds. The stream\
            \ closes after the last session event once `settled` is true, and after\
            \ 30 minutes in any case: reconnect with a fresh token. A renter has at\
            \ most 10 streams open (too-many-streams)."
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      tags:
      - session
  /v1/sessions/{id}/logs:
    get:
      operationId: sessionLogs
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionLogPage"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      tags:
      - session
  /v1/sessions/{id}/outputs:
    get:
      operationId: sessionOutputs
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Outputs"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      tags:
      - session
  /v1/sessions/{id}/stop:
    post:
      operationId: sessionStop
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StopRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      tags:
      - session
  /v1/templates:
    get:
      operationId: templateList
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateList"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      tags:
      - template
  /v1/uploads:
    get:
      operationId: uploadList
      parameters:
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadList"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      tags:
      - upload
    post:
      operationId: uploadCreate
      parameters:
      - description: "A unique key for this create request, 1 to 255 visible ASCII\
          \ characters. A repeat returns the first response; the same key with a different\
          \ body is refused."
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUploadRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewUpload"
          description: "A repeat with the same Idempotency-Key: the same upload, with\
            \ fresh links"
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewUpload"
          description: "The new upload, with its part links"
          headers:
            Location:
              description: The upload's URL
              schema:
                type: string
              style: simple
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      tags:
      - upload
  /v1/uploads/{id}:
    delete:
      operationId: uploadDelete
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: "Deleted, or already gone"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      tags:
      - upload
    get:
      operationId: uploadGet
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      tags:
      - upload
  /v1/uploads/{id}/complete:
    post:
      operationId: uploadComplete
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteUploadRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      tags:
      - upload
  /v1/uploads/{id}/part-urls:
    post:
      operationId: uploadPartUrls
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartLinksRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadPartLinks"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      tags:
      - upload
  /v1/wallet:
    get:
      operationId: walletGet
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      tags:
      - wallet
  /v1/wallet/transactions:
    get:
      operationId: walletTransactions
      parameters:
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryPage"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      tags:
      - wallet
components:
  schemas:
    Availability:
      type: object
      properties:
        gpus:
          type: array
          items:
            $ref: "#/components/schemas/GpuAvailability"
      required:
      - gpus
    CompleteUploadRequest:
      type: object
      properties:
        parts:
          type: array
          items:
            $ref: "#/components/schemas/UploadedPart"
          maxItems: 10000
          minItems: 0
      required:
      - parts
    CreateHostRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 0
      required:
      - name
    CreateSessionRequest:
      type: object
      properties:
        input:
          oneOf:
          - $ref: "#/components/schemas/SessionInput"
          - type: "null"
        maxPricePaisePerMin:
          type: integer
          format: int32
          minimum: 1
        maxRuntimeSeconds:
          type:
          - integer
          - "null"
          format: int32
          minimum: 1
        maxSpendPaise:
          type: integer
          format: int64
          minimum: 1
        params:
          type:
          - object
          - "null"
          additionalProperties:
            $ref: "#/components/schemas/ParamValue"
          description: "The template's parameters by name: strings, numbers and booleans.\
            \ Never put secrets here."
        templateId:
          type: string
          minLength: 1
        vramNeededMb:
          type:
          - integer
          - "null"
          format: int32
          minimum: 1
      required:
      - maxPricePaisePerMin
      - maxSpendPaise
      - templateId
    CreateUploadRequest:
      type: object
      properties:
        filename:
          type: string
          minLength: 1
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
      required:
      - filename
      - sizeBytes
    Earnings:
      type: object
      properties:
        balancePaise:
          type: integer
          format: int64
        history:
          $ref: "#/components/schemas/HistoryPage"
        hostId:
          type: string
          format: uuid
      required:
      - balancePaise
      - history
      - hostId
    EnrolmentCodeResponse:
      type: object
      properties:
        code:
          type: string
        expiresAt:
          type: string
          format: date-time
      required:
      - code
      - expiresAt
    EventResponse:
      type: object
      properties:
        at:
          type: string
          format: date-time
        reason:
          type: string
        state:
          type: string
      required:
      - at
      - reason
      - state
    GpuAvailability:
      type: object
      properties:
        gpuModel:
          type: string
        hostsIdle:
          type: integer
          format: int32
        hostsOnline:
          type: integer
          format: int32
        pricePaisePerMin:
          $ref: "#/components/schemas/PriceStats"
        vramMb:
          type: integer
          format: int32
      required:
      - gpuModel
      - hostsIdle
      - hostsOnline
      - pricePaisePerMin
      - vramMb
    GpuResponse:
      type: object
      properties:
        gone:
          type: boolean
        model:
          type: string
        vramMb:
          type: integer
          format: int32
      required:
      - gone
      - model
      - vramMb
    HistoryEntry:
      type: object
      properties:
        amountPaise:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        direction:
          type: string
        id:
          type: string
          format: uuid
        kind:
          type: string
        reference:
          $ref: "#/components/schemas/HistoryReference"
      required:
      - amountPaise
      - createdAt
      - direction
      - id
      - kind
      - reference
    HistoryPage:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/HistoryEntry"
        nextCursor:
          type:
          - string
          - "null"
      required:
      - entries
    HistoryReference:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
      required:
      - id
      - type
    HostList:
      type: object
      properties:
        hosts:
          type: array
          items:
            $ref: "#/components/schemas/HostResponse"
      required:
      - hosts
    HostResponse:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        gpus:
          type: array
          items:
            $ref: "#/components/schemas/GpuResponse"
        id:
          type: string
          format: uuid
        lastSeenAt:
          type:
          - string
          - "null"
          format: date-time
        listing:
          oneOf:
          - $ref: "#/components/schemas/Listing"
          - type: "null"
        name:
          type: string
        online:
          type: boolean
        status:
          type: string
      required:
      - createdAt
      - gpus
      - id
      - name
      - online
      - status
    Listing:
      type: object
      properties:
        batchPricePaisePerMin:
          type: integer
          format: int32
        gpuTempCapC:
          type: integer
          format: int32
        maxConcurrentSessions:
          type: integer
          format: int32
      required:
      - batchPricePaisePerMin
      - gpuTempCapC
      - maxConcurrentSessions
    ListingRequest:
      type: object
      properties:
        batchPricePaisePerMin:
          type: integer
          format: int32
          minimum: 1
        gpuTempCapC:
          type: integer
          format: int32
          maximum: 95
          minimum: 60
        maxConcurrentSessions:
          type: integer
          format: int32
          maximum: 1
          minimum: 1
      required:
      - batchPricePaisePerMin
      - gpuTempCapC
      - maxConcurrentSessions
    LogChunk:
      type: object
      properties:
        attempt:
          type: integer
          format: int32
        seq:
          type: integer
          format: int32
        text:
          type: string
      required:
      - attempt
      - seq
      - text
    MeResponse:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
