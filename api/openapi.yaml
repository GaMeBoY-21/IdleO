components:
  schemas:
    AcceptNoticesRequest:
      type: object
      properties:
        ageConfirmed:
          type: boolean
        privacyVersion:
          type: string
          maxLength: 40
          minLength: 0
        termsVersion:
          type: string
          maxLength: 40
          minLength: 0
      required:
      - ageConfirmed
      - privacyVersion
      - termsVersion
    ActivateRequest:
      type: object
      properties:
        code:
          type: string
          maxLength: 64
          minLength: 0
      required:
      - code
    AdminCodeRequest:
      type: object
      properties:
        totp:
          type: string
          maxLength: 16
          minLength: 0
      required:
      - totp
    AdminCreditGrant:
      type: object
      properties:
        amountPaise:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        grantedBy:
          type: string
        id:
          type: string
          format: uuid
        reason:
          type: string
        reversalId:
          type:
          - string
          - "null"
          format: uuid
        reversedAt:
          type:
          - string
          - "null"
          format: date-time
        reversedBy:
          type:
          - string
          - "null"
        txnId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        walletBalancePaise:
          type:
          - integer
          - "null"
          format: int64
      required:
      - amountPaise
      - createdAt
      - grantedBy
      - id
      - reason
      - txnId
      - userId
    AdminCreditGrantList:
      type: object
      properties:
        grants:
          type: array
          items:
            $ref: "#/components/schemas/AdminCreditGrant"
      required:
      - grants
    AdminCreditGrantRequest:
      type: object
      properties:
        paise:
          type: integer
          format: int64
          exclusiveMinimum: 0
        reason:
          type: string
          maxLength: 500
          minLength: 5
        userId:
          type: string
          format: uuid
