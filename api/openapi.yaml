openapi: 3.1.0
info:
  description: The renter and host API. Money is integer paise; times are UTC. Every
    request needs the caller's ID token from the identity provider as a bearer token.
  title: IdleO control plane API
  version: v1
servers:
- url: /
security:
- idToken: []
paths:
  /v1/api-keys:
    get:
      operationId: apiKeyList
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyList"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      tags:
      - apiKey
    post:
      operationId: apiKeyCreate
      parameters:
      - description: "A unique key for this create request, 1 to 255 visible ASCII\
          \ characters. A repeat returns the first response; the same key with a different\
          \ body is refused."
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedApiKey"
          description: "The new key, with its secret this once; a repeat with the\
            \ same Idempotency-Key is a 409 secret-shown-once naming it"
          headers:
            Location:
              description: The key's URL
              schema:
                type: string
              style: simple
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      tags:
      - apiKey
  /v1/api-keys/{id}:
    delete:
      operationId: apiKeyRevoke
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      tags:
      - apiKey
  /v1/availability:
    get:
      operationId: availabilityGet
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Availability"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      tags:
      - availability
  /v1/cli-logins:
    get:
      operationId: cliLoginFind
      parameters:
      - in: query
        name: code
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingCliLogin"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      tags:
      - cliLogin
    post:
      operationId: cliLoginStart
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartCliLoginRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartedCliLogin"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      tags:
      - cliLogin
  /v1/cli-logins/{id}/approve:
    post:
      operationId: cliLoginApprove
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingCliLogin"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      tags:
      - cliLogin
  /v1/cli-logins/{id}/token:
    post:
      operationId: cliLoginPoll
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PollCliLoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedApiKey"
          description: "The CLI's new key, with its secret this once"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      tags:
      - cliLogin
  /v1/earnings:
    get:
      operationId: ownerEarningsGet
      parameters:
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerEarnings"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      tags:
      - ownerEarnings
  /v1/hosts:
    get:
      operationId: hostList
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostList"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      tags:
      - host
    post:
      operationId: hostCreate
      parameters:
      - description: "A unique key for this create request, 1 to 255 visible ASCII\
          \ characters. A repeat returns the first response; the same key with a different\
          \ body is refused."
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHostRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostResponse"
          description: The new host; a repeat with the same key returns the first
            response
          headers:
            Location:
              description: The host's URL
              schema:
                type: string
              style: simple
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      tags:
      - host
  /v1/hosts/{hostId}/earnings:
    get:
      operationId: hostEarningsGet
      parameters:
      - in: path
        name: hostId
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Earnings"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      tags:
      - hostEarnings
  /v1/hosts/{hostId}/price-band:
    get:
      operationId: priceBandGet
      parameters:
      - in: path
        name: hostId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceBand"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      tags:
      - priceBand
  /v1/hosts/{hostId}/sessions:
    get:
      operationId: hostSessionsList
      parameters:
      - in: path
        name: hostId
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostSessionPage"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      tags:
      - hostSessions
  /v1/hosts/{id}:
    delete:
      operationId: hostLifecycleRemove
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      tags:
      - hostLifecycle
    get:
      operationId: hostGet
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      tags:
      - host
    patch:
      operationId: hostLifecycleRename
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameRequest"
        required: true
      responses:
        "200":
