          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      tags:
      - session
  /v1/sessions/{id}/stop:
    post:
      operationId: sessionStop
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StopRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      tags:
      - session
  /v1/templates:
    get:
      operationId: templateList
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateList"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      tags:
      - template
  /v1/uploads:
    get:
      operationId: uploadList
      parameters:
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadList"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      tags:
      - upload
    post:
      operationId: uploadCreate
      parameters:
      - description: "A unique key for this create request, 1 to 255 visible ASCII\
          \ characters. A repeat returns the first response; the same key with a different\
          \ body is refused."
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUploadRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadDetail"
          description: "A repeat with the same Idempotency-Key: the same upload, as\
            \ it stands"
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadDetail"
          description: "The new upload, with its files; ask for each file's part links\
            \ as it's sent"
          headers:
            Location:
              description: The upload's URL
              schema:
                type: string
              style: simple
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      tags:
      - upload
  /v1/uploads/{id}:
    delete:
      operationId: uploadDelete
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: "Deleted, or already gone"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      tags:
      - upload
    get:
      operationId: uploadGet
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadDetail"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      tags:
      - upload
  /v1/uploads/{id}/complete:
    post:
      operationId: uploadComplete
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteUploadRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadDetail"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      tags:
      - upload
  /v1/uploads/{id}/part-urls:
    post:
      operationId: uploadPartUrls
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartLinksRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadPartLinks"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      tags:
      - upload
  /v1/wallet:
    get:
      operationId: walletGet
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      tags:
      - wallet
  /v1/wallet/transactions:
    get:
      operationId: walletTransactions
      parameters:
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryPage"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      tags:
      - wallet
