      - adminSession: []
        idToken: []
      tags:
      - adminMoney
    post:
      operationId: adminMoneyGrant
      parameters:
      - description: "A unique key for this create request, 1 to 255 visible ASCII\
          \ characters. A repeat returns the first response; the same key with a different\
          \ body is refused."
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
      requestBody:
