      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      tags:
      - hostLifecycle
  /v1/hosts/{id}/resume:
    post:
      operationId: hostLifecycleResume
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      tags:
      - hostLifecycle
  /v1/hosts/{id}/telemetry:
    get:
      operationId: hostTelemetryGet
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Telemetry"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      tags:
      - hostTelemetry
  /v1/me:
    get:
      operationId: meGet
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
          description: "The signed-in user, created on their first request"
          headers:
            ETag:
              description: Send it back as If-Match to change the user
              schema:
                type: string
              style: simple
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      tags:
      - me
    patch:
      operationId: meUpdate
      parameters:
      - description: "The ETag from the last read of this resource; 428 without it,\
          \ 412 when it's stale."
        in: header
        name: If-Match
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
          description: The changed user
          headers:
            ETag:
              description: "The new version, for the next If-Match"
              schema:
                type: string
              style: simple
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      tags:
      - me
  /v1/me/activate:
    post:
      operationId: meActivate
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivateRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
          description: The activated account
          headers:
            ETag:
              description: "The new version, for the next If-Match"
              schema:
                type: string
              style: simple
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      tags:
      - me
  /v1/me/notifications:
    get:
      operationId: notificationsGet
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationChoices"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
      tags:
      - notifications
    put:
      operationId: notificationsPut
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationChoices"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "An error, as an RFC 9457 problem detail"
