# Personal data (ADR 0037, docs/reference/personal-data-map.md): every retention rule keeps running. Same format and rules
# as platform.yaml.
groups:
  - name: privacy
    rules:
      - alert: RetentionStopped
        # No instance has applied a retention rule for a day and a half (each runs daily): what the map says is
        # deleted after a period is being kept longer.
        expr: |
          min by (rule) (retention_age_seconds{job="control-plane"}) > 36 * 3600
        for: 10m
        labels:
          severity: digest
        annotations:
          summary: 'A retention rule ({{ $labels.rule }}) has stopped deleting what is due.'
          runbook_url: https://github.com/GaMeBoY-21/IdleO/blob/main/docs/runbooks/alerts.md#retention-stopped
      - alert: PrivacyRequestDue
        # A privacy request or a grievance isn't resolved and its due date (legal.support.response-due after it
        # arrived) is within 7 days, or past.
        expr: |
          max(support_tickets_due_soon{job="control-plane"}) > 0
        for: 10m
        labels:
          severity: page
        annotations:
          summary: 'A privacy request or grievance is due within 7 days, or overdue.'
          runbook_url: https://github.com/GaMeBoY-21/IdleO/blob/main/docs/runbooks/alerts.md#privacy-request-due
