# promtool test rules: the nightly scan's alerts (scripts/checks/ops.sh).
rule_files:
  - ../security.yaml
evaluation_interval: 15m
tests:
  # A scan passes, the next night's fails, the one after passes again.
  - interval: 24h
    input_series:
      - series: 'idleo_suite_passed{suite="scan"}'
        values: '1 0 1'
    alert_rule_test:
      - eval_time: 1h
        alertname: NightlyScanFailing
        exp_alerts: []
      - eval_time: 25h
        alertname: NightlyScanFailing
        exp_alerts:
          - exp_labels: {severity: digest, suite: scan}
            exp_annotations:
              summary: The nightly scan of what is deployed found something to fix.
              runbook_url: https://github.com/GaMeBoY-21/IdleO/blob/main/docs/runbooks/alerts.md#nightly-scan-failing
      - eval_time: 49h
        alertname: NightlyScanFailing
        exp_alerts: []
      - eval_time: 49h
        alertname: NightlyScanMissing
        exp_alerts: []
  # The scan stops reporting: missing once 30 hours pass with nothing.
  - interval: 1h
    input_series:
      - series: 'idleo_suite_passed{suite="scan"}'
        values: '1x2'
    alert_rule_test:
      - eval_time: 20h
        alertname: NightlyScanMissing
        exp_alerts: []
      - eval_time: 40h
        alertname: NightlyScanMissing
        exp_alerts:
          - exp_labels: {severity: digest, suite: scan}
            exp_annotations:
              summary: The nightly scan of what is deployed hasn't reported for 30 hours.
              runbook_url: https://github.com/GaMeBoY-21/IdleO/blob/main/docs/runbooks/alerts.md#nightly-scan-missing
  # The chain's check finds a break: it pages at once.
  - interval: 1m
    input_series:
      - series: 'audit_chain_broken{job="control-plane",instance="a"}'
        values: '0x4 1x4'
      - series: 'audit_chain_broken{job="control-plane",instance="b"}'
        values: '0x4 0x4'
    alert_rule_test:
      - eval_time: 2m
        alertname: AuditChainBroken
        exp_alerts: []
      - eval_time: 6m
        alertname: AuditChainBroken
        exp_alerts:
          - exp_labels: {severity: page}
            exp_annotations:
              summary: The audit log's hash chain is broken.
              runbook_url: https://github.com/GaMeBoY-21/IdleO/blob/main/docs/runbooks/alerts.md#audit-chain-broken
  # The daily check is 25 hours old, then 27.
  - interval: 1m
    input_series:
      - series: 'audit_chain_check_age_seconds{job="control-plane"}'
        values: '90000x4 97200x4'
    alert_rule_test:
      - eval_time: 2m
        alertname: AuditChainUnchecked
        exp_alerts: []
      - eval_time: 6m
        alertname: AuditChainUnchecked
        exp_alerts:
          - exp_labels: {severity: digest}
            exp_annotations:
              summary: The audit log's hash chain hasn't been checked for a day.
              runbook_url: https://github.com/GaMeBoY-21/IdleO/blob/main/docs/runbooks/alerts.md#audit-chain-unchecked
  # The newest copy's day ended 25 hours ago, then 27.
  - interval: 1m
    input_series:
      - series: 'audit_offsite_age_seconds{job="control-plane"}'
        values: '90000x4 97200x4'
    alert_rule_test:
      - eval_time: 2m
        alertname: AuditCopyMissing
        exp_alerts: []
      - eval_time: 6m
        alertname: AuditCopyMissing
        exp_alerts:
          - exp_labels: {severity: digest}
            exp_annotations:
              summary: A day of the audit log has no off-site copy.
              runbook_url: https://github.com/GaMeBoY-21/IdleO/blob/main/docs/runbooks/alerts.md#audit-copy-missing
