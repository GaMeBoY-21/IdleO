# promtool test rules: the audit log's alerts (scripts/checks/ops.sh).
rule_files:
  - ../security.yaml
evaluation_interval: 15s
tests:
  # The chain's check finds a break: it pages at once.
  - interval: 1m
    input_series:
      - series: 'audit_chain_broken{job="control-plane",instance="a"}'
        values: '0x4 1x4'
      - series: 'audit_chain_broken{job="control-plane",instance="b"}'
        values: '0x4 0x4'
    alert_rule_test:
      - eval_time: 2m
        alertname: AuditChainBroken
        exp_alerts: []
      - eval_time: 6m
        alertname: AuditChainBroken
        exp_alerts:
          - exp_labels: {env: production, severity: page}
            exp_annotations:
              summary: The audit log's hash chain is broken.
              runbook_url: https://github.com/GaMeBoY-21/IdleO/blob/main/docs/runbooks/alerts.md#audit-chain-broken
  # The daily check is 25 hours old, then 27.
  - interval: 1m
    input_series:
      - series: 'audit_chain_check_age_seconds{job="control-plane"}'
        values: '90000x4 97200x4'
    alert_rule_test:
      - eval_time: 2m
        alertname: AuditChainUnchecked
        exp_alerts: []
      - eval_time: 6m
        alertname: AuditChainUnchecked
        exp_alerts:
          - exp_labels: {env: production, severity: digest}
            exp_annotations:
              summary: The audit log's hash chain hasn't been checked for a day.
              runbook_url: https://github.com/GaMeBoY-21/IdleO/blob/main/docs/runbooks/alerts.md#audit-chain-unchecked
  # The newest copy's day ended 25 hours ago, then 27.
  - interval: 1m
    input_series:
      - series: 'audit_offsite_age_seconds{job="control-plane"}'
        values: '90000x4 97200x4'
    alert_rule_test:
      - eval_time: 2m
        alertname: AuditCopyMissing
        exp_alerts: []
      - eval_time: 6m
        alertname: AuditCopyMissing
        exp_alerts:
          - exp_labels: {env: production, severity: digest}
            exp_annotations:
              summary: A day of the audit log has no off-site copy.
              runbook_url: https://github.com/GaMeBoY-21/IdleO/blob/main/docs/runbooks/alerts.md#audit-copy-missing
