# promtool test rules: the long suites' alerts (scripts/checks/ops.sh). Each suite: red, then green again; then silent.
rule_files:
  - ../long-suites.yaml
evaluation_interval: 1h
tests:
  - interval: 7d
    input_series:
      - series: 'idleo_suite_passed{suite="hostile"}'
        values: '1 0 1'
    alert_rule_test:
      - eval_time: 1d
        alertname: HostileSuiteFailing
        exp_alerts: []
      - eval_time: 8d
        alertname: HostileSuiteFailing
        exp_alerts:
          - exp_labels: {env: ci, severity: digest, suite: hostile}
            exp_annotations:
              summary: The hostile tests of the job sandbox failed on main or on its schedule.
              runbook_url: https://github.com/GaMeBoY-21/IdleO/blob/main/docs/runbooks/alerts.md#long-suite-failing
      - eval_time: 15d
        alertname: HostileSuiteFailing
        exp_alerts: []
      - eval_time: 15d
        alertname: HostileSuiteMissing
        exp_alerts: []
  - interval: 1d
    input_series:
      - series: 'idleo_suite_passed{suite="hostile"}'
        values: '1x2'
      - series: 'idleo_suite_passed{suite="another"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 9d
        alertname: HostileSuiteMissing
        exp_alerts: []
      - eval_time: 11d
        alertname: HostileSuiteMissing
        exp_alerts:
          - exp_labels: {env: ci, severity: digest, suite: hostile}
            exp_annotations:
              summary: The hostile tests of the job sandbox hasn't reported for 8 days.
              runbook_url: https://github.com/GaMeBoY-21/IdleO/blob/main/docs/runbooks/alerts.md#long-suite-missing
  - interval: 7d
