[project]
name = "idleo"
version = "0.1.0"
description = "Run, follow and download IdleO sessions from Python and notebooks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.9,<3",
  "keyring>=25",
]

[dependency-groups]
dev = [
  "datamodel-code-generator>=0.28",
  "mypy>=1.13",
  "pytest>=8",
  "pyyaml>=6",
  "ruff>=0.8",
  "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["idleo"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["idleo/_generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "PLE"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests/", "scripts/"]

[[tool.mypy.overrides]]
module = "idleo._generated.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
