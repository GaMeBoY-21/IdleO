  # Kyverno 1.19.2 (ghcr.io/kyverno/kyverno and kyvernopre), its latest release (2026-10-20): go-jose 4.1.4 (a crafted
  # JWK set with RSA keys exhausts the parser) and Go 1.26.9. Kyverno takes traffic only from the API server and fetches
  # no JWK set; it reaches only GHCR and Sigstore, over TLS.
  - id: CVE-2026-116587
    paths: ["ko-app/kyverno", "ko-app/kyverno-init"]
    statement: in Kyverno 1.19.2, its latest release; taken in the release that fixes it (Renovate)
