secrets:
  # CloudNativePG's PostgreSQL image (ghcr.io/cloudnative-pg/postgresql) ships Debian's ssl-cert snakeoil key, made when
  # the image was built and so the same in every copy. Nothing uses it: CloudNativePG serves the certificates it issues.
  - id: private-key
    paths: ["/etc/ssl/private/ssl-cert-snakeoil.key"]
    statement: Debian's unused snakeoil key in CloudNativePG's PostgreSQL image, not a secret of ours
    expired_at: 2026-12-30
misconfigurations:
  # KSV-0109 ("ConfigMap with secrets") on idleo-values, the release's values (deploy/clusters/<env>/idleo/): its keys
  # named "secret" hold the names of Secrets (controlPlane.secret, valkey.secret, database.backups.secret), never a
  # value; every value is in a SOPS-encrypted Secret (ADR 0046).
  - id: KSV-0109
    paths: ["*ConfigMap*idleo-values*"]
    statement: a false positive, the keys named secret hold Secrets' names, not values
    expired_at: 2026-12-30
