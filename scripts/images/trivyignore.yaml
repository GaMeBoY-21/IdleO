  # usr/local/bin/trivy: Trivy 0.76.1's own go-jose (a DoS parsing JWKs with RSA keys). The scanner parses no JWK set
  # from anyone; it pulls images with a registry's token. Fixed in the next Trivy release, which Dependabot proposes.
  - id: CVE-2026-116587
    paths: ["usr/local/bin/trivy"]
    expired_at: 2027-01-31
  # usr/local/bin/wal-g: WAL-G v3.0.9, the newest release (ops/postgres/Dockerfile, ADR 0036), with Go modules its
  # maintainers haven't updated. It talks only to our own backup bucket over HTTPS. In the cluster it isn't configured (no
  # backups there until CloudNativePG, S3); ./start.sh's stack points it at local MinIO. Recheck at each WAL-G release.
  - id: CVE-2021-38599
    paths: ["usr/local/bin/wal-g"]
    expired_at: 2027-01-31
