# Findings the images workflow (.github/workflows/images.yml) accepts, each scoped to the one binary it's in, with why
# we can't fix it here and an expiry, after which the build fails again until it's looked at (ADR 0045). Everything
# else that is CRITICAL or HIGH with a fix fails the build. Each is in a Go binary that a base image or a release
# ships, which we don't build.
vulnerabilities:
  # usr/local/bin/gosu: gosu, from the official postgres image, built with Go 1.24.6: it only drops to the postgres user
  # and execs the server when the container starts as root (compose); it opens no connection and parses no certificate,
  # so the Go library's TLS, x509 and HTTP faults aren't reachable. In the cluster the container starts as 999 and gosu
  # never runs. Gone when the postgres image is rebuilt with a newer Go, or CloudNativePG replaces it (S3).
  - id: CVE-2025-61726
    paths: ["usr/local/bin/gosu"]
    expired_at: 2027-01-31
  - id: CVE-2025-61729
    paths: ["usr/local/bin/gosu"]
    expired_at: 2027-01-31
