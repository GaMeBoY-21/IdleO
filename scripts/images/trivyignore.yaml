# Findings the nightly scan (scripts/images/scan-deployed.sh, ADR 0048) accepts in vendors' images, each scoped to the
# binary or package it's in, with why and an expiry at most 60 days away, after which it fails again until it's
# looked at; scripts/checks/deploy.sh refuses an entry without a reason, scope or such an expiry. Every vendor below is
# on its latest release; the entries go when Renovate's weekly pull request brings the one with the fix. Nothing on our
# own images is ever accepted: they're scanned without this file, here and in .github/workflows/images.yml.
vulnerabilities:
  # CloudNativePG's operator 1.30.1 (ghcr.io/cloudnative-pg/cloudnative-pg), its latest release (2026-09-23), is built
  # with Go 1.27.1 and golang.org/x/net 0.58.0 (fixed in Go 1.27.3, x/net 0.60.0). It takes traffic only from the API
  # server and Prometheus inside the cluster, never from the internet (deploy/infrastructure/base/cloudnative-pg.yaml).
  - id: CVE-2026-78669
    paths: ["operator/manager_amd64", "operator/manager_arm64"]
    statement: in CloudNativePG 1.30.1's operator, its latest release; taken in the release that fixes it (Renovate)
    expired_at: 2026-12-30
