name: budgets

# The console's budgets (ADR 0052), on the seeded data: 100k users, 2k hosts, 1M sessions, 300k payments. The search box
# under 150 ms, a busy person's timeline under 300 ms, and a list's page under 200 ms, each at p95 on the server. Seeding
# makes it too slow for every change, so it's weekly and by hand, and it isn't a required check. It prints every figure.
on:
  schedule:
    - cron: "23 4 * * 2"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  budgets:
    name: console budgets
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: control-plane/pom.xml
      - name: The budgets
        working-directory: control-plane
        run: |
          set -o pipefail
          ./mvnw -B -ntp test -Dtest=ConsoleBudgetTests,QueueBudgetTests -Dgroups=budget -Dsurefire.excludedGroups= | grep -E '^budget:|Tests run:|BUILD'
      - if: always()
        uses: ./.github/actions/report-suite
        with:
          suite: budgets
          status: ${{ job.status }}
          endpoint: ${{ secrets.GRAFANA_CLOUD_OTLP_ENDPOINT }}
          authorization: ${{ secrets.GRAFANA_CLOUD_OTLP_AUTHORIZATION }}
