name: control-plane

on:
  push:
    branches: [main]
    paths: ["control-plane/**", "api/**", "proto/**", "templates/catalog.yaml", ".github/workflows/control-plane.yml"]
  pull_request:
    paths: ["control-plane/**", "api/**", "proto/**", "templates/catalog.yaml", ".github/workflows/control-plane.yml"]
  # Run by hand too, to check any commit against this workflow.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: control-plane/pom.xml
      # Everything in one build: compile with -Werror, enforcer, the
      # Testcontainers tests (Docker is on the runner), the modularity test,
      # Spotless and the JaCoCo report.
      - run: ./mvnw -B verify
