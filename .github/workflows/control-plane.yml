name: control-plane

on:
  push:
    branches: [main]
    paths: ["control-plane/**", "api/**", "proto/**", "templates/catalog.yaml", ".github/workflows/control-plane.yml", "scripts/checks/control-plane.sh"]
  # No path filter on pull requests: the ruleset on main requires this workflow's checks, and a check that never starts
  # would block the merge. Pushes to main still run only for the paths that matter.
  pull_request:
  # Run by hand too, to check any commit against this workflow.
  workflow_dispatch:

# A newer push to the same branch cancels this one's run: only the latest commit is worth the minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: control-plane verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: control-plane/pom.xml
      # Everything in one clean build: compile with -Werror, enforcer, the
      # Testcontainers tests (Docker is on the runner), the modularity test,
      # Spotless and the JaCoCo report; the same as scripts/check-all.sh.
      - run: scripts/checks/control-plane.sh
        working-directory: .
