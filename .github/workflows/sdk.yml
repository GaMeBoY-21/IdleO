name: sdk

# The Python SDK (ADR 0030): lint, types, unit tests on the oldest and newest supported Pythons, and the check that its
# generated layer still matches api/openapi.yaml and api/problems.json. The run against a real stack is in e2e.yml.
on:
  push:
    branches: [main]
    paths: ["sdk/python/**", "api/**", "cli/src/error.rs", "docs/site/generated/sdk.md", ".github/workflows/sdk.yml", "scripts/checks/sdk.sh"]
  pull_request:
    paths: ["sdk/python/**", "api/**", "cli/src/error.rs", "docs/site/generated/sdk.md", ".github/workflows/sdk.yml", "scripts/checks/sdk.sh"]
  # Run by hand too, to check any commit against this workflow.
  workflow_dispatch:

# A newer push to the same branch cancels this one's run: only the latest commit is worth the minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # uv fetches the Python itself, so the runner's own is never used.
      - name: Install uv
        run: python3 -m pip install uv==0.12.10
      # The same checks as scripts/check-all.sh: the locked dependencies, format, lint, types, tests, the generated
      # layer and the docs page against their sources.
      - name: Checks
        working-directory: .
        env:
          SDK_PYTHON: ${{ matrix.python }}
        run: scripts/checks/sdk.sh
      - name: Nothing generated is tracked
        run: test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }
