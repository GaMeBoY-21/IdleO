name: agent

on:
  push:
    branches: [main]
    paths: ["agent/**", "proto/**", ".github/workflows/agent.yml", "scripts/checks/agent.sh"]
  # No path filter on pull requests: the ruleset on main requires this workflow's checks, and a check that never starts
  # would block the merge. Pushes to main still run only for the paths that matter.
  pull_request:
  # Run by hand too, to check any commit against this workflow; by hand and weekly, on macOS and Windows as well.
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

# A newer push to the same branch cancels this one's run: only the latest commit is worth the minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: agent (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux on every push, as the cheapest runner; macOS (billed ten times over) and Windows (twice) only on the
        # weekly schedule and when run by hand.
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-24.04", "macos-latest", "windows-latest"]' || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: agent
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the toolchain pinned in agent/rust-toolchain.toml, with rustfmt and clippy.
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: agent
      # The same checks as scripts/check-all.sh runs on a laptop.
      - name: Format, lint and test
        shell: bash
        working-directory: .
        run: scripts/checks/agent.sh build
      - name: Nothing generated is tracked
        shell: bash
        run: test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }

  # The Windows app itself (ADR 0061): its four programs and the setup demo are built, the logic that is easy to get wrong is
  # tested, and the demo is started for a few seconds to prove the window and its page load. Everything else about it needs a
  # real laptop (docs/windows-laptop-test.md).
  windows-app:
    name: windows app
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agent
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: agent
      - name: Build the four programs, the agent and the setup demo
        run: cargo build --release --locked -p agent -p tray -p launcher -p setup
      - name: Unit tests of what is easy to get wrong
        run: cargo test --locked -p release -p setup -p tray -p launcher -p brand -p agent-windows -p agent --lib
      - name: The demo opens its window and its page loads
        shell: pwsh
        run: |
          foreach ($name in "IdleO-Setup-Demo.exe", "idleo-tray.exe", "idleo-launcher.exe", "idleo-hostd.exe", "idleo-agent.exe") {
            if (-not (Test-Path "target/release/$name")) { throw "$name wasn't built" }
          }
          $demo = Start-Process -FilePath "target/release/IdleO-Setup-Demo.exe" -ArgumentList "--smoke" -PassThru
          if (-not $demo.WaitForExit(60000)) { $demo.Kill(); throw "the demo window never closed" }
          if ($demo.ExitCode -ne 0) { throw "the demo's page didn't load (exit code $($demo.ExitCode))" }

  deny:
    name: agent deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: agent/Cargo.toml
          command: check
          arguments: --all-features
      # The tray and the setup app, for the Windows target they ship for (agent/deny-windows.toml).
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: agent/Cargo.toml
          command: check
          arguments: --all-features --config agent/deny-windows.toml
