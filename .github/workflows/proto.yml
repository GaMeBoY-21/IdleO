name: proto

on:
  push:
    branches: [main]
    paths: ["proto/**", ".github/workflows/proto.yml", "scripts/checks/proto.sh"]
  pull_request:
    paths: ["proto/**", ".github/workflows/proto.yml", "scripts/checks/proto.sh"]
  # Run by hand too, to check any commit against this workflow.
  workflow_dispatch:

# A newer push to the same branch cancels this one's run: only the latest commit is worth the minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  buf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so the breaking check can read the base branch
          # from the local .git (the repository is private).
          fetch-depth: 0
      # Only installs buf; the checks are the same as scripts/check-all.sh runs (scripts/checks/proto.sh).
      - uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          version: 1.73.0
          setup_only: true
      - name: Lint, format and build
        run: scripts/checks/proto.sh
      - name: No breaking change against the base branch
        if: github.event_name == 'pull_request'
        working-directory: proto
        run: buf breaking --against '../.git#commit=${{ github.event.pull_request.base.sha }},subdir=proto'
