name: e2e

# The compatibility test (ADR 0013): the real agent against the real control plane, on every change
# to either side or to the protocol between them.
on:
  push:
    branches: [main]
    paths: ["control-plane/**", "agent/**", "proto/**", "templates/catalog.yaml", "scripts/e2e/**", ".github/workflows/e2e.yml"]
  pull_request:
    paths: ["control-plane/**", "agent/**", "proto/**", "templates/catalog.yaml", "scripts/e2e/**", ".github/workflows/e2e.yml"]
  workflow_dispatch:
    inputs:
      upload_logs:
        description: Upload the logs even if the test passes
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  agent-online:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: control-plane/pom.xml
      # Installs the toolchain pinned in agent/rust-toolchain.toml.
      - name: Install the pinned Rust toolchain
        working-directory: agent
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: agent
      - name: The agent comes online and goes offline
        run: scripts/e2e/agent-online.sh
      # Logs only: the agent's keys, its config and every token stay out of the artifact.
      - name: Upload the logs
        if: failure() || inputs.upload_logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-logs
          path: private/e2e/*.log
          if-no-files-found: warn
          retention-days: 7
