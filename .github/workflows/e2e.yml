name: e2e

# The compatibility test (ADR 0013): the real agent against the real control plane, and the web app's
# journey through them (ADR 0018), on every change to any of them or to the protocol between them.
on:
  push:
    branches: [main]
    paths: ["control-plane/**", "agent/**", "cli/**", "sdk/**", "proto/**", "templates/**", "web/**", "api/**", "scripts/e2e/**", ".github/workflows/e2e.yml", "scripts/lib/**", "start.sh"]
  pull_request:
    paths: ["control-plane/**", "agent/**", "cli/**", "sdk/**", "proto/**", "templates/**", "web/**", "api/**", "scripts/e2e/**", ".github/workflows/e2e.yml", "scripts/lib/**", "start.sh"]
  workflow_dispatch:
    inputs:
      upload_logs:
        description: Upload the logs even if the test passes
        type: boolean
        default: false

# A newer push to the same branch cancels this one's run: only the latest commit is worth the minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  agent-online:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: control-plane/pom.xml
      # Installs the toolchain pinned in agent/rust-toolchain.toml.
      - name: Install the pinned Rust toolchain
        working-directory: agent
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: agent
      # The renter CLI, which the end-to-end run builds and drives (cli/rust-toolchain.toml pins the same toolchain).
      - name: Install the CLI's pinned Rust toolchain
        working-directory: cli
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: cli
      # The Python SDK, which the end-to-end run drives (ADR 0030); uv fetches the Python pinned in sdk/python itself.
      - name: Install uv
        run: python3 -m pip install uv==0.12.10
      # The web app, for its journey (web/.node-version, pnpm from web/package.json).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install Playwright's browser and its system libraries
        working-directory: web
        run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
      - name: The agent comes online, runs, loses and resumes sessions, and goes offline
        run: scripts/e2e/agent-online.sh
      - name: ./start.sh starts everything headless, runs a session, and --stop leaves nothing running
        run: scripts/e2e/start-check.sh
      # Logs only: the agent's keys, its config and every token stay out of the artifact.
      - name: Upload the logs
        if: failure() || inputs.upload_logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-logs
          path: |
            private/e2e/*.log
            logs/*.log
          if-no-files-found: warn
          retention-days: 7
