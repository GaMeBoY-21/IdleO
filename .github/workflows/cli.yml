name: cli

on:
  push:
    branches: [main]
    paths: ["cli/**", "api/**", "docs/site/generated/**", ".github/workflows/cli.yml", "scripts/checks/cli.sh"]
  pull_request:
    paths: ["cli/**", "api/**", "docs/site/generated/**", ".github/workflows/cli.yml", "scripts/checks/cli.sh"]
  # Run by hand too, to check any commit against this workflow; by hand and weekly, on macOS and Windows as well.
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

# A newer push to the same branch cancels this one's run: only the latest commit is worth the minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Linux on every push, as the cheapest runner; macOS (billed ten times over) and Windows (twice) only on the
        # weekly schedule and when run by hand.
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cli
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs the toolchain pinned in cli/rust-toolchain.toml, with rustfmt and clippy.
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: cli
      # The same checks as scripts/check-all.sh runs on a laptop.
      - name: Format, lint and test
        shell: bash
        working-directory: .
        run: scripts/checks/cli.sh build
      - name: Nothing generated is tracked
        shell: bash
        run: test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: cli/Cargo.toml
          command: check
          arguments: --all-features
