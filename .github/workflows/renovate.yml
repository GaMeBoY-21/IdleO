name: renovate

# The cluster's vendors kept current (ADR 0048; .github/renovate.json5): every Monday, one grouped pull request that
# moves Flux, the vendors' charts and every image pinned in deploy/ to its latest stable release, re-pinned by digest.
# It runs as the deploy app (ADR 0046), so its pull request starts the required checks as a person's does; a person
# reviews and merges it. The app's token lasts this run and may only write contents and pull requests.
on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    name: renovate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: The deploy app's token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.DEPLOY_APP_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: renovatebot/github-action@2804199d260ad00c1fae0e9e842888369391c776 # v46.3.10
        with:
          token: ${{ steps.app.outputs.token }}
          renovate-version: 44.166.0
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          # Flux's components are regenerated with the flux CLI, installed for the run.
          RENOVATE_BINARY_SOURCE: install
