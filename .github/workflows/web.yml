name: web

# The web app (ADR 0018): type check, lint, unit tests, both builds and the first-load budget, then every
# screen and state in a browser against the real stack, with axe, the visual baselines and Lighthouse's budgets.
on:
  push:
    branches: [main]
    paths: ["web/**", "api/**", "docs/site/**", "templates/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", "api/**", "docs/site/**", "templates/**", ".github/workflows/web.yml"]
  workflow_dispatch:
    inputs:
      update_screenshots:
        description: Accept every screenshot as the new baseline (web/README.md "Screenshots")
        type: boolean
        default: false

permissions:
  contents: read
  # Downloading the visual baselines of the last run on main.
  actions: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Audit the dependencies
        run: pnpm audit --audit-level high
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Unit and component tests
        run: pnpm test
      - name: Build for production (Firebase, placeholder settings) and check the first-load budget
        env:
          IDLEO_DEPLOYMENT: production
          IDLEO_SITE_URL: https://site.example.invalid
          VITE_API_URL: https://api.example.invalid
          VITE_STORAGE_URL: https://storage.example.invalid
          VITE_AUTH: firebase
          VITE_FIREBASE_API_KEY: placeholder-not-a-key
          VITE_FIREBASE_AUTH_DOMAIN: placeholder.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: placeholder
        run: pnpm build && pnpm size
      - name: A production build refuses the local sign-in adapter
        env:
          IDLEO_DEPLOYMENT: production
          VITE_API_URL: https://api.example.invalid
          VITE_STORAGE_URL: https://storage.example.invalid
          VITE_AUTH: oidc-mock
          VITE_OIDC_ISSUER: https://idp.example.invalid
          VITE_OIDC_CLIENT_ID: idleo
        run: |
          if pnpm exec vite build --outDir /tmp/refused >/tmp/refused.log 2>&1; then
            echo "a production build accepted the oidc-mock adapter"; exit 1
          fi
          grep -q "can't use the oidc-mock sign-in adapter" /tmp/refused.log

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: control-plane/pom.xml
      - name: Install the pinned Rust toolchain
        working-directory: agent
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: agent
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install Playwright's browser and its system libraries
        working-directory: web
        run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
      # The baselines are the last successful run on main's artifact, not files in git. Without one (the first
      # run, or after 90 days), the run writes them; a ticked "update screenshots" replaces them.
      # Visual comparison is off while the redesign settles (Nikki, Oct 8); the screens are checked by hand.
      # To turn it back on: remove the "false &&" here and below, and set VISUAL_COMPARE: "1" on the next step.
      - name: Fetch the visual baselines
        if: ${{ false && !inputs.update_screenshots }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow web.yml --branch main --status success \
            --limit 20 --json databaseId --jq '.[].databaseId' | while read -r id; do
              if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts" --jq '.artifacts[].name' | grep -qx visual-baseline; then
                echo "$id"; break
              fi
            done)"
          if [[ -n "$run_id" ]]; then
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -n visual-baseline -D web/visual-baseline
            echo "comparing with the baselines of run $run_id"
          else
            echo "no baselines yet: this run writes them"
          fi
      - name: Every screen and state, the journey, Lighthouse and the size budget, against the real stack
        env:
          E2E_UPDATE_SNAPSHOTS: ${{ inputs.update_screenshots && 'all' || '' }}
        run: scripts/e2e/agent-online.sh --web
      - name: Keep the visual baselines
        if: ${{ false && success() && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-baseline
          path: web/visual-baseline
          retention-days: 90
      # Every run's reports, passed or failed: three per screen on the mobile profile (the median is asserted), the
      # desktop ones, an HTML report of each, and the summary. The folders start with a dot, which upload-artifact
      # leaves out unless told.
      - name: Keep the Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse
          path: |
            web/.lighthouseci
            web/.lighthouseci-desktop
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
      # The report and the failed screenshots' diffs; logs only, never keys or tokens.
      - name: Keep the browser report and logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-report
          path: |
            web/playwright-report
            web/test-results
            private/e2e/*.log
          if-no-files-found: ignore
          retention-days: 7
