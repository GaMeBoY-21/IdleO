name: web

# The web app (ADR 0018): type check, lint, unit tests, both builds and the first-load budget, then every
# screen and state in a browser against the real stack, with axe, the visual baselines and Lighthouse's budgets.
on:
  push:
    branches: [main]
    paths: ["web/**", "api/**", "docs/site/**", "templates/**", ".github/workflows/web.yml", "scripts/checks/web.sh"]
  # No path filter on pull requests: the ruleset on main requires this workflow's checks, and a check that never starts
  # would block the merge. Pushes to main still run only for the paths that matter.
  pull_request:
  workflow_dispatch:
    inputs:
      update_screenshots:
        description: Accept every screenshot as the new baseline (web/README.md "Screenshots")
        type: boolean
        default: false

# A newer push to the same branch cancels this one's run: only the latest commit is worth the minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: web checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      # The same checks as scripts/check-all.sh: the audit, types, lint, unit tests, a production build with the
      # first-load budget, and a production build refusing the local sign-in adapter.
      - name: Checks without a browser
        working-directory: .
        run: scripts/checks/web.sh

  # On a pull request the long browser run starts only when something it covers changed (the workflow itself has no
  # path filter there, so the quick checks above always report).
  changes:
    name: web changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      browser: ${{ steps.paths.outputs.browser }}
    steps:
      - id: paths
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [[ "$EVENT" != pull_request ]]; then
            echo "browser=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename')"
          if grep -Eq '^(web/|api/|docs/site/|templates/|\.github/workflows/web\.yml$|scripts/checks/web\.sh$)' <<<"$files"; then
            echo "browser=true" >>"$GITHUB_OUTPUT"
          else
            echo "browser=false" >>"$GITHUB_OUTPUT"
            echo "no file the browser run covers changed"
          fi

  browser:
    name: web browser
    needs: changes
    if: ${{ needs.changes.outputs.browser == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Downloading the visual baselines and the Lighthouse baseline of the last run on main.
      actions: read
    # Every screen in four projects, the journeys, then Lighthouse three times a screen: about 57 minutes by Oct 14,
    # against 60. The budgets are lighthouserc.json's; this is only how long the runner may take.
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: control-plane/pom.xml
      - name: Install the pinned Rust toolchain
        working-directory: agent
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: agent
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install Playwright's browser and its system libraries
        working-directory: web
        run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
      # The baselines are the last successful run on main's artifact, not files in git. Without one (the first
      # run, or after 90 days), the run writes them; a ticked "update screenshots" replaces them.
      # Visual comparison is off while the redesign settles (the product owner, Oct 8); the screens are checked by hand.
      # To turn it back on: remove the "false &&" here and below, and set VISUAL_COMPARE: "1" on the next step.
      - name: Fetch the visual baselines
        if: ${{ false && !inputs.update_screenshots }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow web.yml --branch main --status success \
            --limit 20 --json databaseId --jq '.[].databaseId' | while read -r id; do
              if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts" --jq '.artifacts[].name' | grep -qx visual-baseline; then
                echo "$id"; break
              fi
            done)"
          if [[ -n "$run_id" ]]; then
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -n visual-baseline -D web/visual-baseline
            echo "comparing with the baselines of run $run_id"
          else
            echo "no baselines yet: this run writes them"
          fi
      # What Chrome's own throttling measured on each screen in the last green run on main (ADR 0018): this run is held to
      # within 10% of it, since the hosted runner is slower than the machine the 2,500 ms ceiling was set on. Without one
      # (the first run, or after 90 days) the run only reports, and its own medians become the next baseline.
      - name: Fetch the Lighthouse baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow web.yml --branch main --status success \
            --limit 20 --json databaseId --jq '.[].databaseId' | while read -r id; do
              if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts" --jq '.artifacts[].name' | grep -qx lighthouse-baseline; then
                echo "$id"; break
              fi
            done)"
          if [[ -n "$run_id" ]]; then
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -n lighthouse-baseline -D web/lighthouse-baseline
            echo "holding Chrome's own throttling to the medians of run $run_id"
          else
            echo "no Lighthouse baseline yet: this run writes it"
          fi
      - name: Every screen and state, the journey, Lighthouse and the size budget, against the real stack
        env:
          E2E_UPDATE_SNAPSHOTS: ${{ inputs.update_screenshots && 'all' || '' }}
          LIGHTHOUSE_BASELINE: lighthouse-baseline/baseline.json
        run: scripts/e2e/agent-online.sh --web
      - name: Keep the visual baselines
        if: ${{ false && success() && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-baseline
          path: web/visual-baseline
          retention-days: 90
      # Only a green run on main is a baseline: a slower run that failed the check must not become the next one's reference.
      - name: Keep the Lighthouse baseline
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-baseline
          path: web/.lighthouseci-devtools/baseline.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      # Every run's reports, passed or failed: three per screen on the mobile profile (the median is asserted), the
      # desktop ones, an HTML report of each, and the summary. The folders start with a dot, which upload-artifact
      # leaves out unless told.
      - name: Keep the Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse
          path: |
            web/.lighthouseci
            web/.lighthouseci-desktop
            web/.lighthouseci-devtools
            web/.lighthouseci-first-visit
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
      # The report and the failed screenshots' diffs; logs only, never keys or tokens.
      - name: Keep the browser report and logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-report
          path: |
            web/playwright-report
            web/test-results
            private/e2e/*.log
          if-no-files-found: ignore
          retention-days: 7
