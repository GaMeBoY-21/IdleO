name: scan

# What is deployed, scanned every night (ADR 0048): scripts/images/scan-deployed.sh runs Trivy, pinned as the images
# workflow pins it, on the exact image digests staging and production run (deploy/clusters/<env>/idleo/release.yaml),
# then brings up a k3d cluster from main under Flux, as production runs, and scans every running image in the
# namespaces we own (ours and the vendors'), their manifests, RBAC and secrets. A CRITICAL or HIGH vulnerability with a
# fix, a secret in an image, or a CRITICAL or HIGH finding, fails it; the accepted ones are vendors' only, in
# scripts/images/trivyignore.yaml, each scoped, with a reason and an expiry of at most 60 days, and an expired one fails
# too. A fix published after an image was built shows up here the next night, and a red run is
# a digest-level alert (NightlyScanFailing); a finding on main's images (staging's pins) that has stood a week pages
# (ImageFindingOld). Chosen over the Trivy Operator in the cluster, whose scans
# don't fit the server's memory at a canary's peak (ADR 0048).
on:
  schedule:
    - cron: "37 21 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # To fetch the last night's first-seen state (below).
  actions: read

jobs:
  scan:
    name: scan what is deployed
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      - name: Install k3d v5.9.0 and sops v3.13.3
        run: |
          curl -fsSLo k3d https://github.com/k3d-io/k3d/releases/download/v5.9.0/k3d-linux-amd64
          echo "06d8f25bc3a971c4eb29e0ff08429b180402db0f4dec838c9eac427e296800a0  k3d" | sha256sum -c -
          curl -fsSLo sops https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64
          echo "e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b  sops" | sha256sum -c -
          sudo install -m 0755 k3d sops /usr/local/bin/ && rm k3d sops
      # The local cluster's age key, which its committed Secrets (development's stand-ins) are encrypted for.
      - name: The local age key
        env:
          KEY: ${{ secrets.SOPS_AGE_KEY_LOCAL }}
        run: |
          [[ -n "$KEY" ]] || { echo "the repository secret SOPS_AGE_KEY_LOCAL is missing (docs/runbooks/deploying.md)"; exit 1; }
          mkdir -p private/k8s/age
          (umask 077 && printf '%s\n' "$KEY" >private/k8s/age/local.agekey)
      - name: The cluster from main
        env:
          GITOPS_BRANCH: ${{ github.ref_name }}
        run: scripts/k8s/up.sh --gitops
      # Each of main's findings' first night, from the newest earlier scan that kept it: how long the oldest has stood
      # pages at a week (ADR 0048). Without one (the first night, or 90 days without a scan) every finding starts today.
      - name: Main's findings' first nights
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow scan.yml --status completed --limit 10 \
            --json databaseId --jq '.[].databaseId')" || runs=""
          for run in $runs; do
            gh run download "$run" --repo "$GITHUB_REPOSITORY" --name scan-first-seen --dir private 2>/dev/null &&
              { echo "first nights from run $run"; break; }
          done
          [[ -s private/scan-first-seen.json ]] || echo "no earlier first nights: every finding starts tonight"
      - name: Scan
        env:
          KUBECONFIG: private/k8s/kubeconfig
        run: scripts/images/scan-deployed.sh --cluster --verbose
      - name: Keep the first nights
        if: always() && hashFiles('private/scan-first-seen.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scan-first-seen
          path: private/scan-first-seen.json
          retention-days: 90
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scan-logs
          path: private/k8s/logs/
          retention-days: 7
      # The result, to Grafana Cloud, where NightlyScanFailing and NightlyScanMissing (ops/alerts/security.yaml) read it:
      # a digest, never a page (ADR 0050).
      - name: Report
        if: always()
        uses: ./.github/actions/report-suite
        with:
          suite: scan
          status: ${{ job.status }}
          endpoint: ${{ secrets.GRAFANA_CLOUD_OTLP_ENDPOINT }}
          authorization: ${{ secrets.GRAFANA_CLOUD_OTLP_AUTHORIZATION }}
          findings-file: private/scan-findings.txt
          oldest-file: private/scan-oldest-seconds.txt
