name: scan

# What is deployed, scanned every night (ADR 0048): scripts/images/scan-deployed.sh runs Trivy, pinned as the images
# workflow pins it, on the exact image digests staging and production run (deploy/clusters/<env>/idleo/release.yaml),
# then brings up a k3d cluster from main under Flux, as production runs, and scans every running image in the
# namespaces we own (ours and the vendors'), their manifests, RBAC and secrets. A CRITICAL or HIGH vulnerability with a
# fix, or a CRITICAL or HIGH finding, fails it; the accepted ones are scripts/images/trivyignore.yaml, each with an
# expiry of at most 60 days. A fix published after an image was built shows up here the next night, and a red run is
# a digest-level alert (NightlyScanFailing), never a page. Chosen over the Trivy Operator in the cluster, whose scans
# don't fit the server's memory at a canary's peak (ADR 0048).
on:
  schedule:
    - cron: "37 21 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    name: scan what is deployed
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      - name: Install k3d v5.9.0 and sops v3.13.3
        run: |
          curl -fsSLo k3d https://github.com/k3d-io/k3d/releases/download/v5.9.0/k3d-linux-amd64
          echo "06d8f25bc3a971c4eb29e0ff08429b180402db0f4dec838c9eac427e296800a0  k3d" | sha256sum -c -
          curl -fsSLo sops https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64
          echo "e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b  sops" | sha256sum -c -
          sudo install -m 0755 k3d sops /usr/local/bin/ && rm k3d sops
      # The local cluster's age key, which its committed Secrets (development's stand-ins) are encrypted for.
      - name: The local age key
        env:
          KEY: ${{ secrets.SOPS_AGE_KEY_LOCAL }}
        run: |
          [[ -n "$KEY" ]] || { echo "the repository secret SOPS_AGE_KEY_LOCAL is missing (docs/runbooks/deploying.md)"; exit 1; }
          mkdir -p private/k8s/age
          (umask 077 && printf '%s\n' "$KEY" >private/k8s/age/local.agekey)
      - name: The cluster from main
        env:
          GITOPS_BRANCH: ${{ github.ref_name }}
        run: scripts/k8s/up.sh --gitops
      - name: Scan
        id: scan
        env:
          KUBECONFIG: private/k8s/kubeconfig
        run: scripts/images/scan-deployed.sh --cluster --verbose
      # The result, to Grafana Cloud, where NightlyScanFailing and NightlyScanMissing (ops/alerts/security.yaml) read it:
      # a digest, never a page. The OTLP endpoint and its Authorization header are production's own (ADR 0036), as
      # repository secrets; until they exist, the alert's missing-result rule is what says so.
      - name: Report
        if: always() && steps.scan.outcome != 'skipped'
        env:
          ENDPOINT: ${{ secrets.GRAFANA_CLOUD_OTLP_ENDPOINT }}
          AUTHORIZATION: ${{ secrets.GRAFANA_CLOUD_OTLP_AUTHORIZATION }}
          PASSED: ${{ steps.scan.outcome == 'success' && 1 || 0 }}
        run: |
          if [[ -z "$ENDPOINT" || -z "$AUTHORIZATION" ]]; then
            echo "::warning::GRAFANA_CLOUD_OTLP_ENDPOINT and GRAFANA_CLOUD_OTLP_AUTHORIZATION aren't set: the result isn't reported"
            exit 0
          fi
          findings="$(cat private/scan-findings.txt 2>/dev/null || echo 0)"
          python3 - "$PASSED" "$findings" >body.json <<'PY'
          import json, sys, time
          now = str(time.time_ns())
          point = lambda value: {"gauge": {"dataPoints": [{"asInt": str(value), "timeUnixNano": now}]}}
          print(json.dumps({"resourceMetrics": [{
              "resource": {"attributes": [{"key": "service.name", "value": {"stringValue": "nightly-scan"}}]},
              "scopeMetrics": [{"metrics": [
                  {"name": "idleo_nightly_scan_passed", **point(int(sys.argv[1]))},
                  {"name": "idleo_nightly_scan_findings", **point(int(sys.argv[2]))}]}]}]}))
          PY
          curl -fsS -X POST "$ENDPOINT/v1/metrics" -H "Authorization: $AUTHORIZATION" -H 'Content-Type: application/json' \
            --data-binary @body.json >/dev/null
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scan-logs
          path: private/k8s/logs/
          retention-days: 7
