name: next runner

# Every workflow pins its runner to ubuntu-24.04, so a change of what ubuntu-latest means can't break CI by itself. This
# runs the fast suites on ubuntu-latest once a week, so we see when it's safe to move the pin (ADR 0044).
on:
  schedule:
    - cron: "41 5 * * 3"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast-suites:
    name: fast suites on ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: control-plane/pom.xml
      - name: Install the pinned Rust toolchain
        working-directory: agent
        run: rustup toolchain install
      - name: Install uv
        run: python3 -m pip install --require-hashes -r .github/requirements/uv.txt
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: The fast suites, as scripts/check-all.sh runs them
        run: |
          status=0
          for suite in agent cli scanner proto sdk web control-plane; do
            if "scripts/checks/$suite.sh"; then echo "$suite PASS"; else echo "$suite FAIL"; status=1; fi
          done
          exit "$status"
      # To Grafana Cloud: a red week, or a silent one, is a ticket (ADR 0050).
      - name: Report
        if: always()
        uses: ./.github/actions/report-suite
        with:
          suite: next-runner
          status: ${{ job.status }}
          endpoint: ${{ secrets.GRAFANA_CLOUD_OTLP_ENDPOINT }}
          authorization: ${{ secrets.GRAFANA_CLOUD_OTLP_AUTHORIZATION }}
