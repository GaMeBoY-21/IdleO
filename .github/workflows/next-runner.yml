name: next runner

# Every workflow pins its runner to ubuntu-24.04, so a change of what ubuntu-latest means can't break CI by itself. This
# runs the fast suites on ubuntu-latest once a week, so we see when it's safe to move the pin (ADR 0044).
on:
  schedule:
    - cron: "41 5 * * 3"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast-suites:
    name: fast suites on ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: control-plane/pom.xml
      - name: Install the pinned Rust toolchain
        working-directory: agent
        run: rustup toolchain install
      - name: Install uv
        run: python3 -m pip install --require-hashes -r .github/requirements/uv.txt
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      # Only installs buf, as proto.yml does.
      - uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        with:
          version: 1.73.0
          setup_only: true
      # The Rust suites' build part only: their deny part reads advisories, not the runner, and runs in cargo-deny's
      # action in agent.yml, cli.yml and scanner.yml.
      - name: The fast suites, as scripts/check-all.sh runs them
        run: |
          status=0
          run() { if "scripts/checks/$1.sh" "${@:2}"; then echo "$* PASS"; else echo "$* FAIL"; status=1; fi; }
          for suite in agent cli scanner; do run "$suite" build; done
          for suite in proto sdk web control-plane; do run "$suite"; done
          exit "$status"
      # To Grafana Cloud: a red week, or a silent one, is a ticket (ADR 0050).
      - name: Report
        if: always()
        uses: ./.github/actions/report-suite
        with:
          suite: next-runner
          status: ${{ job.status }}
          endpoint: ${{ secrets.GRAFANA_CLOUD_OTLP_ENDPOINT }}
          authorization: ${{ secrets.GRAFANA_CLOUD_OTLP_AUTHORIZATION }}
