name: images

# The server's container images (ADR 0045): control-plane, web, scanner and postgres. On every pull request each is
# built and scanned; on main (and a release tag) the very bytes that were scanned are pushed to GHCR, signed keylessly
# with cosign (this workflow's GitHub identity; no key is stored anywhere), and given a CycloneDX bill of materials and
# a build provenance attestation. scripts/images/verify.sh checks all three. The Helm chart (deploy/helm/idleo) is
# published beside them as an OCI artifact, versioned with the commit and signed the same way, for Flux to verify.
# Only main and release tags publish: a run by hand on any other branch builds and scans, nothing more.
on:
  push:
    branches: [main]
    tags: ["v*"]
  # No path filter: every change to main gets images tagged with its commit, and every pull request has them scanned.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push to a branch cancels its run; on main every commit's images are published.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Trivy as the image scanner runs it (scanner/Dockerfile), and syft for the bills of materials, each pinned by digest.
  TRIVY_IMAGE: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
  SYFT_IMAGE: anchore/syft:v1.54.1@sha256:3eb5379ba7b409c3f4069b686110527af0c47df993fa5c10d13e7cf34f49b1aa
  REGISTRY: ghcr.io/gameboy-21

jobs:
  build:
    name: image ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: control-plane, context: ., file: control-plane/Dockerfile }
          - { image: web, context: ., file: web/Dockerfile }
          - { image: scanner, context: scanner, file: scanner/Dockerfile }
          - { image: postgres, context: ops/postgres, file: ops/postgres/Dockerfile }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          load: true
          tags: idleo-${{ matrix.image }}:ci
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
      # Any CRITICAL or HIGH finding that has a fix fails the build, but for the few scripts/images/trivyignore.yaml
      # accepts, each with its reason and an expiry; one without a fix is reported, not fatal.
      - name: Scan with Trivy
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/scripts/images/trivyignore.yaml:/ignore.yaml:ro" \
            "$TRIVY_IMAGE" image --no-progress --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed \
            --ignorefile /ignore.yaml --exit-code 1 "idleo-${{ matrix.image }}:ci"
      - name: Size
        run: |
          docker image inspect "idleo-${{ matrix.image }}:ci" --format '{{.Size}}' |
            awk '{printf "idleo-${{ matrix.image }}: %.0f MB\n", $1 / 1000000}' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep the scanned image for publishing
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: docker save "idleo-${{ matrix.image }}:ci" | gzip -1 >"idleo-${{ matrix.image }}.tar.gz"
      - if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ matrix.image }}
          path: idleo-${{ matrix.image }}.tar.gz
          retention-days: 1

  publish:
    name: publish ${{ matrix.image }}
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [control-plane, web, scanner, postgres]
    # Only this job may push packages, ask GitHub for an OIDC token (cosign's keyless signature) and write attestations.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ matrix.image }}
      - name: Load the scanned image
        run: gunzip -c "idleo-${{ matrix.image }}.tar.gz" | docker load
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push, tagged with the commit (and the release)
        id: push
        env:
          NAME: ${{ env.REGISTRY }}/idleo-${{ matrix.image }}
        run: |
          tags=("$GITHUB_SHA")
          [[ "$GITHUB_REF_TYPE" == tag ]] && tags+=("$GITHUB_REF_NAME")
          for tag in "${tags[@]}"; do
            docker tag "idleo-${{ matrix.image }}:ci" "$NAME:$tag"
            docker push -q "$NAME:$tag"
          done
          digest="$(docker image inspect "$NAME:$GITHUB_SHA" --format '{{join .RepoDigests "\n"}}' | sed -n "s|^$NAME@||p" | head -1)"
          [[ "$digest" == sha256:* ]] || { echo "no digest for $NAME"; exit 1; }
          echo "name=$NAME" >>"$GITHUB_OUTPUT"
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
          echo "$NAME@$digest" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign
        run: cosign sign --yes "${{ steps.push.outputs.name }}@${{ steps.push.outputs.digest }}"
      - name: Attach the bill of materials
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$SYFT_IMAGE" \
            "docker:idleo-${{ matrix.image }}:ci" -o cyclonedx-json >sbom.cdx.json
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json \
            "${{ steps.push.outputs.name }}@${{ steps.push.outputs.digest }}"
      - name: Attest the build's provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  chart:
    name: publish chart
    needs: publish
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      # Docker's login, which cosign uses to push the signature; Helm keeps its own.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # <Chart.yaml's version>-<commit>, so every build of main is its own version; the chart's first source links the
      # package to this repository, which makes it public as the images are (Flux pulls it with no token).
      - name: Package and push, versioned with the commit
        id: push
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          version="$(sed -n 's/^version: //p' deploy/helm/idleo/Chart.yaml)-$GITHUB_SHA"
          helm package deploy/helm/idleo --version "$version" --app-version "$GITHUB_SHA" --destination chart
          helm push "chart/idleo-$version.tgz" "oci://$REGISTRY/charts" 2>&1 | tee push.log
          digest="$(sed -n 's/^Digest: //p' push.log)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "helm push gave no digest"; exit 1; }
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
          echo "$REGISTRY/charts/idleo:$version@$digest" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign
        run: cosign sign --yes "$REGISTRY/charts/idleo@${{ steps.push.outputs.digest }}"
