# What renters can run in Phase 1 (ADR 0015): the only source, reviewed in git.
# The control plane bundles this file, refuses to start on a malformed entry,
# and serves it at GET /v1/templates. Every image is pinned by digest; cosign
# signatures are verified once the registry exists (technical design line 83).
#
# Services (ADR 0021, product surface 3.0) come first: what a renter can run, one tile on Home and
# one choice in Book. A template is one way to run a service. GET /v1/templates lists a service only
# once at least one template names it, so a service whose image isn't signed yet stays out of sight.
#
# Service fields:
#   id, name               stable id and display name
#   tagline                a few words under the name ("a model on your data")
#   running_label          what a running session of it is doing, on its live screen ("Fine-tuning")
#   icon                   one of: layers, code, table, cube, notebook, plug, gamepad, flask, pulse;
#                          each client draws its own
#   hidden                 optional, true to keep it off Home and Book's list (its templates still book)
#
# Template fields:
#   id, name               stable id and display name
#   service                the service it's one way to run
#   description            one line on what it does
#   image                  container image, always with @sha256:<digest>
#   args                   arguments to the image's entrypoint
#   min_vram_mb            the least GPU memory it needs; a renter may ask for more
#   default_max_runtime    how long a session may run unless the renter says otherwise
#   max_runtime_cap        the most a renter may ask for
#   typical_runtime        optional: about how long it usually takes, for the booking screen
#   memory_mb, cpu_millicores, pids_limit, scratch_mb   container limits (technical design, compute sandbox)
#   checkpoint_interval    how often the job checkpoints
#   inputs                 optional: what the renter brings (ADR 0022). We provide the GPU; renters bring
#                          their own model, data and code, and no template ever supplies a model.
#     - name               ^[a-z][a-z0-9_]{0,31}$, unique in the template
#       label, help        what the booking screen shows
#       kind               folder (a model, a project; one file, a zip, is fine too) | file (exactly one)
#       accepts            [upload], [link] or [upload, link]. An upload is staged by the agent into
#                          /work/input/<name>/, paths kept (SESSION_INPUT_<NAME>_DIR); a link is an https URL,
#                          SESSION_INPUT_<NAME>_URL, which the job fetches itself inside its sandbox; the
#                          agent never fetches a renter's link
#       required           true or false (default false)
#       max_size_gb        for uploads: the largest it takes, in GiB (2^30 bytes); 0.5 is fine
#   params                 optional: what the renter can set (ADR 0019), each reaching the job as the
#                          environment variable SESSION_PARAM_<NAME>; never secrets, which come later
#                          through Credentials:
#     - name               ^[a-z][a-z0-9_]{0,31}$, unique in the template
#       label, help        what the booking form, the CLI and the SDK show
#       type               string | integer | number | boolean | choice
#       group              basic (asked as a plain question, so listed in questions) | advanced (behind the
#                          one "Advanced" row, with its default set; never required)
#       required           true or false (default false); a required parameter has no default
#       default            optional; must itself pass the rules below
#       min, max           integer and number only
#       max_length         string only; 1,000 if not given, never above 4,096
#       choices            choice only: at least 2
#   questions              optional: the plain questions, asked after the inputs, in this order; each one of
#     - preset: <name>     a choice that sets several advanced parameters at once, with label, help,
#                          default (an option's id) and options, each { id, label, minutes (typical, for
#                          the screen's time and price), sets: { <param>: <value> } }. The booking keeps
#                          the chosen option's id, so Run again asks the same way
#     - param: <name>      a basic parameter; every basic parameter is asked exactly once
#     - gpu_memory: true   the GPU memory the job needs, with label, help, choices_gb (from 8, 12, 16, 24)
#                          and default_gb
#   budget_chips           optional: the spending caps the booking screen offers, in paise, rising; the
#   default_budget         screen adds "Other amount". Both or neither
#   vram_from_input        optional: { input, base_mb, per_gb_mb }. When that input is an upload, the GPU
#                          memory needed is base_mb plus per_gb_mb for each GiB of it, never below
#                          min_vram_mb, rounded up to a GPU class (8, 12, 16, 24 GB). A link's size isn't
#                          known, so it needs min_vram_mb
#   you_get                optional: what the renter gets back, in a few words, for the booking screen's
#                          summary ("adapter_model.safetensors and its training log")
#
# A template's inputs, questions and parameters are described here once; the web form, the CLI's flags and the
# SDK's arguments are all made from GET /v1/templates.
services:
  - id: fine-tune
    name: Fine-tune a model
    tagline: a model on your data
    running_label: Fine-tuning
    icon: layers
  - id: run-code
    name: Run your code
    tagline: your folder, our GPU
    running_label: Running your code
    icon: code
  # Checks a host's GPU works; booked by support and the CLI, not offered on Home.
  - id: diagnostics
    name: Diagnostics
    tagline: check a GPU works
    running_label: Checking the GPU
    icon: pulse
    hidden: true

templates:
  - id: cuda-smoke-test
    service: diagnostics
    name: CUDA smoke test
    description: Prints the GPU the job sees, proving the GPU reaches the container.
    # The CUDA base image Phase 0 pins (phase0/wsl/gpu-common.sh): prints the
    # GPU it sees, proving the GPU reaches the container.
    image: nvidia/cuda:12.8.1-base-ubuntu24.04@sha256:133c78a0575303be34164d0b90137a042172bdf60696af01a3c424ab402d86e2
    args: ["nvidia-smi"]
    min_vram_mb: 1024
    default_max_runtime: 5m
    max_runtime_cap: 15m
    memory_mb: 2048
    cpu_millicores: 2000
    pids_limit: 256
    scratch_mb: 1024
    checkpoint_interval: 5m
    typical_runtime: 30s
  # The renter's own container image (ADR 0042), for renters with a verified PAN: the booking names an image whose check
  # on our server is complete (POST /v1/images), pinned by digest; it's pulled at the start (never charged) and deleted
  # from the host after. The sandbox and the job contract are the same as for every template.
  - id: custom-image
    service: run-code
    name: Use my own image
    description: Bring your own container image; we check it, run your command (or the image's own) on a GPU, and you get back what it writes to /work/outputs.
    own_image: true
    min_vram_mb: 4096
    default_max_runtime: 3h
    max_runtime_cap: 12h
    memory_mb: 12288
    cpu_millicores: 6000
    pids_limit: 512
    scratch_mb: 20480
    checkpoint_interval: 5m
    inputs:
      - name: files
        label: Your files
        help: A folder your job reads, if it needs one. It's at /work/input/files/ (SESSION_INPUT_FILES_DIR).
        kind: folder
        accepts: [upload]
        max_size_gb: 40
    questions:
      - param: command
      - gpu_memory: true
        label: GPU memory you need
        choices_gb: [8, 12, 16, 24]
        default_gb: 8
    params:
      - name: command
        label: Command
        help: What to run in your image, with /bin/sh -c, from its own working directory. Leave it empty to run the image's own entrypoint and command.
        type: string
        group: basic
        max_length: 1000
    budget_chips: [5000, 10000, 50000]
    default_budget: 10000
    you_get: whatever your job writes to /work/outputs
