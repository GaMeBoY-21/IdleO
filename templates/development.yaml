# Local runs and the end-to-end test only (ADR 0016): the smoke test as the
# agent's development runner (--dev-runner) runs it on a machine without a GPU.
# The development runner simulates the job for the --duration in its arguments
# against real object storage, checkpointing every checkpoint_interval. Chosen
# with SESSIONS_TEMPLATES_CATALOG=file:<path to this file>; the control plane
# refuses to start the prod profile with any catalog but the bundled one, and
# this file isn't bundled. Same fields as catalog.yaml.
#
# The production services come first, with exactly catalog.yaml's id, name, tagline,
# running_label and icon (a control-plane test fails if they differ), so the local stack shows the
# real wording. Each has one template the development runner simulates (--simulate <kind>): the real
# template's shape of parameters and input, generated log lines and outputs, never a real model. Then
# "Test jobs", the templates the end-to-end test books.
services:
  - id: fine-tune
    name: Fine-tune a model
    tagline: a model on your data
    running_label: Fine-tuning
    icon: layers
  - id: run-code
    name: Run your code
    tagline: your folder, our GPU
    running_label: Running your code
    icon: code
  - id: developer-tests
    name: Test jobs
    tagline: jobs for trying the platform
    running_label: Running a test job
    icon: flask
    hidden: true

templates:
  # The services, simulated: 90 to 120 seconds each, checkpointing every 5 seconds. Both of the
  # local stack's fake GPUs (8 and 12 GB) fit every one, so booking shows a price range.
  - id: fine-tune-simulated
    service: fine-tune
    name: Fine-tune your model (simulated)
    description: Bring your model and your examples; you get back a LoRA adapter for your model. Simulated on the development runner.
    image: nvidia/cuda:12.8.1-base-ubuntu24.04@sha256:133c78a0575303be34164d0b90137a042172bdf60696af01a3c424ab402d86e2
    args: ["--duration", "120s", "--simulate", "fine-tune"]
    min_vram_mb: 6144
    typical_runtime: 120s
    default_max_runtime: 10m
    max_runtime_cap: 15m
    memory_mb: 8192
    cpu_millicores: 4000
    pids_limit: 512
    scratch_mb: 4096
    checkpoint_interval: 5s
    inputs:
      - name: model
        label: Your model
        help: Upload the model folder from your laptop, pick it from My files, or paste a Hugging Face link.
        kind: folder
        accepts: [upload, link]
        required: true
        max_size_gb: 40
        # Checked when it's booked, for an upload (a link is checked by the job): a Hugging Face model's folder, or a zip of one.
        must_contain:
          - any_of: [config.json]
            max_depth: 2
            message: This folder has no config.json, so it isn't a Hugging Face model. Upload the model's folder, the one with config.json and the weights.
          - any_of: ["*.safetensors", "*.bin"]
            message: This folder has no weights file (.safetensors or .bin). Upload the model's folder, the one with config.json and the weights.
      - name: data
        label: Your training data
        help: A JSONL file, one example a line.
        kind: file
        accepts: [upload, link]
        required: true
        max_size_gb: 10
        accepts_extensions: [.jsonl, .json]
        not_accepted: This file isn't JSONL. Use a .jsonl file with one example per line.
    questions:
      - preset: thoroughness
        label: How thorough?
        options:
          - { id: quick, label: Quick, minutes: 15, sets: { epochs: 1 } }
          - { id: standard, label: Standard, minutes: 45, sets: { epochs: 3 } }
          - { id: thorough, label: Thorough, minutes: 75, sets: { epochs: 5 } }
        default: standard
    params:
      - name: epochs
        label: Epochs
        help: How many times training goes through your examples.
        type: integer
        group: advanced
        default: 3
        min: 1
        max: 5
      - name: learning_rate
        label: Learning rate
        help: How big each training step is.
        type: number
        group: advanced
        default: 0.0002
        min: 0.000001
        max: 0.01
      - name: lora_rank
        label: LoRA rank
        help: A higher rank learns more, and makes a bigger adapter.
        type: choice
        group: advanced
        default: "16"
        choices: ["8", "16", "32"]
    budget_chips: [5000, 10000, 50000]
    default_budget: 10000
    vram_from_input: { input: model, base_mb: 2048, per_gb_mb: 700 }
    you_get: adapter_model.safetensors and its training log
  - id: run-code-simulated
    service: run-code
    name: Run your Python project (simulated)
    description: Bring your project folder; we run your command on a GPU and you get back what it writes to outputs/. Simulated on the development runner.
    image: nvidia/cuda:12.8.1-base-ubuntu24.04@sha256:133c78a0575303be34164d0b90137a042172bdf60696af01a3c424ab402d86e2
    args: ["--duration", "90s", "--simulate", "run-code"]
    min_vram_mb: 4096
    typical_runtime: 90s
    default_max_runtime: 10m
    max_runtime_cap: 15m
    memory_mb: 8192
    cpu_millicores: 4000
    pids_limit: 512
    scratch_mb: 4096
    checkpoint_interval: 5s
    inputs:
      - name: code
        label: Your code
        help: Your project folder, or a zip of it. Anything it writes to outputs/ comes back to you.
        kind: folder
        accepts: [upload]
        required: true
        max_size_gb: 10
      - name: data
        label: Your data
        help: A folder your code reads, if it needs one.
        kind: folder
        accepts: [upload]
        max_size_gb: 40
    questions:
      - param: command
      - gpu_memory: true
        label: GPU memory you need
        choices_gb: [8, 12, 16, 24]
        default_gb: 8
    params:
      - name: command
        label: Command
        help: What to run, from the top of your folder.
        type: string
        group: basic
        default: python main.py
        max_length: 500
    budget_chips: [5000, 10000, 50000]
    default_budget: 10000
    you_get: whatever your code writes to outputs/
  - id: cuda-smoke-test
    service: developer-tests
    name: CUDA smoke test (development runner)
    description: Simulates the smoke test for 20 seconds, checkpointing every 5.
    image: nvidia/cuda:12.8.1-base-ubuntu24.04@sha256:133c78a0575303be34164d0b90137a042172bdf60696af01a3c424ab402d86e2
    args: ["--duration", "20s"]
    min_vram_mb: 1024
    default_max_runtime: 5m
    max_runtime_cap: 15m
    memory_mb: 2048
    cpu_millicores: 2000
    pids_limit: 256
    scratch_mb: 1024
    checkpoint_interval: 5s
  # Metering in the end-to-end test (ADR 0017): two and a half minutes, charged
  # as three; and a long run, for a stop mid-run and the spending cap.
  - id: charged-run
    service: developer-tests
    name: Charged run, 150 seconds (development runner)
    description: Runs 150 seconds, charged as three started minutes.
    image: nvidia/cuda:12.8.1-base-ubuntu24.04@sha256:133c78a0575303be34164d0b90137a042172bdf60696af01a3c424ab402d86e2
    args: ["--duration", "150s"]
    min_vram_mb: 1024
    typical_runtime: 150s
    default_max_runtime: 10m
    max_runtime_cap: 15m
    memory_mb: 2048
    cpu_millicores: 2000
    pids_limit: 256
    scratch_mb: 1024
    checkpoint_interval: 5s
  - id: long-run
    service: developer-tests
    name: Long run, 10 minutes (development runner)
    description: Runs 10 minutes, for stopping mid-way and the spending cap.
    image: nvidia/cuda:12.8.1-base-ubuntu24.04@sha256:133c78a0575303be34164d0b90137a042172bdf60696af01a3c424ab402d86e2
    args: ["--duration", "10m"]
    min_vram_mb: 1024
    typical_runtime: 10m
    default_max_runtime: 15m
    max_runtime_cap: 15m
    memory_mb: 2048
    cpu_millicores: 2000
    pids_limit: 256
    scratch_mb: 1024
    checkpoint_interval: 5s
  # The booking contract in the end-to-end test (ADR 0019): parameters and an
  # input reach the job. The development runner writes each staged input file's
  # SHA-256, every SESSION_PARAM_* it saw, and the greeting repeated, into
  # result.json.
  - id: echo-input
    service: developer-tests
    name: Echo an input (development runner)
    description: Reads its input and parameters back, proving the job saw them exactly.
    image: nvidia/cuda:12.8.1-base-ubuntu24.04@sha256:133c78a0575303be34164d0b90137a042172bdf60696af01a3c424ab402d86e2
    args: ["--duration", "20s"]
    min_vram_mb: 1024
    default_max_runtime: 5m
    max_runtime_cap: 15m
    typical_runtime: 20s
    memory_mb: 2048
    cpu_millicores: 2000
    pids_limit: 256
    scratch_mb: 1024
    checkpoint_interval: 5s
    params:
      - name: greeting
        label: Greeting
        help: Written back in the output, once per repeat.
        type: string
        group: basic
        required: true
        max_length: 200
      - name: repeat
        label: Repeat
        help: How many times the greeting is written back.
        type: integer
        group: advanced
        default: 1
        min: 1
        max: 5
    inputs:
      - name: file
        label: File to echo
        help: Any file; the output gives its size and SHA-256.
        kind: file
        accepts: [upload, link]
        required: true
        max_size_gb: 0.5
    questions:
      - param: greeting
  # The biggest GPU class, 24 GB. The local stack's laptops have 8 and 12 GB; the end-to-end test's only
  # 24 GB host has too little free disk for any session (ADR 0022). So no host is ever free for it: the
  # booking screen shows "No GPU is free right now", a booking without a price ceiling gets no-gpu-free,
  # and one with a ceiling ends NO_HOST_FREE without an offer.
  - id: needs-big-gpu
    service: developer-tests
    name: Needs a big GPU (development runner)
    description: Asks for a 24 GB GPU, which no development host has free.
    image: nvidia/cuda:12.8.1-base-ubuntu24.04@sha256:133c78a0575303be34164d0b90137a042172bdf60696af01a3c424ab402d86e2
    args: ["--duration", "20s"]
    min_vram_mb: 24000
    default_max_runtime: 5m
    max_runtime_cap: 15m
    memory_mb: 2048
    cpu_millicores: 2000
    pids_limit: 256
    scratch_mb: 1024
    checkpoint_interval: 5s
