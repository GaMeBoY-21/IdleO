# Local runs and the end-to-end test only (ADR 0016): the smoke test as the
# agent's development runner (--dev-runner) runs it on a machine without a GPU.
# The development runner simulates the job for the --duration in its arguments
# against real object storage, checkpointing every checkpoint_interval. Chosen
# with SESSIONS_TEMPLATES_CATALOG=file:<path to this file>; the control plane
# refuses to start the prod profile with any catalog but the bundled one, and
# this file isn't bundled. Same fields as catalog.yaml.
#
# The production services come first, with exactly catalog.yaml's id, name, tagline,
# running_label and icon (a control-plane test fails if they differ), so the local stack shows the
# real wording. Each has one template the development runner simulates (--simulate <kind>): the real
# template's shape of parameters and input, generated log lines and outputs, never a real model. Then
# "Test jobs", the templates the end-to-end test books.
services:
  - id: fine-tune
    name: Fine-tune a model
    tagline: a model on your data
    running_label: Fine-tuning
    icon: layers
  - id: run-code
    name: Run your code
    tagline: your folder, our GPU
    running_label: Running your code
    icon: code
  - id: developer-tests
    name: Test jobs
    tagline: jobs for trying the platform
    running_label: Running a test job
    icon: flask

templates:
  # The services, simulated: 90 to 120 seconds each, checkpointing every 5 seconds. Both of the
  # local stack's fake GPUs (8 and 12 GB) fit every one, so booking shows a price range.
  - id: fine-tune-simulated
    service: fine-tune
    name: Fine-tune a small model (simulated)
    description: Simulated on the development runner; trains a LoRA adapter on your JSONL examples.
    image: nvidia/cuda:12.8.1-base-ubuntu24.04@sha256:133c78a0575303be34164d0b90137a042172bdf60696af01a3c424ab402d86e2
    args: ["--duration", "120s", "--simulate", "fine-tune"]
    min_vram_mb: 6144
    typical_runtime: 120s
    default_max_runtime: 10m
    max_runtime_cap: 15m
    memory_mb: 8192
    cpu_millicores: 4000
    pids_limit: 512
    scratch_mb: 4096
    checkpoint_interval: 5s
    params:
      - name: base_model
        label: Base model
        help: The model the adapter is trained on.
        type: choice
        default: Qwen2.5 0.5B Instruct
        choices: [Qwen2.5 0.5B Instruct, Llama 3.2 1B Instruct]
      - name: epochs
        label: Epochs
        help: How many times training goes through your examples.
        type: integer
        default: 2
        min: 1
        max: 5
      - name: lora_rank
        label: LoRA rank
        help: A higher rank learns more, and makes a bigger adapter.
        type: choice
        default: "16"
        choices: ["8", "16", "32"]
    input:
      accepts: required
      upload: true
      max_size_mb: 1024
      label: Training examples (JSONL)
      help: One example a line, as JSON.
  - id: run-code-simulated
    service: run-code
    name: Run a Python project (simulated)
    description: Simulated on the development runner; runs a command in your zipped project.
    image: nvidia/cuda:12.8.1-base-ubuntu24.04@sha256:133c78a0575303be34164d0b90137a042172bdf60696af01a3c424ab402d86e2
    args: ["--duration", "90s", "--simulate", "run-code"]
    min_vram_mb: 4096
    typical_runtime: 90s
    default_max_runtime: 10m
    max_runtime_cap: 15m
    memory_mb: 8192
    cpu_millicores: 4000
    pids_limit: 512
    scratch_mb: 4096
    checkpoint_interval: 5s
    params:
      - name: command
        label: Command
        help: What to run, from the top of your folder.
        type: string
        default: python main.py
        max_length: 500
    input:
      accepts: required
      upload: true
      max_size_mb: 2048
      label: Your project (zip)
      help: The folder with your code, zipped. Anything it writes to outputs/ comes back to you.
  - id: cuda-smoke-test
    service: developer-tests
    name: CUDA smoke test (development runner)
    description: Simulates the smoke test for 20 seconds, checkpointing every 5.
    image: nvidia/cuda:12.8.1-base-ubuntu24.04@sha256:133c78a0575303be34164d0b90137a042172bdf60696af01a3c424ab402d86e2
    args: ["--duration", "20s"]
    min_vram_mb: 1024
    default_max_runtime: 5m
    max_runtime_cap: 15m
    memory_mb: 2048
    cpu_millicores: 2000
    pids_limit: 256
    scratch_mb: 1024
    checkpoint_interval: 5s
    input:
      accepts: none
  # Metering in the end-to-end test (ADR 0017): two and a half minutes, charged
  # as three; and a long run, for a stop mid-run and the spending cap.
  - id: charged-run
    service: developer-tests
    name: Charged run, 150 seconds (development runner)
    description: Runs 150 seconds, charged as three started minutes.
    image: nvidia/cuda:12.8.1-base-ubuntu24.04@sha256:133c78a0575303be34164d0b90137a042172bdf60696af01a3c424ab402d86e2
    args: ["--duration", "150s"]
    min_vram_mb: 1024
    typical_runtime: 150s
    default_max_runtime: 10m
    max_runtime_cap: 15m
    memory_mb: 2048
    cpu_millicores: 2000
    pids_limit: 256
    scratch_mb: 1024
    checkpoint_interval: 5s
  - id: long-run
    service: developer-tests
    name: Long run, 10 minutes (development runner)
    description: Runs 10 minutes, for stopping mid-way and the spending cap.
    image: nvidia/cuda:12.8.1-base-ubuntu24.04@sha256:133c78a0575303be34164d0b90137a042172bdf60696af01a3c424ab402d86e2
    args: ["--duration", "10m"]
    min_vram_mb: 1024
    typical_runtime: 10m
    default_max_runtime: 15m
    max_runtime_cap: 15m
    memory_mb: 2048
    cpu_millicores: 2000
    pids_limit: 256
    scratch_mb: 1024
    checkpoint_interval: 5s
  # The booking contract in the end-to-end test (ADR 0019): parameters and an
  # input reach the job. The development runner writes the input's SHA-256,
  # every SESSION_PARAM_* it saw, and the greeting repeated, into result.json.
  - id: echo-input
    service: developer-tests
    name: Echo an input (development runner)
    description: Reads its input and parameters back, proving the job saw them exactly.
    image: nvidia/cuda:12.8.1-base-ubuntu24.04@sha256:133c78a0575303be34164d0b90137a042172bdf60696af01a3c424ab402d86e2
    args: ["--duration", "20s"]
    min_vram_mb: 1024
    default_max_runtime: 5m
    max_runtime_cap: 15m
    typical_runtime: 20s
    memory_mb: 2048
    cpu_millicores: 2000
    pids_limit: 256
    scratch_mb: 1024
    checkpoint_interval: 5s
    params:
      - name: greeting
        label: Greeting
        help: Written back in the output, once per repeat.
        type: string
        required: true
        max_length: 200
      - name: repeat
        label: Repeat
        help: How many times the greeting is written back.
        type: integer
        default: 1
        min: 1
        max: 5
    input:
      accepts: required
      upload: true
      url: true
      max_size_mb: 512
      label: File to echo
      help: Any file; the output gives its size and SHA-256.
  # More GPU memory than any development host has, so the booking screen can show "No GPU is free
  # right now" on any local stack, and a booking without a price ceiling gets no-gpu-free.
  - id: needs-big-gpu
    service: developer-tests
    name: Needs a big GPU (development runner)
    description: Asks for 80 GB of GPU memory, which no development host has.
    image: nvidia/cuda:12.8.1-base-ubuntu24.04@sha256:133c78a0575303be34164d0b90137a042172bdf60696af01a3c424ab402d86e2
    args: ["--duration", "20s"]
    min_vram_mb: 81920
    default_max_runtime: 5m
    max_runtime_cap: 15m
    memory_mb: 2048
    cpu_millicores: 2000
    pids_limit: 256
    scratch_mb: 1024
    checkpoint_interval: 5s
    input:
      accepts: none
