# Local development only: Spring Boot starts this with the local profile.
# The image matches the Testcontainers image (a test keeps them identical)
# and DigitalOcean Managed PostgreSQL's major version (ADR 0008).
services:
  postgres:
    image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    environment:
      POSTGRES_DB: controlplane
      POSTGRES_USER: controlplane
      POSTGRES_PASSWORD: local-only-not-a-secret
    ports:
      # A random host port, reachable from this machine only.
      - "127.0.0.1::5432"
