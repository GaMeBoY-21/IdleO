# Local development only: Spring Boot starts this with the local profile.
# The images match the Testcontainers images (a test keeps them identical; PostgreSQL's through ops/postgres) and
# DigitalOcean's managed PostgreSQL and Valkey major versions (ADRs 0008, 0011).
services:
  postgres:
    # PostgreSQL with WAL-G (ops/postgres, ADR 0036): the tests' image (a test keeps the Dockerfile's FROM identical),
    # archiving to this MinIO when LOCAL_BACKUP_PREFIX is set (./start.sh sets it; the end-to-end stack doesn't),
    # encrypted with the development backup key's public half (ops/backup/dev-key.sh).
    build: ../ops/postgres
    # Built on every start (from cache, seconds), so a change to ops/postgres is never left behind in an old image.
    pull_policy: build
    image: idleo-postgres:development
    labels:
      org.springframework.boot.service-connection: postgres
    environment:
      POSTGRES_DB: controlplane
      POSTGRES_USER: controlplane
      POSTGRES_PASSWORD: local-only-not-a-secret
      WALG_S3_PREFIX: ${LOCAL_BACKUP_PREFIX:-}
      AWS_ENDPOINT: http://storage:9000
      AWS_REGION: us-east-1
      AWS_S3_FORCE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: local-storage-root
      AWS_SECRET_ACCESS_KEY: local-only-not-a-secret
      WALG_PGP_KEY_PATH: /run/backup.pub.asc
    volumes:
      - ${LOCAL_BACKUP_PUBLIC_KEY:-/dev/null}:/run/backup.pub.asc:ro
    ports:
      # A random host port, reachable from this machine only.
      - "127.0.0.1::5432"
  valkey:
    image: valkey/valkey:9.1.2@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
    labels:
      # Valkey speaks the Redis protocol; Spring Boot connects to it as Redis.
      org.springframework.boot.service-connection: redis
    ports:
      - "127.0.0.1::6379"
  storage:
    # Object storage for sessions (ADR 0016): MinIO, as a maintained community
    # fork's image (pgsty/minio), since MinIO stopped publishing images. The
    # local profile uses its STS to mint scoped grants.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: local-storage-root
      MINIO_ROOT_PASSWORD: local-only-not-a-secret
      # Browsers PUT upload parts straight to storage (ADR 0019): only the web
      # app's origins may, and MinIO exposes ETag, which completing needs.
      # WEB_ALLOWED_ORIGINS is the control plane's own list, comma-separated.
      MINIO_API_CORS_ALLOW_ORIGIN: ${WEB_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      # A fixed port: agents and download links use this endpoint. ./start.sh --lan opens it to the LAN
      # (LOCAL_STORAGE_BIND=0.0.0.0), so a Windows laptop can download the app and run sessions.
      - "${LOCAL_STORAGE_BIND:-127.0.0.1}:${LOCAL_STORAGE_PORT:-9100}:9000"
  registry:
    # Where the job images of templates/development.yaml are pushed and pulled from in development (ADR 0035): the
    # reference distribution registry, plain HTTP, which only a development distribution's runner will use. The images'
    # digests are what the catalog pins; scripts/images/publish.sh --dev pushes them. ./start.sh --lan opens the port to the
    # LAN (LOCAL_REGISTRY_BIND=0.0.0.0), so a Windows laptop can pull.
    image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
    volumes:
      - registry-data:/var/lib/registry
    ports:
      - "${LOCAL_REGISTRY_BIND:-127.0.0.1}:${LOCAL_REGISTRY_PORT:-5000}:5000"
    # Also on the scanner's own network, under the name a development distribution maps to it, so a renter's own image
    # pushed here (registry.idleo.test:5000/...) is checked by the scanner and pulled by the runner by one reference.
    networks:
      default: {}
      scanner:
        aliases: [registry.idleo.test]
  scanner:
    # The image scanner (scanner/, ADR 0042): checks renters' own images before they reach a host. As in production, it
    # runs as 10001 on a read-only root with every capability dropped and limits of its own, writes only its scratch and
    # Trivy's cache, and holds no database address or storage key: it's on a network of its own with only the
    # development registry, and reaches the control plane's internal port (images.scanner.port, on this machine) with
    # its token. Started by the stack scripts (stack_start_scanner), never by the control plane.
    build: ../scanner
    image: idleo-scanner:development
    profiles: [scanner]
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 2
    mem_limit: 2g
    pids_limit: 256
    tmpfs:
      - /tmp:size=64m
    environment:
      SCANNER_CONTROL_PLANE: http://host.docker.internal:${IMAGES_SCANNER_PORT:-8095}/
      SCANNER_TOKEN: ${IMAGES_SCANNER_TOKEN:-}
      SCANNER_ALLOW_PRIVATE: ${SCANNER_ALLOW_PRIVATE:-registry.idleo.test}
      SCANNER_POLL_SECONDS: "1"
      SCANNER_TRIVY_OFFLINE: ${SCANNER_TRIVY_OFFLINE:-0}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - scanner-scratch:/scratch
      - idleo-trivy-cache:/cache
    networks: [scanner]
  sign-in:
    # A development sign-in server (navikt/mock-oauth2-server) issuing ID tokens
    # shaped like Identity Platform's for invented users (ADR 0013). The local
    # profile trusts it; the prod profile refuses to start with such an issuer.
    image: ghcr.io/navikt/mock-oauth2-server:6.0.4@sha256:47374fe063995d9b6d39ebb6ea21eb5f765025bf0aa08b61b08b439eb91adaf0
    environment:
      JSON_CONFIG_PATH: /config/local-sign-in.json
    volumes:
      - ./local-sign-in.json:/config/local-sign-in.json:ro
    ports:
      # A fixed port, because the issuer URL in every token includes it.
      # LOCAL_SIGN_IN_PORT moves it; the local profile reads the same variable.
      - "127.0.0.1:${LOCAL_SIGN_IN_PORT:-8099}:8080"
  mail:
    # A local mail server that keeps every email and shows it in a web page (ADR 0026): nothing is delivered
    # anywhere. The local profile sends to its SMTP port; its API (http://localhost:8025/api/v1/messages) is what
    # the end-to-end test reads.
    image: axllent/mailpit:v1.31.5@sha256:94f6b70c1436defae6799d9ac7ff0eeff9540465b842026d5cdb018f1c0234ea
    ports:
      - "127.0.0.1:${LOCAL_MAIL_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${LOCAL_MAIL_WEB_PORT:-8025}:8025"

  observability:
    # Metrics, traces and logs in development (ADR 0036): Grafana, Prometheus, Loki and Tempo in one container, behind
    # an OpenTelemetry collector on 4317 and 4318, which the local profile finds by this image and sends to. Prometheus
    # evaluates ops/alerts and tells alertmanager; Grafana shows ops/grafana's dashboards. Only ./start.sh runs it
    # (profile observability); the end-to-end stack leaves it out.
    image: grafana/otel-lgtm:0.35.0@sha256:2de1094c593c671cbfca878a28ffcd7e46ff5e32f2ce966c0cf33003f6cf4266
    profiles: [observability]
    environment:
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ../ops/prometheus/development.yaml:/otel-lgtm/prometheus.yaml:ro
      # The rules; scripts/ops/alert-drill.sh points LOCAL_ALERTS_DIR at a copy with shorter windows, test-only.
      - ${LOCAL_ALERTS_DIR:-../ops/alerts}:/otel-lgtm/alerts:ro
      - ../ops/grafana/provisioning.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/idleo.yaml:ro
      - ../ops/grafana/dashboards:/otel-lgtm/idleo-dashboards:ro
    ports:
      # Grafana on a fixed port, printed by ./start.sh (LOCAL_GRAFANA_PORT moves it); Prometheus's API for the alert
      # test (LOCAL_PROMETHEUS_PORT); the collector's ports anywhere free.
      - "127.0.0.1:${LOCAL_GRAFANA_PORT:-3300}:3000"
      - "127.0.0.1:${LOCAL_PROMETHEUS_PORT:-9190}:9090"
      - "127.0.0.1::4317"
      - "127.0.0.1::4318"
  alertmanager:
    # Sends development's alerts to Mailpit as email (ops/alertmanager/development.yaml), where the alert test reads
    # them. Production's go to Grafana Cloud's own (docs/runbooks/monitoring.md).
    image: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    profiles: [observability]
    command: ["--config.file=/etc/alertmanager/alertmanager.yaml", "--storage.path=/alertmanager"]
    volumes:
      - ../ops/alertmanager/development.yaml:/etc/alertmanager/alertmanager.yaml:ro
    ports:
      - "127.0.0.1:${LOCAL_ALERTMANAGER_PORT:-9193}:9093"

volumes:
  registry-data:
  scanner-scratch:
  # Trivy's vulnerability database, kept across stacks so each doesn't download it again (stack_start_scanner makes it).
  idleo-trivy-cache:
    external: true

networks:
  default: {}
  scanner: {}
