# Local development only: Spring Boot starts this with the local profile.
# The images match the Testcontainers images (a test keeps them identical) and
# DigitalOcean's managed PostgreSQL and Valkey major versions (ADRs 0008, 0011).
services:
  postgres:
    image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    environment:
      POSTGRES_DB: controlplane
      POSTGRES_USER: controlplane
      POSTGRES_PASSWORD: local-only-not-a-secret
    ports:
      # A random host port, reachable from this machine only.
      - "127.0.0.1::5432"
  valkey:
    image: valkey/valkey:9.1.2@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
    labels:
      # Valkey speaks the Redis protocol; Spring Boot connects to it as Redis.
      org.springframework.boot.service-connection: redis
    ports:
      - "127.0.0.1::6379"
  sign-in:
    # A development sign-in server (navikt/mock-oauth2-server) issuing ID tokens
    # shaped like Identity Platform's for invented users (ADR 0013). The local
    # profile trusts it; the prod profile refuses to start with such an issuer.
    image: ghcr.io/navikt/mock-oauth2-server:6.0.4@sha256:47374fe063995d9b6d39ebb6ea21eb5f765025bf0aa08b61b08b439eb91adaf0
    environment:
      JSON_CONFIG_PATH: /config/local-sign-in.json
    volumes:
      - ./local-sign-in.json:/config/local-sign-in.json:ro
    ports:
      # A fixed port, because the issuer URL in every token includes it.
      # LOCAL_SIGN_IN_PORT moves it; the local profile reads the same variable.
      - "127.0.0.1:${LOCAL_SIGN_IN_PORT:-8099}:8080"
