# Tests: the database comes from Testcontainers (@ServiceConnection).
spring:
  datasource:
    hikari:
      connection-timeout: 2000
  # The certificates and the CA come from the in-memory test PKI.
  grpc:
    server:
      port: 0

# Short enough to watch real Valkey expiry and the hello timeout in tests.
agentgateway:
  allow-development-hosts: true
  hello-timeout: 1s
  presence-ttl: 2s
