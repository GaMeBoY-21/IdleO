# Tests: the database comes from Testcontainers (@ServiceConnection).
# The contract test reads the generated OpenAPI document (ADR 0018).
springdoc:
  api-docs:
    enabled: true

# Web origins as a YAML list, as the local profile writes them, for the CORS test (ADR 0018).
web:
  allowed-origins:
    - http://localhost:3000
    - http://127.0.0.1:3000

spring:
  datasource:
    hikari:
      connection-timeout: 2000
  # The certificates and the CA come from the in-memory test PKI.
  grpc:
    server:
      port: 0

# Email is recorded, not sent (RecordingEmailSender); the notifications tests read it (ADR 0026).
notifications:
  email:
    provider: recording

# Tests that aren't about invites sign people in without an invite code (ADR 0024). The admin console's TOTP key is
# a fixed one for tests only (ADR 0027); production's comes from the environment.
identity:
  invite-only: false
  admin:
    totp-key: dGVzdHMtb25seS1hZG1pbi10b3RwLWtleS0zMmJ5dGU=

# Short enough to watch real Valkey expiry and the hello timeout in tests.
agentgateway:
  allow-development-hosts: true
  hello-timeout: 1s
  presence-ttl: 2s
  # Short enough to watch in tests.
  command-sweep-interval: 1s
  command-resend-after: 1s

# The limits are production's in their own tests (RenterLimitsTests); here they're out of the way, since test
# users make many requests and sessions in seconds.
limits:
  requests-per-minute: 100000
  cli-logins-per-hour: 100000

sessions:
  limits:
    new-per-hour: 100000
    new-per-hour-first-day: 100000
    at-once: 100000
  # The development catalog, as the end-to-end test runs it: it has echo-input, with parameters and an
  # input (ADR 0019). Tests run from control-plane/.
  templates:
    catalog: file:../templates/development.yaml
  # Storage's smallest part, so a few MiB really upload in several parts. The limits are production's: a
  # pending upload's declared size counts against the quota with nothing sent, so tests reach them for free.
  uploads:
    part-size: 5MB
  provisioning-timeout: 5s
  # Few streams, so the cap is quick to reach in a test.
  streams:
    max-per-renter: 3
  # Short, so tests see grants refreshed (MinIO's own credentials still last 15 minutes).
  storage:
    grant-ttl: 4s
    refresh-check-every: 200ms
  leases:
    renew-every: 500ms
    transit-allowance: 1s
    lapse-sweep-every: 200ms
  outputs-wait: 2s
  finishing-sweep-interval: 200ms

scheduling:
  # Short enough to watch offers expire in tests.
  offer-ttl: 2s
  offer-sweep-interval: 200ms
  rematch-retry-every: 500ms
  # Short, so a session another test left waiting for a host doesn't linger.
  rematch-wait: 5s

events:
  retry-every: 1s
  retry-older-than: 2s

metering:
  tick-every: 200ms
  review-after: 3s
