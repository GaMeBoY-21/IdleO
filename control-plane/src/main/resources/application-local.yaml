# Local development: scripts/run-local.sh
spring:
  docker:
    compose:
      enabled: true
      file: compose.yaml
  # Email goes to Mailpit from compose.yaml (ADR 0026), which keeps it and shows it at http://localhost:8025. Fixed
  # ports, like storage's; LOCAL_MAIL_SMTP_PORT moves the SMTP one, and compose reads the same variable.
  mail:
    host: localhost
    port: ${LOCAL_MAIL_SMTP_PORT:1025}

logging:
  structured:
    format:
      # Human-readable logs on a developer's machine.
      console: ""

# Metrics, traces and logs go to compose.yaml's observability service (grafana/otel-lgtm, ADR 0036), which Spring Boot
# finds by its image, only when it runs: ./start.sh starts it (compose profile observability) and sets
# LOCAL_OBSERVABILITY; the end-to-end stack leaves it out, and with nothing to send to sends nothing. Every trace is
# kept here; production keeps a tenth.
management:
  otlp:
    metrics:
      export:
        enabled: ${LOCAL_OBSERVABILITY:false}
  tracing:
    export:
      otlp:
        enabled: ${LOCAL_OBSERVABILITY:false}
    sampling:
      probability: 1.0
  logging:
    export:
      otlp:
        enabled: ${LOCAL_OBSERVABILITY:false}

# The development sign-in server from compose.yaml (ADR 0013). To test against
# a real Identity Platform project instead, set IDENTITY_ISSUERS_0_ISSUERURI and
# IDENTITY_ISSUERS_0_AUDIENCE, which replace this list.
identity:
  issuers:
    - issuer-uri: http://localhost:${LOCAL_SIGN_IN_PORT:8099}/idleo-local
      audience: idleo-local
  # The codes' HMAC key (ADR 0024) and the admin console's TOTP key (ADR 0027), made beside the development CA by
  # scripts/dev-ca.sh.
  invite-code-key: file:../private/dev-ca/invite-code.key
  admin:
    totp-key: file:../private/dev-ca/admin-totp.key

# PANs (ADR 0040): sealed under a key scripts/dev-ca.sh makes beside the others, and checked by the fake PAN check.
payouts:
  pan:
    key: file:../private/dev-ca/pan.key
    verifier: fake

# Renters' own images (ADR 0042): tokens sealed under a key scripts/dev-ca.sh makes; the scanner's token is
# private/dev-ca/scanner.token, which the stack scripts pass to both as IMAGES_SCANNER_TOKEN. The development
# registry (compose.yaml's registry) is a private address, so it's allowed here; a Mac's development distribution runs
# arm64 images (stack.sh sets IMAGES_PLATFORM).
images:
  enabled: true
  platform: ${IMAGES_PLATFORM:linux/amd64}
  dev-registries:
    - registry.idleo.test:5000
    - "localhost:5000"
    - "registry:5000"
    # The end-to-end test's private and throttled registries (scripts/e2e/auth-registry.py), reached from the Mac's containers.
    - "host.docker.internal:5079"
    - "host.docker.internal:5080"
  registry-token:
    key: file:../private/dev-ca/registry-token.key

# Object storage: MinIO from compose.yaml (ADR 0016). A fixed port, because the
# grants agents get and renters' download links carry this endpoint.
sessions:
  storage:
    provider: minio
    endpoint: http://localhost:${LOCAL_STORAGE_PORT:9100}
    bucket: idleo-local
    region: us-east-1
    access-key-id: local-storage-root
    secret-access-key: local-only-not-a-secret

# Email goes to Mailpit from compose.yaml (ADR 0026), which keeps it and shows it at http://localhost:8025. Fixed
# ports, like storage's; LOCAL_MAIL_SMTP_PORT moves the SMTP one, and compose reads the same variable.
# The web app's development server and the end-to-end test's static server
# call the API from these origins (ADR 0018).
web:
  allowed-origins:
    - http://localhost:3000
    - http://127.0.0.1:3000

# ./start.sh backs the database up to this MinIO (ADR 0036) and sets BACKUPS_STORAGE_*; the bucket is made if it's missing.
backups:
  create-bucket: true

# A Mac with the agent's fake GPUs can connect (ADR 0013).
agentgateway:
  allow-development-hosts: true

# The throwaway development CA from scripts/dev-ca.sh, under the gitignored
# private/dev-ca/. Development only: production reads every value from the
# environment (application.yaml).
hosts:
  # The Windows app's release feed in the same MinIO (ADR 0034), at the address sessions' storage uses, so a laptop on
  # the LAN can download from it too. Its public key comes from private/release-dev/release.pub, which start.sh reads
  # into IDLEO_RELEASE_PUBLIC_KEY (scripts/release/dev-key.sh makes it).
  releases:
    endpoint: ${sessions.storage.endpoint}
    region: us-east-1
    access-key-id: ${sessions.storage.access-key-id}
    secret-access-key: ${sessions.storage.secret-access-key}
  ca:
    root-certificate: file:../private/dev-ca/root.pem
    intermediate-certificate: file:../private/dev-ca/intermediate.pem
    intermediate-private-key: file:../private/dev-ca/intermediate.key
    intermediate-private-key-password: ""
spring.ssl.bundle.pem.agent-grpc:
  keystore:
    certificate: file:../private/dev-ca/server-chain.pem
    private-key: file:../private/dev-ca/server.key
  truststore:
    certificate: file:../private/dev-ca/root.pem

