# Shared by every profile. Profiles: local (compose.yaml, readable logs),
# test (Testcontainers) and prod (everything secret from the environment).
spring:
  application:
    name: control-plane
  autoconfigure:
    # No users until the identity module. Without this, Spring Boot creates an
    # in-memory user and logs its generated password at startup.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  docker:
    compose:
      # Only the local profile starts compose.yaml.
      enabled: false
  datasource:
    hikari:
      # Milliseconds. Fail fast, so readiness reports DOWN within seconds.
      connection-timeout: 5000
  flyway:
    # Flyway owns every table. Its history table lives in its own schema;
    # V1 creates one schema per module.
    default-schema: flyway
    schemas: flyway
  modulith:
    events:
      jdbc:
        # Flyway creates modulith.event_publication (V10); Modulith's own schema
        # creation stays off.
        schema: modulith
        schema-initialization:
          enabled: false
  ssl:
    bundle:
      pem:
        # The agents' gRPC port (ADR 0010): our own server certificate, issued by
        # our intermediate with serverAuth only, and our root as the only trust
        # anchor for agents' client certificates. TLS 1.3 only. Each value is PEM
        # content or a location, from the environment.
        agent-grpc:
          keystore:
            certificate: ${AGENT_GRPC_TLS_CERTIFICATE}
            private-key: ${AGENT_GRPC_TLS_PRIVATE_KEY}
          truststore:
            certificate: ${HOSTS_CA_ROOT_CERTIFICATE}
          options:
            enabled-protocols: TLSv1.3
  data:
    redis:
      # Valkey (ADR 0011). Fail fast when it's down: heartbeats are counted as
      # not recorded and streams stay open, so time out in a second.
      timeout: 1s
      connect-timeout: 1s
  grpc:
    server:
      # One TLS port for every agent call. The load balancer passes TLS through
      # untouched (TCP mode); terminating it there would break mutual TLS.
      port: 9443
      ssl:
        bundle: agent-grpc
        # Requested, not required: Enroll needs none; the agent stream will
        # require one through an interceptor.
        client-auth: optional
      # Nothing to advertise and no health clients yet: deny by default.
      reflection:
        enabled: false
      health:
        enabled: false

server:
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # Readiness needs the database; liveness doesn't, so a database blip
        # takes the instance out of rotation without restarting it.
        readiness:
          include: readinessState, db

logging:
  structured:
    format:
      console: ecs

hosts:
  ca:
    # Our online intermediate CA (ADR 0010), from the environment: PEM content
    # or a location. The root's private key is never here, only its certificate.
    root-certificate: ${HOSTS_CA_ROOT_CERTIFICATE}
    intermediate-certificate: ${HOSTS_CA_INTERMEDIATE_CERTIFICATE}
    intermediate-private-key: ${HOSTS_CA_INTERMEDIATE_PRIVATE_KEY}
    intermediate-private-key-password: ${HOSTS_CA_INTERMEDIATE_PRIVATE_KEY_PASSWORD:}

billing:
  # Free credit limits (ADR 0014): one grant at most ₹5,000, and no grant may
  # take a wallet above ₹20,000.
  credits:
    max-grant-paise: 500000
    max-wallet-paise: 2000000
  # The nightly check that every wallet equals the ledger (ADR 0014).
  reconciliation:
    cron: "0 30 2 * * *"
    zone: Asia/Kolkata

sessions:
  # Object storage (ADR 0016): R2 in production, from the environment (see
  # application-prod.yaml and docs/runbooks/object-storage.md); MinIO locally.
  storage:
    provider: r2
    endpoint: ${SESSIONS_STORAGE_ENDPOINT:}
    bucket: ${SESSIONS_STORAGE_BUCKET:}
    region: auto
    access-key-id: ${SESSIONS_STORAGE_ACCESS_KEY_ID:}
    secret-access-key: ${SESSIONS_STORAGE_SECRET_ACCESS_KEY:}
    grant-ttl: 1h
    download-link-ttl: 15m
  templates:
    # templates/catalog.yaml, bundled into the jar by the build (ADR 0015).
    catalog: classpath:templates/catalog.yaml
  # A session accepted by its host but not RUNNING within this fails with
  # start_timeout, its hold released (ADR 0015).
  provisioning-timeout: 3m
  provisioning-sweep-interval: 1s
  # Leases (ADR 0016): every running attempt holds one, 2 minutes for batch
  # (technical design "Design principles"), counted by the agent from receipt.
  leases:
    ttl: 2m
    renew-every: 30s
    # The agent counts its lease from receipt, at most 50 seconds after the
    # send (its keepalive drops a stalled connection by then), so a host only
    # counts as lost this long after the lease the control plane recorded.
    transit-allowance: 50s
    lapse-sweep-every: 5s
  # A batch session whose host is lost is matched again, resuming from its
  # newest complete checkpoint; after this many lost attempts it fails.
  max-lost-attempts: 3
  # A job that succeeded is COMPLETED once its outputs' completion marker is in
  # storage, checked this often; without it after the wait, it's FAILED with
  # outputs_missing (ADR 0016).
  outputs-wait: 2m
  finishing-sweep-interval: 5s

metering:
  # Minutes and their two witnesses (ADR 0017): each open session's minutes are
  # decided this often.
  tick-every: 5s
  # usage_minutes keeps partitions three months ahead, checked daily (UTC).
  partitions:
    cron: "0 15 3 * * *"

scheduling:
  # Booking (ADR 0015): offers stay open 10 seconds (technical design line 235),
  # at most three per session (line 214); the sweeper looks for expired offers
  # this often.
  offer-ttl: 10s
  max-offers: 3
  offer-sweep-interval: 1s
  # A session being matched again after a lost host, with no candidate yet,
  # is tried this often, for up to this long, then it's NO_HOST_FREE (ADR 0016).
  rematch-retry-every: 5s
  rematch-wait: 10m

events:
  # Publications whose listener failed are retried this often, once this old.
  retry-every: 30s
  retry-older-than: 30s

agentgateway:
  # The agent stream (ADR 0011).
  hello-timeout: 10s
  presence-ttl: 15s
  heartbeat-interval: 5s
  gpu-temp-cap-c: 85
  max-concurrent-sessions: 1
  minimum-agent-version: 0.1.0
  # Commands waiting for a connected agent are swept this often, in case a
  # delivery hint was lost; a command needing an ack is resent after this long.
  command-sweep-interval: 5s
  command-resend-after: 10s
  # Accept a Hello from a Mac or with fake GPUs (ADR 0013). Only the local and
  # test profiles turn it on; the application refuses to start with it in prod.
  allow-development-hosts: false
