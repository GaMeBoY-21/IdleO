# Shared by every profile. Profiles: local (compose.yaml, readable logs),
# test (Testcontainers) and prod (everything secret from the environment).
spring:
  application:
    name: control-plane
  autoconfigure:
    # No users until the identity module. Without this, Spring Boot creates an
    # in-memory user and logs its generated password at startup.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  docker:
    compose:
      # Only the local profile starts compose.yaml.
      enabled: false
  datasource:
    hikari:
      # Milliseconds. Fail fast, so readiness reports DOWN within seconds.
      connection-timeout: 5000
  flyway:
    # Flyway owns every table. Its history table lives in its own schema;
    # V1 creates one schema per module.
    default-schema: flyway
    schemas: flyway
  modulith:
    events:
      jdbc:
        # Flyway creates modulith.event_publication (V10); Modulith's own schema
        # creation stays off.
        schema: modulith
        schema-initialization:
          enabled: false
  ssl:
    bundle:
      pem:
        # The agents' gRPC port (ADR 0010): our own server certificate, issued by
        # our intermediate with serverAuth only, and our root as the only trust
        # anchor for agents' client certificates. TLS 1.3 only. Each value is PEM
        # content or a location, from the environment.
        agent-grpc:
          keystore:
            certificate: ${AGENT_GRPC_TLS_CERTIFICATE}
            private-key: ${AGENT_GRPC_TLS_PRIVATE_KEY}
          truststore:
            certificate: ${HOSTS_CA_ROOT_CERTIFICATE}
          options:
            enabled-protocols: TLSv1.3
  data:
    redis:
      # Valkey (ADR 0011). Fail fast when it's down: heartbeats are counted as
      # not recorded and streams stay open, so time out in a second.
      timeout: 1s
      connect-timeout: 1s
  grpc:
    server:
      # One TLS port for every agent call. The load balancer passes TLS through
      # untouched (TCP mode); terminating it there would break mutual TLS.
      port: 9443
      ssl:
        bundle: agent-grpc
        # Requested, not required: Enroll needs none; the agent stream will
        # require one through an interceptor.
        client-auth: optional
      # Nothing to advertise and no health clients yet: deny by default.
      reflection:
        enabled: false
      health:
        enabled: false

server:
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false

management:
  # Only health is served over HTTP; metrics, traces and logs leave through OTLP (ADR 0036), never a public endpoint.
  endpoints:
    web:
      exposure:
        include: health
  # Every signal names the release it came from (IDLEO_RELEASE, the deployed build's version), where it runs, and the
  # instance, so two instances' meters are two series, never one written twice (IDLEO_INSTANCE, else the host name).
  opentelemetry:
    resource-attributes:
      service.version: ${IDLEO_RELEASE:development}
      service.instance.id: ${IDLEO_INSTANCE:${HOSTNAME:local}}
      deployment.environment.name: ${IDLEO_ENVIRONMENT:local}
  otlp:
    metrics:
      export:
        # Seconds, so a duration is http_server_requests_seconds wherever it lands. Once a minute: Grafana Cloud's
        # free tier counts data points a minute per series.
        base-time-unit: seconds
        step: 1m
  metrics:
    distribution:
      # A few fixed buckets for the timers an alert or a dashboard takes a percentile of, never Micrometer's 69: each
      # bucket is a series per route and status, and Grafana Cloud's free tier holds 10,000 (docs/runbooks/
      # monitoring.md). Requests by route (the route template, never the raw path with ids), around the slow-API
      # alert's 1 s; agent calls; booking to a GPU found and to the first log line.
      slo:
        http.server.requests: 50ms, 100ms, 250ms, 500ms, 1s, 2500ms, 5s, 10s
        grpc.server: 10ms, 50ms, 250ms, 1s, 5s, 30s
        sessions.time-to-gpu: 5s, 15s, 30s, 1m, 2m, 5m, 10m
        sessions.time-to-first-log: 15s, 30s, 1m, 2m, 5m, 10m, 20m
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # Readiness needs what serving a request needs: the database and a CA inside its validity (hosts'
        # CertificateAuthorityHealth). Liveness needs neither, so a blip takes the instance out of rotation without
        # restarting it. Valkey is never in readiness: it holds only what may expire, and requests go on without it
        # (ADR 0011). Nor is object storage (ADR 0036): without it uploads, outputs and logs fail with a plain 503, but
        # sessions, leases and everything else go on, so it's a meter (storage.reachable) and an alert instead.
        readiness:
          include: readinessState, db, ca
        liveness:
          include: livenessState

# The renter's request limit (technical design "Limits", ADR 0025): requests a minute for each person (or each
# address without a sign-in), counted in Valkey; reads of a session's logs a minute, counted apart so a live log view
# doesn't use up the rest; CLI sign-ins and host links started an hour from one address; batches of real visits'
# vitals a minute from one address (ADR 0036).
limits:
  requests-per-minute: 60
  log-reads-per-minute: 120
  cli-logins-per-hour: 10
  host-links-per-hour: 10
  vitals-per-minute: 30

# The web app, where a CLI sign-in is approved (ADR 0025): its /cli-login/ page is the link `idleo login` shows.
# Production sets IDENTITY_WEB_APP_URL; the prod profile refuses plain HTTP or this machine (ProductionSettingsGuard).
identity:
  web-app-url: ${IDENTITY_WEB_APP_URL:http://localhost:3000}

# Notifications (ADR 0026): where an email's links go and who it comes from. Production sets both, and the mail
# server in spring.mail.*, from the environment; the prod profile refuses a link that is plain HTTP or on this
# machine, and a mail server on this machine (ProductionSettingsGuard). docs/runbooks/email.md.
notifications:
  web-app-url: ${NOTIFICATIONS_WEB_APP_URL:http://localhost:3000}
  email:
    from: ${NOTIFICATIONS_EMAIL_FROM:IdleO <notifications@localhost>}
    # The provider's signing secret for its bounce and complaint webhook (Resend's whsec_…, ADR 0036); without one
    # every call to POST /v1/email-events/resend is refused. Production must set it (ProductionSettingsGuard).
    webhook-secret: ${NOTIFICATIONS_EMAIL_WEBHOOK_SECRET:}

# The web app's origins, comma-separated (WEB_ALLOWED_ORIGINS), allowed to call /v1 with a bearer
# token (ADR 0018). None by default; production refuses *, plain HTTP and localhost.
web:
  allowed-origins: []

# The API contract (ADR 0018): the OpenAPI document of /v1, generated by springdoc and committed as
# api/openapi.yaml. It's served only in tests, which compare it with that file; never in prod
# (ProductionSettingsGuard).
springdoc:
  api-docs:
    enabled: false
  paths-to-match: /v1/**, /admin/v1/**
  # Errors are one problem-details default response on every operation, added by ApiContract.
  override-with-generic-response: false
  writer-with-order-by-keys: true
  default-produces-media-type: application/json

logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        version: ${IDLEO_RELEASE:development}
        environment: ${IDLEO_ENVIRONMENT:local}

hosts:
  # Linking a host by approval (ADR 0032): the web app's /link/<id>/ page is where its owner approves, the same web app
  # as a CLI sign-in. A new host is created pending, and an admin activates it (its agent's self-test beside the
  # button), until auto-activate is turned on after the invite-only pilot: a pending host whose self-test passed is then
  # activated by itself.
  link:
    web-app-url: ${HOSTS_LINK_WEB_APP_URL:${IDENTITY_WEB_APP_URL:http://localhost:3000}}
  auto-activate: false
  # The Windows app's signed release feed (ADR 0034): stable/latest.json and its .sig in the releases bucket of the
  # object storage sessions use, read every refresh-every and served only if its Ed25519 signature verifies against
  # public-key (the raw key in base64; agent/release-keys/release.pub in production). With no public key the feed is
  # off and there's no download. Download links last link-ttl.
  releases:
    endpoint: ${HOSTS_RELEASES_ENDPOINT:${SESSIONS_STORAGE_ENDPOINT:}}
    bucket: ${HOSTS_RELEASES_BUCKET:releases}
    region: ${HOSTS_RELEASES_REGION:auto}
    access-key-id: ${HOSTS_RELEASES_ACCESS_KEY_ID:${SESSIONS_STORAGE_ACCESS_KEY_ID:}}
    secret-access-key: ${HOSTS_RELEASES_SECRET_ACCESS_KEY:${SESSIONS_STORAGE_SECRET_ACCESS_KEY:}}
    public-key: ${IDLEO_RELEASE_PUBLIC_KEY:}
    refresh-every: 5m
    link-ttl: 1h
  ca:
    # Our online intermediate CA (ADR 0010), from the environment: PEM content
    # or a location. The root's private key is never here, only its certificate.
    root-certificate: ${HOSTS_CA_ROOT_CERTIFICATE}
    intermediate-certificate: ${HOSTS_CA_INTERMEDIATE_CERTIFICATE}
    intermediate-private-key: ${HOSTS_CA_INTERMEDIATE_PRIVATE_KEY}
    intermediate-private-key-password: ${HOSTS_CA_INTERMEDIATE_PRIVATE_KEY_PASSWORD:}

billing:
  # Free credit limits (ADR 0014): one grant at most ₹5,000, and no grant may
  # take a wallet above ₹20,000.
  credits:
    max-grant-paise: 500000
    max-wallet-paise: 2000000
  # The platform's commission on session charges, in percent (ADR 0017;
  # execution plan line 311: test 15–25). The host's share is rounded down.
  commission-percent: 20
  # The nightly check that every wallet equals the ledger (ADR 0014).
  reconciliation:
    cron: "0 30 2 * * *"
    zone: Asia/Kolkata

# Real visits' vitals and JavaScript errors (ADR 0036, BrowserVitals): the folder the web builds' source maps are
# deployed to (never served), so an error is named by our own file and line. Without one, the browser's place is kept.
vitals:
  source-maps: ${VITALS_SOURCE_MAPS:}

# The database's backups (ADR 0036, docs/runbooks/backups.md): where WAL-G writes them, read with a key that may only
# list them, so the control plane can say how old the newest full backup is (BackupWatch). Off with no endpoint; the
# prod profile refuses to start without one.
backups:
  storage:
    endpoint: ${BACKUPS_STORAGE_ENDPOINT:}
    bucket: ${BACKUPS_STORAGE_BUCKET:}
    prefix: ${BACKUPS_STORAGE_PREFIX:}
    region: ${BACKUPS_STORAGE_REGION:auto}
    access-key-id: ${BACKUPS_STORAGE_ACCESS_KEY_ID:}
    secret-access-key: ${BACKUPS_STORAGE_SECRET_ACCESS_KEY:}

# A host's shown rating is worked out once a day, never on each rating (ADR 0028).
trust:
  ratings:
    refresh-cron: "0 15 3 * * *"
    zone: Asia/Kolkata

sessions:
  # The renter's session limits (technical design "Limits", ADR 0025): new sessions an hour (fewer for an account
  # less than a day old) and sessions that haven't ended, counted in PostgreSQL as each is booked.
  limits:
    new-per-hour: 10
    new-per-hour-first-day: 2
    at-once: 3
  # Object storage (ADR 0016): R2 in production, from the environment (see
  # application-prod.yaml and docs/runbooks/object-storage.md); MinIO locally.
  storage:
    provider: r2
    endpoint: ${SESSIONS_STORAGE_ENDPOINT:}
    bucket: ${SESSIONS_STORAGE_BUCKET:}
    region: auto
    access-key-id: ${SESSIONS_STORAGE_ACCESS_KEY_ID:}
    secret-access-key: ${SESSIONS_STORAGE_SECRET_ACCESS_KEY:}
    grant-ttl: 1h
    # Grants past half their lifetime are refreshed; checked this often.
    refresh-check-every: 5s
    download-link-ttl: 15m
  templates:
    # templates/catalog.yaml, bundled into the jar by the build (ADR 0015).
    catalog: classpath:templates/catalog.yaml
  # Uploads (ADR 0019, ADR 0022): a folder of up to max-files files, or one,
  # each PUT by the client straight to storage in parts through pre-signed
  # links. Every part of a file but its last is part-size (Spring's MB is
  # MiB); links last link-ttl. An unfinished upload is aborted after
  # pending-ttl, a finished one deleted ready-ttl after a session last used it
  # (or after it completed, if none has), never while a session that hasn't
  # ended uses it. An upload is at most max-upload-size, all its files
  # together; a renter holds at most quota in pending and ready uploads
  # (technical design "Limits").
  uploads:
    part-size: 64MB
    link-ttl: 1h
    pending-ttl: 24h
    ready-ttl: 30d
    max-upload-size: 40GB
    max-files: 1000
    quota: 60GB
    expiry-sweep-every: 10m
  # A session accepted by its host but not RUNNING within this fails with
  # start_timeout, its hold released (ADR 0015).
  provisioning-timeout: 3m
  # Event streams (ADR 0019): each re-reads its session this often without a
  # hint, sends a keep-alive comment when quiet, and closes after max-open so
  # the client reconnects with a fresh token. A renter has at most
  # max-per-renter open on an instance.
  streams:
    max-per-renter: 10
    reread-every: 5s
    keep-alive-every: 15s
    max-open: 30m
  # An uploaded input is staged before the job starts (ADR 0019), so the
  # timeout grows by its size at this rate: home internet, about 4 MB/s.
  input-staging-rate: 4MB
  provisioning-sweep-interval: 1s
  # Leases (ADR 0016): every running attempt holds one, 2 minutes for batch
  # (technical design "Design principles"), counted by the agent from receipt.
  leases:
    ttl: 2m
    renew-every: 30s
    # The agent counts its lease from receipt, at most 50 seconds after the
    # send (its keepalive drops a stalled connection by then), so a host only
    # counts as lost this long after the lease the control plane recorded.
    transit-allowance: 50s
    lapse-sweep-every: 5s
  # A batch session whose host is lost is matched again, resuming from its
  # newest complete checkpoint; after this many lost attempts it fails.
  max-lost-attempts: 3
  # A job that succeeded is COMPLETED once its outputs' completion marker is in
  # storage, checked this often; without it after the wait, it's FAILED with
  # outputs_missing (ADR 0016).
  outputs-wait: 2m
  finishing-sweep-interval: 5s

metering:
  # Minutes and their two witnesses (ADR 0017): each open session's minutes are
  # decided this often.
  tick-every: 5s
  # Each running session is settled every 15 minutes, and once when it ends;
  # minutes only one witness saw this long after the end go to review.
  settlement-window: 15m
  review-after: 5m
  # usage_minutes keeps partitions three months ahead, checked daily (UTC).
  partitions:
    cron: "0 15 3 * * *"

scheduling:
  # Booking (ADR 0015): offers stay open 10 seconds (technical design line 251),
  # at most three per session (line 230); the sweeper looks for expired offers
  # this often.
  offer-ttl: 10s
  max-offers: 3
  offer-sweep-interval: 1s
  # A session being matched again after a lost host, with no candidate yet,
  # is tried this often, for up to this long, then it's NO_HOST_FREE (ADR 0016).
  rematch-retry-every: 5s
  rematch-wait: 10m
  # The price range suggested to a host when fewer than 3 other active hosts have its GPU model (ADR 0023), by
  # GPU memory class in GB, in paise a minute: 1 paisa a minute is ₹0.60 an hour.
  price-band-defaults:
    8: { low-paise-per-min: 8, high-paise-per-min: 14 }
    12: { low-paise-per-min: 12, high-paise-per-min: 20 }
    16: { low-paise-per-min: 16, high-paise-per-min: 28 }
    24: { low-paise-per-min: 24, high-paise-per-min: 42 }

# What the public pages say that only configuration knows (ADR 0029). The credit a new account starts with is left
# unset until someone decides what a new account gets; the pricing page says nothing about it while it is.
public-site: {}

events:
  # Publications whose listener failed are retried this often, once this old.
  retry-every: 30s
  retry-older-than: 30s

agentgateway:
  # The agent stream (ADR 0011).
  hello-timeout: 10s
  presence-ttl: 15s
  heartbeat-interval: 5s
  gpu-temp-cap-c: 85
  max-concurrent-sessions: 1
  minimum-agent-version: 0.1.0
  # Commands waiting for a connected agent are swept this often, in case a
  # delivery hint was lost; a command needing an ack is resent after this long.
  command-sweep-interval: 5s
  command-resend-after: 10s
  # Accept a Hello from a Mac or with fake GPUs (ADR 0013). Only the local and
  # test profiles turn it on; the application refuses to start with it in prod.
  allow-development-hosts: false

# Retention (ADR 0037, docs/reference/personal-data-map.md): every rule there is a RetentionRule bean, run shortly after
# start and then every day, one instance at a time each. The periods that are the product's own choice are below;
# the ones the law sets are under legal.retention.
retention:
  first-run-after: 2m
  every: 24h

# A person's own data (ADR 0037): an export is made by a job looking every export-sweep-every, kept export-keep (its
# links to files work as long), and asked for once every export-every; deleting an account is confirmed by an email
# link that works confirm-link-ttl, reminded reminder-before, and erased by a job looking every erasure-sweep-every.
privacy:
  export-keep: 7d
  export-every: 24h
  export-sweep-every: 15s
  confirm-link-ttl: 24h
  reminder-before: 24h
  erasure-sweep-every: 1m

# Everything the law decides, in one place (ADR 0037). Each value marked LEGAL(confirm) is a proposal a lawyer must
# confirm before launch; the report of the privacy work lists them with the question to ask. Nothing else in the code
# or the pages repeats them.
legal:
  retention:
    # The security log (sign-ins, failures, key and admin events, deletion and export requests, with addresses):
    # at least a year. LEGAL(confirm)
    security-events: 365d
    # Money records (the ledger, charges, earnings, settlements), keyed by opaque ids: 8 years. Not deleted yet: the
    # ledger is append-only, and how to delete after the period is a later decision (ADR 0037). LEGAL(confirm)
    money-records: 2922d
    # The admin audit log, ids only: as long as the money records it explains. Not deleted yet (ADR 0037).
    # LEGAL(confirm)
    audit-log: 2922d
    # Database backups, which can hold an erased person until they age out (ops/backup/, docs/runbooks/backups.md);
    # the privacy notice must say so. Changing it means changing the backup scripts too. LEGAL(confirm)
    backups: 30d
  # How long a person has, after confirming that their account should be deleted, to change their mind; nothing, not
  # even an admin, shortens it but a legal order (audited). LEGAL(confirm)
  erasure:
    waiting-period: 7d
  # The Terms and the privacy notice in force (their text is the lawyer's; the pages say "Being drafted." until then).
  # A person accepts both, once, before anything else; changing a version here makes the app ask everyone once more
  # on their next visit. LEGAL(confirm)
  notices:
    terms-version: 2026-10-draft
    privacy-version: 2026-10-draft
    # Who may have an account: the person confirms they are this old, once, with their first acceptance. LEGAL(confirm)
    minimum-age: 18
