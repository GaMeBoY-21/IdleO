# Production: every secret comes from the environment, never from a file.
# The variables are listed, with fake values, in .env.example.
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  data:
    redis:
      url: ${VALKEY_URL}
  # The mail server for email (ADR 0026, docs/runbooks/email.md).
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true

# Metrics, traces and logs (ADR 0036, docs/runbooks/monitoring.md): any OTLP endpoint over HTTPS, Grafana Cloud's by
# default. OTLP_ENDPOINT is its base (…/otlp), OTLP_AUTHORIZATION the whole Authorization header's value. The prod
# profile refuses to start without them (ProductionSettingsGuard).
management:
  otlp:
    metrics:
      export:
        url: ${OTLP_ENDPOINT}/v1/metrics
        headers:
          Authorization: ${OTLP_AUTHORIZATION}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT}/v1/traces
          headers:
            Authorization: ${OTLP_AUTHORIZATION}
    logging:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT}/v1/logs
          headers:
            Authorization: ${OTLP_AUTHORIZATION}

# Cloudflare R2 (ADR 0016, docs/runbooks/object-storage.md).
sessions:
  storage:
    provider: r2
    endpoint: ${SESSIONS_STORAGE_ENDPOINT}
    bucket: ${SESSIONS_STORAGE_BUCKET}
    access-key-id: ${SESSIONS_STORAGE_ACCESS_KEY_ID}
    secret-access-key: ${SESSIONS_STORAGE_SECRET_ACCESS_KEY}
    r2:
      api-base-url: https://api.cloudflare.com/client/v4
      account-id: ${SESSIONS_STORAGE_R2_ACCOUNT_ID}
      api-token: ${SESSIONS_STORAGE_R2_API_TOKEN}
      parent-access-key-id: ${SESSIONS_STORAGE_ACCESS_KEY_ID}

# Email (ADR 0026, docs/runbooks/email.md): any provider that speaks SMTP, picked later. Until its settings exist the
# prod profile refuses to start: it needs a mail server (above), a sender address and the web app's address.
notifications:
  web-app-url: ${NOTIFICATIONS_WEB_APP_URL}
  email:
    from: ${NOTIFICATIONS_EMAIL_FROM}

# The admin console's TOTP key (ADR 0027, docs/runbooks/admin.md) and the HMAC key for invite and recovery codes
# (ADR 0024): 32 bytes in base64 each, from the secret store. Without either, the application doesn't start.
identity:
  invite-code-key: ${IDENTITY_INVITE_CODE_KEY}
  admin:
    totp-key: ${IDENTITY_ADMIN_TOTP_KEY}
