syntax = "proto3";

package gpu.agent.v1;

import "google/protobuf/duration.proto";

// The kind of work a session runs. Phase 1 runs batch jobs only; notebooks,
// endpoints and games add their values later.
enum SessionType {
  // Never sent. A receiver treats it as an error.
  SESSION_TYPE_UNSPECIFIED = 0;
  // A container that runs to completion, checkpointing as it goes.
  SESSION_TYPE_BATCH = 1;
}

// The agent's view of one session attempt. This is the agent's local state,
// not the control plane's session state machine.
enum SessionState {
  // Never sent. A receiver treats it as an error.
  SESSION_STATE_UNSPECIFIED = 0;
  // Pulling the image by digest and downloading inputs.
  SESSION_STATE_PREPARING = 1;
  // The container is running.
  SESSION_STATE_RUNNING = 2;
  // Writing and uploading a checkpoint; the job may be paused.
  SESSION_STATE_CHECKPOINTING = 3;
  // The container exited; outputs are uploading.
  SESSION_STATE_UPLOADING = 4;
  // Terminal: the job exited 0 and its outputs are uploaded. Sandbox wiped.
  SESSION_STATE_SUCCEEDED = 5;
  // Terminal: the job or its setup failed. Sandbox wiped.
  SESSION_STATE_FAILED = 6;
  // Terminal: stopped by a StopSession or by the host owner. Sandbox wiped.
  SESSION_STATE_STOPPED = 7;
  // Terminal: the lease ran out before it was renewed, so the agent fenced
  // the work itself. Sandbox wiped.
  SESSION_STATE_LEASE_EXPIRED = 8;
}

// Why the control plane stops a session.
enum StopReason {
  // Never sent. A receiver treats it as an error.
  STOP_REASON_UNSPECIFIED = 0;
  // The renter asked to stop.
  STOP_REASON_RENTER_REQUESTED = 1;
  // The renter's credit ran out: the hold can't cover another lease, and the
  // wallet has nothing more to add to it.
  STOP_REASON_CREDIT_EXHAUSTED = 2;
  // The session broke the acceptable-use rules.
  STOP_REASON_ABUSE = 3;
  // A dispute froze the session.
  STOP_REASON_DISPUTE = 4;
  // The session moved to another host or attempt; this attempt must end.
  STOP_REASON_SUPERSEDED = 5;
  // The session reached the renter's spending cap for it (max_spend_paise).
  STOP_REASON_MAX_SPEND_REACHED = 6;
}

// What to run. Carries no secrets: everything secret is in Credentials.
message SessionSpec {
  // The kind of session.
  SessionType type = 1;
  // Container image, always pinned by digest: the reference must include
  // "@sha256:", so a tag change can never swap the image. Example:
  // "registry.example/templates/qlora@sha256:0123...".
  // Empty is invalid; the receiver rejects the message.
  string image = 2;
  // Arguments passed to the image's entrypoint.
  repeated string args = 3;
  // Environment variables for the container. Non-secret values only:
  // secrets travel in Credentials and are never put here.
  map<string, string> env = 4;
  // GPU memory the job needs, in MB.
  // Zero is invalid; the receiver rejects the message.
  int32 vram_needed_mb = 5;
  // Container memory limit, in MB.
  // Zero is invalid; the receiver rejects the message.
  int32 memory_mb = 6;
  // Container CPU limit, in thousandths of a CPU.
  // Zero is invalid; the receiver rejects the message.
  int32 cpu_millicores = 7;
  // Maximum number of processes inside the container.
  // Zero is invalid; the receiver rejects the message.
  int32 pids_limit = 8;
  // Size of the fixed-size scratch disk mounted at /work, in MB. The staged
  // inputs (StartSession.inputs) come on top: the disk holds them and
  // scratch_mb more.
  // Zero is invalid; the receiver rejects the message.
  int32 scratch_mb = 9;
  // How often the job should checkpoint.
  // Absent or zero is invalid; the receiver rejects the message.
  google.protobuf.Duration checkpoint_interval = 10;
  // Hard cap on how long this attempt may run, whatever the lease says.
  // Absent or zero is invalid; the receiver rejects the message.
  google.protobuf.Duration max_runtime = 11;
  // Replaces the image's entrypoint when not empty: for a renter's own image
  // run with a command they typed, ["/bin/sh", "-c"] with the command as the
  // one argument. Empty keeps the image's own entrypoint.
  repeated string entrypoint = 12;
  // The job's working directory. Empty is /work, the scratch disk; a
  // renter's own image runs in its own working directory, read from its
  // config when it was checked (ADR 0042).
  string working_dir = 13;
  // A renter's own image (ADR 0042), checked on our server before it was
  // offered: pulled when the attempt starts, with
  // Credentials.registry_username and registry_token if it's private,
  // within image_pull_timeout, never pre-downloaded, and deleted from the
  // machine when the attempt ends, since it may hold the renter's code.
  bool own_image = 14;
  // How long pulling a renter's own image may take before the attempt fails
  // with "image_pull_timed_out", before minute 0, so nothing is charged.
  // Absent for our own images, which the runner's own limit covers.
  google.protobuf.Duration image_pull_timeout = 15;
  // The image's compressed size in bytes, as checked: what its download
  // counts up to. Zero when not known.
  int64 image_size_bytes = 16;
}

// What a StorageGrant allows.
enum StoragePermission {
  // Never sent. A receiver treats it as an error.
  STORAGE_PERMISSION_UNSPECIFIED = 0;
  // List and read objects under the grant's prefixes.
  STORAGE_PERMISSION_READ_ONLY = 1;
  // List, read and write objects under the grant's prefixes.
  STORAGE_PERMISSION_READ_WRITE = 2;
}

// Short-lived, S3-compatible credentials scoped to a few prefixes of one
// bucket, such as R2 temporary access credentials. Storage itself enforces
// the scope, so an agent can't write outside it even if it misbehaves. The
// control plane refreshes grants with RefreshCredentials before they expire.
// secret: never log.
message StorageGrant {
  // S3-compatible endpoint URL, for example
  // "https://example-account.r2.cloudflarestorage.com".
  // Empty is invalid; the receiver rejects the message.
  string endpoint = 1;
  // The bucket the grant covers.
  // Empty is invalid; the receiver rejects the message.
  string bucket = 2;
  // Access key id. secret: never log.
  // Empty is invalid; the receiver rejects the message.
  string access_key_id = 3;
  // Secret access key. secret: never log.
  // Empty is invalid; the receiver rejects the message.
  string secret_access_key = 4;
  // Session token that goes with the temporary keys. secret: never log.
  // Empty is invalid; the receiver rejects the message.
  string session_token = 5;
  // Key prefixes the grant covers, each ending in "/", for example
  // "sessions/0190f3a2-0000-7000-8000-000000000000/attempt-2/". The storage
  // layout is in proto/README.md.
  // Empty is invalid; the receiver rejects the message.
  repeated string prefixes = 6;
  // What the grant allows on those prefixes.
  StoragePermission permission = 7;
  // How long the credentials stay valid, counted from receipt on the agent's
  // lease clock (see StartSession.lease_ttl). The agent stops using them at
  // that point; storage enforces the real expiry.
  // Absent or zero is invalid; the receiver rejects the message.
  google.protobuf.Duration expires_in = 8;
}

// Every secret a session needs, in one message so the agent can redact one
// type instead of hunting through fields.
// secret: never log.
message Credentials {
  // Numbers of the pre-signed URL fields removed before v1 was released.
  reserved 2, 3, 4, 5;

  // Token for pulling SessionSpec.image from the registry. Used once, when
  // the attempt starts, and only for a renter's own image from a private
  // registry (ADR 0042): read-only, given by the renter. Never put in an
  // environment, a file that outlives the pull, or a log. secret: never log.
  string registry_token = 1;
  // Read-write on this attempt's own prefix only,
  // "sessions/{session_id}/attempt-{n}/", where the agent writes checkpoints
  // and outputs. It can't write the input or another attempt's folder.
  // secret: never log.
  // Absent is invalid; the receiver rejects the message.
  StorageGrant attempt_grant = 6;
  // Read-only on the folder of each upload in StartSession.inputs,
  // "uploads/{upload_id}/", and on the checkpoint named in
  // StartSession.resume_from, if any. Absent when there's neither.
  // secret: never log.
  StorageGrant read_grant = 7;
  // The user name that goes with registry_token; empty when there's no
  // token. secret: never log.
  string registry_username = 8;
}

// Names one completed checkpoint: the folder prefix + seq + "/" in the
// layout in proto/README.md.
message CheckpointRef {
  // The checkpoints prefix of the attempt that wrote it, for example
  // "sessions/0190f3a2-0000-7000-8000-000000000000/attempt-1/checkpoints/".
  // Empty is invalid; the receiver rejects the message.
  string prefix = 1;
  // The checkpoint's sequence number within that attempt, starting at 1.
  // Zero is invalid; the receiver rejects the message.
  int32 seq = 2;
}

// One file of a session's input: one uploaded object, read through
// Credentials.read_grant. The agent downloads it into the attempt's scratch
// folder, input/{slot}/{name}, before the job starts, and checks its size.
// An upload of a folder is one InputRef per file, all with the same slot.
message InputRef {
  // The folder the object's name is relative to, for example
  // "uploads/0190f3a2-0000-7000-8000-000000000000/files/". Ends in "/".
  // Empty is invalid; the receiver rejects the message.
  string prefix = 1;
  // The object's path inside that folder, which is also the file's path in
  // the input's folder: one or more segments joined by "/", each only
  // letters, digits, ".", "_" and "-", and never "." or "..". In
  // StartSession.input (deprecated), a single segment.
  // Empty is invalid; the receiver rejects the message.
  string name = 2;
  // The object's size in bytes; a download of any other size is refused.
  // Zero is valid: the agent writes an empty file without downloading.
  int64 size_bytes = 3;
  // The template's name for the input this file belongs to, such as
  // "model": the job finds it in /work/input/{slot}/ (SESSION_INPUT_{SLOT}_DIR).
  // Matches ^[a-z][a-z0-9_]{0,31}$. Empty only in StartSession.input
  // (deprecated); in StartSession.inputs, empty is invalid and the receiver
  // rejects the message.
  string slot = 4;
}

// One session as the agent sees it right now. Shared by Hello and Heartbeat.
message RunningSession {
  // The session's UUIDv7, in canonical text form.
  // Empty is invalid; the receiver rejects the message.
  string session_id = 1;
  // The attempt this agent is running. The control plane ignores snapshots
  // whose attempt isn't the current one.
  // Zero is invalid; the receiver rejects the message.
  int32 attempt = 2;
  // The agent's local state for this attempt.
  SessionState state = 3;
  // The highest log chunk seq of this attempt that has finished uploading to
  // "sessions/{session_id}/attempt-{n}/logs/{seq}.log", seqs counting from
  // 1. Zero means none yet. The control plane only ever raises it.
  int32 latest_log_seq = 4;
  // While PREPARING pulls a renter's own image (ADR 0042): bytes downloaded
  // so far, for "Downloading your image · 3.1 of 8.4 GB". Zero otherwise.
  int64 image_done_bytes = 5;
  // The image's size, the download's total; zero when not known.
  int64 image_total_bytes = 6;
}

// A short error: a code plus a one-line message. Never container logs or
// output, which hold renter data.
message SessionError {
  // Stable machine-readable code, for example "image_pull_failed".
  // Empty is invalid; the receiver rejects the message.
  string code = 1;
  // One short human-readable line.
  string message = 2;
}

// Control plane to agent: a proposed session. The agent replies with
// OfferReply. Not acked: the OfferReply is the answer.
message Offer {
  // Unique id for this offer, a UUIDv7 in canonical text form.
  // Empty is invalid; the receiver rejects the message.
  string offer_id = 1;
  // What would run. Lets the agent check it fits before accepting.
  // Absent is invalid; the receiver rejects the message.
  SessionSpec spec = 2;
  // How long the offer stays open, counted from receipt on the agent's lease
  // clock (see StartSession.lease_ttl). A reply after this is ignored.
  // Absent or zero is invalid; the receiver rejects the message.
  google.protobuf.Duration expires_in = 3;
}

// Why an agent declines an offer.
enum OfferDeclineReason {
  // Not a decline. Used when the offer is accepted.
  OFFER_DECLINE_REASON_UNSPECIFIED = 0;
  // The owner is using the machine.
  OFFER_DECLINE_REASON_OWNER_ACTIVE = 1;
  // Not enough free GPU memory, RAM, CPU or disk for the spec.
  OFFER_DECLINE_REASON_INSUFFICIENT_RESOURCES = 2;
  // The GPU is at or above the temperature cap.
  OFFER_DECLINE_REASON_TOO_HOT = 3;
  // The agent is already running its maximum number of sessions.
  OFFER_DECLINE_REASON_AT_CAPACITY = 4;
  // The agent is shutting down or updating.
  OFFER_DECLINE_REASON_SHUTTING_DOWN = 5;
  // The offer had already expired when the agent looked at it.
  OFFER_DECLINE_REASON_EXPIRED = 6;
  // A self-test the owner or an admin asked for is running; the agent takes
  // no session until it is done, and the scheduler moves on to another host.
  OFFER_DECLINE_REASON_SELF_TEST_RUNNING = 7;
}

// Agent to control plane: the answer to an Offer. Acked.
message OfferReply {
  // The offer being answered.
  // Empty is invalid; the receiver rejects the message.
  string offer_id = 1;
  // True if the agent accepts the offer.
  bool accepted = 2;
  // Why the offer was declined. UNSPECIFIED when accepted is true.
  OfferDeclineReason decline_reason = 3;
}

// Control plane to agent: start one attempt of a session. Acked.
message StartSession {
  // The session's UUIDv7, in canonical text form.
  // Empty is invalid; the receiver rejects the message.
  string session_id = 1;
  // Business idempotency key for this command, a UUIDv7. It survives
  // reconnects and outbox re-sends: a StartSession whose command_id the agent
  // has seen before is acked and never run twice. Not the same as the
  // envelope's message_id, which only identifies one delivery.
  // Empty is invalid; the receiver rejects the message.
  string command_id = 2;
  // Which attempt this is, starting at 1 and increasing on every re-match.
  // The agent puts it on every message about this session; the control plane
  // acks and then ignores any message whose attempt isn't the current one.
  // Zero is invalid; the receiver rejects the message.
  int32 attempt = 3;
  // What to run.
  // Absent is invalid; the receiver rejects the message.
  SessionSpec spec = 4;
  // Secrets for this attempt. secret: never log.
  // Absent is invalid; the receiver rejects the message.
  Credentials credentials = 5;
  // How long the lease lasts, counted from receipt on the agent's lease
  // clock: a clock that keeps counting while the machine sleeps
  // (CLOCK_BOOTTIME on Linux, QueryPerformanceCounter on Windows; never
  // Linux's CLOCK_MONOTONIC, which stops during suspend). The agent's deadline
  // is that clock at receipt plus lease_ttl; it stops the work when the
  // deadline passes without a LeaseRenew, and on wake it checks every deadline
  // before doing anything else. A wrong or paused agent clock can't make it
  // stop late. Transit can, by at most the transit allowance, which the
  // control plane waits out before re-matching (ADR 0016). Never compared
  // with wall-clock time, which the owner can change. How deadlines survive
  // restarts: proto/README.md.
  // Absent or zero is invalid; the receiver rejects the message.
  google.protobuf.Duration lease_ttl = 6;
  // The session-wide minute index of this attempt's first minute, set by the
  // control plane from its own clock. The agent counts minutes from zero on
  // its own and reports minute_index_base plus that count, so attempt 2's
  // first minute never lands on attempt 1's minute 0. Optional so that
  // "not sent" can't pass for zero: absent is invalid and the receiver rejects
  // the message, while zero is valid (the first attempt starts at minute 0).
  optional int32 minute_index_base = 7;
  // UUIDs of the GPUs this attempt may use, as listed in GpuInfo.uuid. Only
  // these are passed into the container.
  // Empty is invalid; the receiver rejects the message.
  repeated string gpu_uuids = 8;
  // The checkpoint to resume from, chosen by the control plane after it has
  // checked that the checkpoint's completion marker exists. Absent when the
  // job starts fresh. Readable through Credentials.read_grant.
  CheckpointRef resume_from = 9;
  // Deprecated: no longer sent; inputs replaces it. The one uploaded file
  // of a session with a single input. The number stays reserved for it.
  InputRef input = 10;
  // Every uploaded file the job reads, one per file, each staged by the agent
  // into input/{slot}/{name} while PREPARING, before minute 0. Empty when the
  // session has no uploaded input. A link input is never here: it's only
  // SESSION_INPUT_{NAME}_URL in SessionSpec.env, fetched by the job inside
  // its sandbox, never by the agent. Readable through Credentials.read_grant.
  repeated InputRef inputs = 11;
}

// Control plane to agent: fresh storage credentials for a running attempt.
// Sent once a grant is past half its lifetime, and straight after a
// reconnect if a grant is close to expiring. Acked.
message RefreshCredentials {
  // The session the credentials are for.
  // Empty is invalid; the receiver rejects the message.
  string session_id = 1;
  // The attempt the credentials are for. The agent ignores credentials for
  // any other attempt; the control plane never refreshes an attempt that
  // isn't current.
  // Zero is invalid; the receiver rejects the message.
  int32 attempt = 2;
  // The new credentials. They replace the old ones as a whole.
  // secret: never log.
  // Absent is invalid; the receiver rejects the message.
  Credentials credentials = 3;
}

// Control plane to agent: extend the lease of a running attempt. Not acked:
// it is sent every 30 seconds and the lease survives three missed renewals.
message LeaseRenew {
  // The session being renewed.
  // Empty is invalid; the receiver rejects the message.
  string session_id = 1;
  // The attempt being renewed. The agent ignores a renewal for any other
  // attempt; the control plane never renews an attempt that isn't current.
  // Zero is invalid; the receiver rejects the message.
  int32 attempt = 2;
  // The new lease length, counted from receipt on the agent's lease clock
  // (the sleep-counting clock in StartSession.lease_ttl), exactly as there.
  // Absent or zero is invalid; the receiver rejects the message.
  google.protobuf.Duration lease_ttl = 3;
}

// Control plane to agent: stop one attempt of a session. Acked.
message StopSession {
  // The session to stop.
  // Empty is invalid; the receiver rejects the message.
  string session_id = 1;
  // The attempt to stop. The control plane acks and then ignores any reply
  // about an attempt that isn't the current one.
  // Zero is invalid; the receiver rejects the message.
  int32 attempt = 2;
  // Business idempotency key, as in StartSession.command_id: a repeated
  // StopSession is acked and acted on once.
  // Empty is invalid; the receiver rejects the message.
  string command_id = 3;
  // Why the session stops.
  StopReason reason = 4;
  // True if the agent should write and upload a checkpoint before stopping.
  bool checkpoint_first = 5;
  // How long the agent may spend checkpointing before it kills the
  // container anyway. Ignored when checkpoint_first is false.
  // Absent or zero is invalid when checkpoint_first is true; the receiver rejects the message.
  google.protobuf.Duration grace_period = 6;
}

// Agent to control plane: an attempt changed state or uploaded a checkpoint.
// Acked; kept on disk until acked.
message SessionStatus {
  // The session this is about.
  // Empty is invalid; the receiver rejects the message.
  string session_id = 1;
  // The attempt this is about. The control plane acks and then ignores a
  // status whose attempt isn't the current one, such as a late report from a
  // host that was replaced.
  // Zero is invalid; the receiver rejects the message.
  int32 attempt = 2;
  // Number of a field removed before v1 was released.
  reserved 4;

  // The attempt's state now.
  SessionState state = 3;
  // The container's exit code. Present only when the container exited, in
  // SUCCEEDED and FAILED; absent when a failure left no exit code. Zero means
  // the job exited successfully, so it must never stand in for "absent".
  optional int32 exit_code = 5;
  // What went wrong, when state is FAILED, STOPPED or LEASE_EXPIRED.
  SessionError error = 6;
  // The seq of this attempt's newest completed checkpoint, the one whose
  // completion marker the agent has written. Zero means none yet; seqs start
  // at 1. The control plane checks the marker exists before trusting it.
  int32 latest_checkpoint_seq = 7;
  // The highest log chunk seq of this attempt that has finished uploading, as
  // in RunningSession.latest_log_seq. A terminal status carries the last one:
  // the agent flushes its logs before reporting the end.
  int32 latest_log_seq = 8;
}

// Agent to control plane: one minute of work. One witness for billing; the
// control plane's lease record is the other. Acked; kept on disk until acked.
message UsageReport {
  // The session this minute belongs to.
  // Empty is invalid; the receiver rejects the message.
  string session_id = 1;
  // The attempt that ran this minute. The control plane acks and then ignores
  // reports whose attempt isn't the current one, so a host that comes back
  // after a re-match can't mark a minute it never ran.
  // Zero is invalid; the receiver rejects the message.
  int32 attempt = 2;
  // Session-wide minute index: StartSession.minute_index_base plus the
  // minutes this attempt has run, counted from zero. Optional so that "not
  // sent" can't pass for zero: absent is invalid and the receiver rejects the
  // message, while zero is the session's first minute.
  optional int32 minute_index = 3;
  // Seconds within this minute that the GPU was in use by the session.
  int32 gpu_seconds = 4;
  // Average GPU utilisation over the minute, in percent.
  int32 avg_util_pct = 5;
  // What the job did this minute, for the review of abuse (ADR 0038): never
  // billed on, never shown to a host, and kept 90 days. Absent from an agent
  // that doesn't send it, which is why `behaviour_reported` says whether the
  // rest is a measurement or just zeroes.
  bool behaviour_reported = 6;
  // Average GPU memory in use over the minute, in percent of the GPU's.
  int32 avg_memory_pct = 7;
  // Average PCIe traffic between the GPU and the machine over the minute,
  // both directions together, in KB/s. 0 where the GPU doesn't report it.
  int32 avg_pcie_kb_per_s = 8;
  // Bytes the job sent out over the minute.
  int64 network_out_bytes = 9;
  // Bytes the job received over the minute.
  int64 network_in_bytes = 10;
  // How many lines the job printed over the minute (a count; never a word).
  int64 printed_lines = 11;
  // How many of the job's new connections the fair-use limit dropped.
  int64 connections_dropped = 12;
}

// Agent to control plane: its runner saw something in a session that an admin
// should look at, or stopped the session for it (ADR 0038). Acked; the agent
// sends it again until then. Nothing in it names a path, an address or
// anything the job typed.
message AbuseSignal {
  // What the signal is.
  enum Kind {
    // Never sent. A receiver drops it.
    KIND_UNSPECIFIED = 0;
    // A process in the job has a name on the blocklist. Flag only.
    KIND_PROCESS_NAME = 1;
    // A process in the job is a build on the blocklist, by its SHA-256. The
    // runner stopped the session.
    KIND_PROCESS_HASH = 2;
    // The job looked up a mining pool's domain on the blocklist. The first
    // is a flag; the second in the same session stopped it.
    KIND_POOL_LOOKUP = 3;
    // The fair-use limit dropped the job's new connections for 5 minutes
    // running. Flag only.
    KIND_CONNECTION_DROPS = 4;
  }
  // The session the signal is about.
  // Empty is invalid; the receiver drops the message.
  string session_id = 1;
  // The attempt that showed it.
  // Zero is invalid; the receiver drops the message.
  int32 attempt = 2;
  // What the signal is.
  // UNSPECIFIED is invalid; the receiver drops the message.
  Kind kind = 3;
  // The process's name or the pool's domain from the blocklist, at most 200
  // characters; empty for connection drops.
  string detail = 4;
  // The executable's SHA-256, 64 lower-case hex digits, for KIND_PROCESS_HASH,
  // and for KIND_PROCESS_NAME when the runner could read the executable, so an
  // admin who confirms the session can add that build to the blocklist. Empty
  // otherwise.
  string sha256 = 5;
  // For KIND_CONNECTION_DROPS, how many new connections were dropped in all.
  int64 count = 6;
  // The runner stopped the session because of this signal.
  bool stopped = 7;
}
