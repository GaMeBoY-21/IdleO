syntax = "proto3";

package gpu.agent.v1;

import "google/protobuf/duration.proto";
import "gpu/agent/v1/enrollment.proto";
import "gpu/agent/v1/host.proto";
import "gpu/agent/v1/session.proto";
import "gpu/agent/v1/telemetry.proto";

// The control plane's endpoint for enrolled agents. Every call uses mutual
// TLS: the control plane identifies the host from its client certificate,
// never from a field in a message.
service AgentGatewayService {
  // One long-lived bidirectional stream per agent. The agent always opens it
  // and sends Hello first; the control plane answers with Welcome. When the
  // stream drops, the agent reconnects with exponential backoff (1 second
  // doubling to 60 seconds, plus random jitter).
  rpc OpenStream(stream OpenStreamRequest) returns (stream OpenStreamResponse);
  // Renews the host's client certificate. The agent calls it after 20 of the
  // certificate's 30 days. An expired certificate can't renew: the host
  // re-enrols with a new code from the web app.
  rpc RenewCertificate(RenewCertificateRequest) returns (RenewCertificateResponse);
}

// Agent to control plane: one message on the OpenStream stream.
message OpenStreamRequest {
  // Identifies this delivery: a UUIDv7 in canonical text form. A retry of the
  // same message reuses the same message_id, so the receiver can drop
  // duplicates. Business idempotency is command_id's job, not this field's.
  // Empty is invalid; the receiver rejects the message.
  string message_id = 1;
  // The message itself.
  oneof body {
    // First message after connecting. Not acked: answered by Welcome.
    Hello hello = 10;
    // Liveness and telemetry. Not acked: the next one is seconds away.
    Heartbeat heartbeat = 11;
    // The answer to an Offer. Acked.
    OfferReply offer_reply = 12;
    // A session attempt's state changed. Acked.
    SessionStatus session_status = 13;
    // One minute of usage. Acked.
    UsageReport usage_report = 14;
    // Acknowledges a StartSession, StopSession, UpdateAgent,
    // RefreshCredentials, HostStatus, RunSelfTest or UpdateBlocklist.
    Ack ack = 15;
    // The agent's self-test results. Acked.
    SelfTestReport self_test_report = 16;
    // The owner paused or resumed hosting from the tray. Acked.
    SetPause set_pause = 17;
    // The app is being uninstalled: remove this host. Acked.
    Leave leave = 18;
    // How an offered update went. Acked.
    UpdateResult update_result = 19;
    // Asks for a grant for the self-test's speed check. Answered by
    // SpeedTestGrant.
    SpeedTestRequest speed_test_request = 20;
    // The runner saw something in a session an admin should look at, or
    // stopped it for that. Acked.
    AbuseSignal abuse_signal = 21;
    // One check of a requested self-test ended, or the agent won't run it.
    // Acked.
    SelfTestProgress self_test_progress = 22;
  }
}

// Control plane to agent: one message on the OpenStream stream.
message OpenStreamResponse {
  // Identifies this delivery: a UUIDv7 in canonical text form. A retry of the
  // same message reuses the same message_id, so the receiver can drop
  // duplicates. Business idempotency is command_id's job, not this field's.
  // Empty is invalid; the receiver rejects the message.
  string message_id = 1;
  // The message itself.
  oneof body {
    // The answer to Hello. Not acked.
    Welcome welcome = 10;
    // A proposed session. Not acked: answered by OfferReply.
    Offer offer = 11;
    // Start a session attempt. Acked.
    StartSession start_session = 12;
    // Extend a lease. Not acked: the lease survives three missed renewals.
    LeaseRenew lease_renew = 13;
    // Stop a session attempt. Acked.
    StopSession stop_session = 14;
    // Install a newer agent build. Acked.
    UpdateAgent update_agent = 15;
    // Acknowledges an OfferReply, SessionStatus, UsageReport,
    // SelfTestReport, SelfTestProgress, SetPause, Leave, UpdateResult or
    // AbuseSignal.
    Ack ack = 16;
    // Fresh storage credentials for a running attempt. Acked.
    RefreshCredentials refresh_credentials = 17;
    // Where the host stands, for its tray. Acked.
    HostStatus host_status = 18;
    // The answer to SpeedTestRequest. Not acked.
    SpeedTestGrant speed_test_grant = 19;
    // Run the full self-test now. Acked.
    RunSelfTest run_self_test = 20;
    // A newer abuse blocklist, signed with the release key. Acked.
    UpdateBlocklist update_blocklist = 21;
  }
}

// Agent to control plane: the first message on every new stream. Carries no
// host id: the control plane derives the host from the client certificate.
message Hello {
  // The agent's version, semantic versioning, for example "1.4.2".
  // Empty is invalid; the receiver rejects the message.
  string agent_version = 1;
  // The host's operating system.
  OperatingSystem os = 2;
  // Operating system version, for example "Windows 11 26100".
  string os_version = 3;
  // Every GPU on the host. Desktops can have more than one.
  repeated GpuInfo gpus = 4;
  // Sessions still running locally, so the control plane can reconcile them
  // after a reconnect or an agent restart.
  repeated RunningSession running_sessions = 5;
  // Free space, in MB, on the disk where sessions' scratch folders and staged
  // inputs go, as in Heartbeat.free_disk_mb, so the scheduler knows the
  // host's room from the moment it connects. Absent when the agent couldn't
  // read it.
  optional int32 free_disk_mb = 6;
  // The version of the abuse blocklist the agent's job runner is using, so the
  // control plane sends a newer one only. Empty when the agent has no runner
  // yet, and from agents older than this field.
  string blocklist_version = 7;
}

// Rules the control plane sets for this agent.
message AgentPolicy {
  // How often the agent sends Heartbeat.
  // Absent or zero is invalid; the receiver rejects the message.
  google.protobuf.Duration heartbeat_interval = 1;
  // GPU temperature cap, in degrees Celsius. The agent throttles or declines
  // work at or above it.
  // Zero is invalid; the receiver rejects the message.
  int32 gpu_temp_cap_c = 2;
  // The most sessions the agent may run at once.
  // Zero is invalid; the receiver rejects the message.
  int32 max_concurrent_sessions = 3;
}

// A job image the agent may download before anyone asks for it, so a renter's job starts at once (ADR 0035).
message PrefetchImage {
  // The image, pinned by digest: registry/name@sha256:...
  // Empty is invalid; the receiver ignores the entry.
  string image = 1;
  // The GPU memory, in MB, the least demanding template that uses it needs. The agent fetches only images whose
  // templates fit its largest GPU.
  int32 min_vram_mb = 2;
}

// Control plane to agent: the answer to Hello.
message Welcome {
  // Rules for this agent.
  AgentPolicy policy = 1;
  // The oldest agent version the control plane still supports (the last
  // three releases). An older agent updates before taking work.
  // Empty is invalid; the receiver rejects the message.
  string minimum_agent_version = 2;
  // The job images worth having on the machine before a job needs them: every image of the template catalog's visible
  // services. The agent downloads those that fit its GPU, one at a time, while the host is listed and idle, never on a
  // metered connection and never while a session runs. Empty for an older control plane; nothing is downloaded then.
  repeated PrefetchImage prefetch_images = 3;
}

// Confirms that a message was received and durably recorded. It doesn't mean
// the message was accepted: a StartSession for a stale attempt is acked and
// then ignored. The sender keeps its retry copy until the ack arrives. Acks
// are never acked.
message Ack {
  // The message_id of the envelope being acknowledged.
  // Empty is invalid; the receiver rejects the message.
  string acked_message_id = 1;
}

// Control plane to agent: install a newer, signed agent build. Acked when
// received; the agent installs it once no session is running. Sent once per
// connection, and only when the version is newer than the agent's, the host
// is in the release's rollout, and the host hasn't rolled that version back.
message UpdateAgent {
  // The version to install, semantic versioning. Mirrors the manifest's.
  // Empty is invalid; the receiver rejects the message.
  string version = 1;
  // Deprecated, never used by any agent: the signed manifest (field 5)
  // replaced it.
  string download_url = 2;
  // Deprecated, never used by any agent: the signed manifest (field 5)
  // carries the SHA-256 of each file.
  string sha256 = 3;
  // Deprecated, never used by any agent: the release is signed with Ed25519
  // over the manifest (field 6), not with cosign.
  bytes cosign_signature = 4;
  // The release's manifest, JSON, exactly as signed: version, channel,
  // rollout, the minimum Windows build, and the size and SHA-256 of the app
  // zip, the distro tarball and the setup program.
  // Empty is invalid; the receiver rejects the message.
  bytes manifest = 5;
  // The Ed25519 signature over `manifest`. The agent installs only a release
  // whose manifest verifies against the release key built into it.
  // Empty is invalid; the receiver rejects the message.
  bytes manifest_signature = 6;
  // Where to download the app zip, valid for an hour. Not signed: the
  // manifest's size and SHA-256 are the check.
  // Empty is invalid; the receiver rejects the message.
  string app_url = 7;
  // Where to download the distro tarball, valid for an hour. Not signed: the
  // manifest's size and SHA-256 are the check.
  // Empty is invalid; the receiver rejects the message.
  string distro_url = 8;
}

// Control plane to agent: a newer abuse blocklist (ADR 0038), as its own signed
// file in the release feed, so a wrong entry can be pulled within a day without
// a new distribution. Acked when received. Sent once per connection when the
// agent's Hello says it has an older one, and to connected agents when the
// control plane reads a newer one from the feed. The agent uses it only if the
// signature verifies against the release key built into it and its version is
// newer than the one its runner holds; the runner keeps the last good copy.
message UpdateBlocklist {
  // The list's version: a date, or the time it was issued, like
  // "2026-10-25T09:30:00Z". Mirrors the file's.
  // Empty is invalid; the receiver rejects the message.
  string version = 1;
  // The list, JSON, exactly as signed.
  // Empty is invalid; the receiver rejects the message.
  bytes blocklist = 2;
  // The Ed25519 signature over `blocklist`.
  // Empty is invalid; the receiver rejects the message.
  bytes signature = 3;
}

// Asks for a fresh client certificate.
message RenewCertificateRequest {
  // A DER-encoded PKCS#10 certificate signing request for a new key pair.
  // The private key never leaves the host.
  // Empty is invalid; the receiver rejects the message.
  bytes csr_der = 1;
}

// The renewed client certificate.
message RenewCertificateResponse {
  // The new certificate and its chain.
  IssuedCertificate certificate = 1;
}
