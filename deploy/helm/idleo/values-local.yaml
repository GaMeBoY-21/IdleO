# The Mac's k3d cluster (scripts/k8s/up.sh, docs/runbooks/kubernetes.md): the images from the cluster's own registry,
# the local profile's development settings (fake GPUs, the development sign-in server, MinIO, the fake PAN check),
# the web image, and addresses on *.idleo.localhost, which is this machine. Ports are this machine's, and Traefik's
# entry points use the same (deploy/k3s/local/traefik.yaml), so an address is the same in the cluster and out.
images:
  registry: k3d-idleo-registry:5050
  # up.sh sets the tag to the commit it built.

controlPlane:
  profiles: local,cluster
  agentPort: 19443
  settings:
    IDENTITY_ISSUERS_0_ISSUERURI: http://signin.idleo.localhost:18099/idleo-local
    IDENTITY_ISSUERS_0_AUDIENCE: idleo-local
    SESSIONS_STORAGE_ENDPOINT: http://storage.idleo.localhost:19100
    SPRING_MAIL_HOST: idleo-mail
    SPRING_MAIL_PORT: "1025"
    WEB_ALLOWEDORIGINS: https://app.idleo.localhost:8443,https://host.idleo.localhost:8443,https://idleo.localhost:8443
    # The admin site's (ADR 0058), the only one that may call /admin/v1, where the console's passkeys are used.
    WEB_ADMINORIGINS: https://admin.idleo.localhost:8443
    IDENTITY_WEB_APP_URL: https://app.idleo.localhost:8443
    NOTIFICATIONS_WEB_APP_URL: https://app.idleo.localhost:8443
    NOTIFICATIONS_HOST_SITE_URL: https://host.idleo.localhost:8443
    NOTIFICATIONS_ADMIN_SITE_URL: https://admin.idleo.localhost:8443
    # A host link is approved on the host site (ADR 0058).
    HOSTS_LINK_WEB_APP_URL: https://host.idleo.localhost:8443
    # Anyone signing in is let in, as with ./start.sh: no invite step on this machine.
    IDENTITY_INVITE_ONLY: "false"
    # The control plane's backup watch is ./start.sh's (WAL-G); here the database's backups are CloudNativePG's.
    BACKUPS_CREATEBUCKET: "false"

# Plain Helm (scripts/k8s/up.sh) has no Flagger; up.sh --gitops turns canaries on, as every Flux cluster has them.
canary:
  enabled: false

scanner:
  enabled: true
  scratch: 4Gi

web:
  enabled: true

database:
  storage: 2Gi
  # Into the development MinIO, which makes the bucket as it starts (templates/development.yaml).
  backups:
    endpoint: http://idleo-storage:19100
    destination: s3://idleo-backups/local

gateway:
  redirectPort: 8443
  hosts:
    api: api.idleo.localhost
    app: app.idleo.localhost
    host: host.idleo.localhost
    admin: admin.idleo.localhost
    site: idleo.localhost

tls:
  issuer:
    kind: Issuer
    name: idleo-local-ca
  localCa:
    enabled: true
    secret: idleo-local-ca

development:
  enabled: true
  # up.sh makes it from templates/development.yaml, and the sign-in server's from control-plane/local-sign-in.json.
  catalog: idleo-development-catalog
  storage:
    # Uploads come from the renter app, and an appeal's evidence from either site.
    allowedOrigins: https://app.idleo.localhost:8443,https://host.idleo.localhost:8443
