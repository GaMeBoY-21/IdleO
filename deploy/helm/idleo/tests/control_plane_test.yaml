# The control plane's own promises (ADR 0045, 0047): probes on the health groups, a drained rolling update, two copies
# spread across nodes with never fewer than one up, Flyway as the migration user only, the client's address believed
# only from the ingress, and agents' TLS straight to it.
suite: the control plane
values:
  - ../values-local.yaml
set:
  images.tag: test
tests:
  - it: is ready on the readiness group and alive on the liveness group
    template: templates/control-plane.yaml
    documentSelector: { path: kind, value: Deployment }
    asserts:
      - equal: { path: "spec.template.spec.containers[0].readinessProbe.httpGet.path", value: /actuator/health/readiness }
      - equal: { path: "spec.template.spec.containers[0].livenessProbe.httpGet.path", value: /actuator/health/liveness }
      - equal: { path: spec.strategy.rollingUpdate.maxUnavailable, value: 0 }
      - equal: { path: "spec.template.spec.containers[0].lifecycle.preStop.sleep.seconds", value: 10 }
  - it: runs two copies, spread across nodes, at most one taken down at a time
    template: templates/control-plane.yaml
    documentSelector: { path: kind, value: Deployment }
    asserts:
      - equal: { path: spec.replicas, value: 2 }
      - equal: { path: "spec.template.spec.topologySpreadConstraints[0].topologyKey", value: kubernetes.io/hostname }
      - equal:
          path: "spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].podAffinityTerm.labelSelector.matchLabels"
          value: { app.kubernetes.io/instance: RELEASE-NAME, idleo.in/control-plane: "true" }
  - it: never lets a drain take the last copy, and scales between 2 and 2 by CPU
    template: templates/control-plane-scaling.yaml
    asserts:
      - equal: { path: spec.minAvailable, value: 1 }
        documentSelector: { path: kind, value: PodDisruptionBudget }
      - equal: { path: spec.selector.matchLabels, value: { app.kubernetes.io/instance: RELEASE-NAME, idleo.in/control-plane: "true" } }
        documentSelector: { path: kind, value: PodDisruptionBudget }
      - equal: { path: spec.minReplicas, value: 2 }
        documentSelector: { path: kind, value: HorizontalPodAutoscaler }
      - equal: { path: spec.maxReplicas, value: 2 }
        documentSelector: { path: kind, value: HorizontalPodAutoscaler }
  - it: gives Flagger's primary the two copies and the canary one
    template: templates/canary.yaml
    set:
      canary.enabled: true
    documentSelector: { path: kind, value: Canary }
    asserts:
      - equal: { path: spec.autoscalerRef.primaryScalerReplicas, value: { minReplicas: 2, maxReplicas: 2 } }
  - it: serves as the application user, with Flyway off on the cluster profile
    template: templates/configmap.yaml
    asserts:
      - equal: { path: data.SPRING_DATASOURCE_USERNAME, value: idleo_app }
      - matchRegex: { path: data.SPRING_PROFILES_ACTIVE, pattern: ",cluster$" }
      - equal: { path: data.INGRESS_PROXIES, value: '10\.42\.\d{1,3}\.\d{1,3}' }
  - it: migrates as the migration user, before an upgrade and after the first install
    template: templates/migration-job.yaml
    asserts:
      - equal: { path: "metadata.annotations[\"helm.sh/hook\"]", value: "post-install,pre-upgrade" }
      - contains:
          path: "spec.template.spec.containers[0].env"
          content: { name: SPRING_DATASOURCE_USERNAME, value: idleo_migration }
      - equal: { path: "spec.template.spec.containers[0].args[2]", value: com.idleo.migration.DatabaseMigration }
  - it: publishes the agents' port as plain TCP to the control plane, never through the ingress
    template: templates/control-plane.yaml
    documentSelector: { path: metadata.name, value: idleo-control-plane-agents }
    asserts:
      - equal: { path: spec.type, value: LoadBalancer }
      - equal: { path: "spec.ports[0].port", value: 19443 }
      - equal: { path: "spec.ports[0].targetPort", value: agents }
  - it: lets only the ingress's pods reach the web port
    template: templates/control-plane.yaml
    documentSelector: { path: kind, value: NetworkPolicy }
    asserts:
      - equal:
          path: "spec.ingress[0].from[0].podSelector.matchLabels"
          value: { app.kubernetes.io/name: traefik }
      - equal: { path: "spec.ingress[0].ports[0].port", value: http }
