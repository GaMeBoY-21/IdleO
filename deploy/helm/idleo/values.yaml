# IdleO on one k3s node (ADR 0045). These defaults are production's and safe: an environment's values (values-local.yaml
# here; deploy/clusters/<env>/idleo/values.yaml for staging and production, ADR 0046) set only what must differ: hosts,
# sizes, replicas, issuers and the development services.
#
# Sizes are for one 8 GB node (ADR 0047). Memory requests, then limits, in production (no scanner, web or development
# services):
#   control plane 2 x 1024/1536 Mi, migration Job 384/512 Mi (only while it runs), Valkey 64/256 Mi,
#   database 2 x (512/1024 Mi + its backup sidecar 64/256 Mi), the canary's load tester 32/64 Mi
#   total, steady: requests 3296 Mi, limits 5952 Mi.
# Beside the chart: Flux's four controllers (4 x 64 Mi requested), Flagger (32/128 Mi), Prometheus (128/256 Mi),
# CloudNativePG's operator (128/384 Mi) and backup plugin (32/128 Mi): 576 Mi requested; k3s, Traefik and cert-manager
# use about 900 Mi. So 4.7 GiB requested at rest, with about 1 GiB for the OS: 2.3 GiB spare. During a canary its one
# copy (1024/1536 Mi) and the migration Job add 1.4 GiB: 1 GiB spare. A third control plane would leave none, so the
# autoscaler's most is 2 (controlPlane.autoscaling).
# Measured on the Mac's k3d node under Flux, 2026-10-31, with the development services: 4.0 to 4.4 GiB in use at rest
# (each control plane about 585 Mi, the database's instances 116 and 189 Mi, the operator 38 Mi, the plugin 19 Mi), and
# 5.3 GiB at a canary's peak.
# The scanner (768/2048 Mi), when renters' own images are on, borrows from the spare: its limit is what one image check
# needs (ADR 0042); its request is what it idles at.

images:
  # ghcr.io/gameboy-21/idleo-<name>:<tag>, signed by .github/workflows/images.yml.
  registry: ghcr.io/gameboy-21
  # The git commit the images were built from. Required: it names the release (IDLEO_RELEASE).
  tag: ""
  # Each image's digest (control-plane, web, scanner: sha256:...), which pins it to the bytes the images
  # workflow scanned and signed. Staging and production set every one (deploy/clusters/<env>/release.yaml); without
  # one, an image is pulled by its tag.
  digests: {}
  pullPolicy: IfNotPresent

controlPlane:
  # Two copies, always (ADR 0047): losing one, or a rolling update, costs renters and hosts nothing. The autoscaler
  # keeps between these, by CPU; with canaries Flagger gives the primary the same and runs one canary copy beside it.
  # Three don't fit one 8 GB node at a canary's peak (above), so the most is 2 until there are more nodes.
  autoscaling:
    minReplicas: 2
    maxReplicas: 2
    cpuUtilization: 70
  # The environment's profile, then the cluster's (application-cluster.yaml).
  profiles: prod,cluster
  # Non-secret settings, as environment variables (the ConfigMap). Secrets come from the Secret named below.
  settings: {}
  # Made outside the chart: SOPS files, as every Secret is (ADR 0046).
  secret: idleo-control-plane
  # Tomcat believes X-Forwarded-For only from these addresses, a regular expression: the pod network, which the
  # network policy narrows to the ingress's own pods for this port.
  ingressProxies: '10\.42\.\d{1,3}\.\d{1,3}'
  # The agents' gRPC port, published by its own LoadBalancer Service: their mutual TLS ends at the control plane.
  agentPort: 9443
  # The meters in Prometheus's format, on a port of their own (application-cluster.yaml) that only the in-cluster
  # Prometheus may reach and no route leads to: what Flagger judges a canary by (ADR 0046).
  metricsPort: 9464
  resources:
    requests: { cpu: 500m, memory: 1024Mi }
    limits: { memory: 1536Mi }
  # A rolling update: the new pod is ready before the old one stops. The old one leaves the Service, waits preStop
  # seconds for the ingress and load balancer to notice, tells its agents to reconnect, drains HTTP within Spring's 30 s
  # shutdown phase, and is gone within the grace period.
  preStopSeconds: 10
  terminationGracePeriodSeconds: 60

# The control plane is released as a canary (Flagger, ADR 0046): the new version takes 10%, then 25%, 50% and 100% of
# the API's traffic, a step each interval while every check passes, then becomes the primary. One failed check rolls
# it back: halted at once at its weight, and all traffic back to the primary at the next step. Off where Flagger isn't
# installed (plain Helm on the Mac, values-local.yaml).
canary:
  enabled: true
  interval: 2m
  stepWeights: [10, 25, 50, 100]
  # A step fails when, over its interval, more than this percent of the canary's API requests answer 5xx, or their
  # 95th percentile takes longer than this many milliseconds; or when the session-start success rate over the last
  # 10 minutes (both versions: an agent's stream may be on either) is more than this many points below the hour before.
  maxServerErrorPercent: 1
  maxLatencyP95Ms: 800
  maxSessionStartDropPoints: 10
  prometheus: http://prometheus.monitoring:9090
  # Flagger's load tester, which sends the canary one request a second through each step, so a quiet hour still gives
  # it something to be judged by.
  loadtester:
    image: ghcr.io/fluxcd/flagger-loadtester:0.39.0@sha256:6a8546993cb574cdd9d42a84430eca2b74c30bf91349e36aa60969b46655f059
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 64Mi }

migration:
  resources:
    requests: { cpu: 250m, memory: 384Mi }
    limits: { memory: 512Mi }

scanner:
  # Renters' own images are off until the scanner is measured on the real server (ADR 0042).
  enabled: false
  resources:
    requests: { cpu: 100m, memory: 768Mi }
    limits: { cpu: "2", memory: 2048Mi }
  scratch: 20Gi
  trivyCache: 2Gi
  settings: {}

web:
  # Production's app and website are on Cloudflare Pages; this serves them in the local cluster, or as a fallback.
  enabled: false
  resources:
    requests: { cpu: 50m, memory: 32Mi }
    limits: { memory: 64Mi }

valkey:
  # The official image, pinned (the same as compose.yaml and the tests'). It holds only what may expire (ADR 0011):
  # nothing is saved to disk.
  image: valkey/valkey:9.1.2@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }

# The database (ADR 0047): CloudNativePG's Cluster, a primary and a streaming standby that takes over by itself, made
# by the operator in deploy/infrastructure/ (cnpg-system). The control plane, the migration Job and operator commands
# reach the primary through the Cluster's -rw Service, whichever instance it is.
database:
  name: controlplane
  # PostgreSQL 18.6, CloudNativePG's minimal image (no Barman inside: the backup plugin's sidecar has it), pinned.
  image: ghcr.io/cloudnative-pg/postgresql:18.6-minimal-trixie@sha256:64abc98a4387361afd6821a3a99f975763bbd87bbdde9449e75ad6002528a318
  instances: 2
  # Each instance's volume.
  storage: 20Gi
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { memory: 1024Mi }
  # Sized for that limit: shared buffers a quarter of it, and the connections ADR 0047 counts (2 control planes and a
  # canary at Hikari's 10 each, the migration Job, operator commands and CloudNativePG's own: about 45 of these).
  parameters:
    max_connections: "100"
    shared_buffers: 256MB
    effective_cache_size: 512MB
    work_mem: 4MB
    maintenance_work_mem: 64MB
    # A WAL segment goes to the backups at least every 30 seconds while anything is written: the most a lost node and
    # its disk cost (docs/runbooks/backups.md).
    archive_timeout: 30s
  # The users' passwords, each a kubernetes.io/basic-auth Secret made outside the chart (SOPS): the migration user,
  # which owns the database and so everything in it, and the application user the control plane serves as (ADR 0045).
  migrationSecret: idleo-database-migration
  applicationSecret: idleo-database-application
  # Backups (ADR 0047): the Barman Cloud plugin archives every WAL segment and keeps a daily base backup, 30 days of
  # both, in S3-compatible storage (R2 in staging and production, the development MinIO here). Its keys are the Secret
  # named here, ACCESS_KEY_ID and ACCESS_SECRET_KEY.
  backups:
    enabled: true
    endpoint: ""
    # s3://<bucket>/<folder>: one folder a cluster.
    destination: ""
    secret: idleo-backup-storage
    retention: 30d
    # Seconds first: 03:00 India time, 21:30 UTC.
    schedule: "0 30 21 * * *"
    # The sidecar each instance runs to archive and back up.
    resources:
      requests: { cpu: 20m, memory: 64Mi }
      limits: { memory: 256Mi }

gateway:
  # Traefik's Gateway API class (k3s's own Traefik, deploy/k3s/).
  className: traefik
  # Traefik's entry points, by their ports inside its pod.
  httpPort: 8000
  httpsPort: 8443
  # The port HTTP is redirected to, when the public HTTPS port isn't 443.
  redirectPort: null
  hosts:
    api: api.idleo.in
    app: app.idleo.in
    site: idleo.in

tls:
  # The cert-manager issuer for the Gateway's certificate. Production's (Let's Encrypt) is made with the server.
  issuer:
    kind: ClusterIssuer
    name: letsencrypt
  # A CA of our own, from a Secret holding its tls.crt and tls.key (the local cluster's, scripts/k8s/up.sh): the chart
  # makes an Issuer from it. Off in production.
  localCa:
    enabled: false
    secret: idleo-local-ca

networkPolicy:
  # Where the ingress's pods are, the only ones that may reach the control plane's web port.
  ingressNamespace: kube-system
  ingressPodLabels:
    app.kubernetes.io/name: traefik

# Development's stand-ins (ADR 0013): the sign-in server, object storage and the mail catcher, each on a port of its
# own. Never in production (the prod profile refuses all three, ProductionSettingsGuard).
development:
  enabled: false
  # A ConfigMap holding templates/development.yaml, for the agent's development runner.
  catalog: ""
  signIn:
    image: ghcr.io/navikt/mock-oauth2-server:6.0.4@sha256:47374fe063995d9b6d39ebb6ea21eb5f765025bf0aa08b61b08b439eb91adaf0
    port: 18099
  storage:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    port: 19100
    allowedOrigins: ""
  mail:
    image: axllent/mailpit:v1.31.5@sha256:94f6b70c1436defae6799d9ac7ff0eeff9540465b842026d5cdb018f1c0234ea
    port: 18025

# An operator command (docs/runbooks/granting-credits.md, hosts.md), as a one-off pod: scripts/k8s/ops.sh renders
# templates/operator-command.yaml with this set and runs it. Empty, nothing is rendered.
operator:
  name: ""
  operatorName: ""
  args: []
  # Another database Cluster to run it against (a restored one, ops/backup/restore.sh); the live one when empty.
  database: ""
