# PostgreSQL (ops/postgres's image, ADR 0036) as one StatefulSet with its own volume, until CloudNativePG. Its first
# start makes the migration and application users (ops/postgres/initdb, ADR 0045).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: idleo-postgres
  labels:
    {{- include "idleo.labels" (list . "postgres") | nindent 4 }}
spec:
  serviceName: idleo-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "idleo.selector" (list . "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "idleo.selector" (list . "postgres") | nindent 8 }}
    spec:
      {{- include "idleo.podSecurity" 999 | nindent 6 }}
      # Time for a clean shutdown: a fast stop writes a checkpoint.
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: {{ include "idleo.image" (list . "postgres") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          env:
            - { name: POSTGRES_USER, value: postgres }
            - { name: POSTGRES_DB, value: {{ .Values.postgres.database | quote }} }
            # A folder inside the volume, so initdb makes it with the owner and mode it wants.
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.postgres.secret }}, key: POSTGRES_PASSWORD } }
            - name: IDLEO_MIGRATION_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.postgres.secret }}, key: IDLEO_MIGRATION_PASSWORD } }
            - name: IDLEO_APPLICATION_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.postgres.secret }}, key: IDLEO_APPLICATION_PASSWORD } }
          ports:
            - { name: postgres, containerPort: 5432 }
          readinessProbe:
            exec: { command: [pg_isready, -q, -h, /var/run/postgresql] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: [pg_isready, -q, -h, /var/run/postgresql] }
            periodSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          {{- include "idleo.containerSecurity" . | nindent 10 }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: run
          emptyDir: { medium: Memory, sizeLimit: 8Mi }
        - name: tmp
          emptyDir: { sizeLimit: 1Gi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: idleo-postgres
  labels:
    {{- include "idleo.labels" (list . "postgres") | nindent 4 }}
spec:
  selector:
    {{- include "idleo.selector" (list . "postgres") | nindent 4 }}
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
---
# Only the control plane, the migration Job and operator commands reach the database.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: idleo-postgres
  labels:
    {{- include "idleo.labels" (list . "postgres") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "idleo.selector" (list . "postgres") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              idleo.in/database-client: "true"
      ports:
        - { port: postgres, protocol: TCP }
