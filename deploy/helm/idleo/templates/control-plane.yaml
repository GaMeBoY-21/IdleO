apiVersion: apps/v1
kind: Deployment
metadata:
  name: idleo-control-plane
  labels:
    {{- include "idleo.labels" (list . "control-plane") | nindent 4 }}
spec:
  {{- if not .Values.canary.enabled }}
  replicas: {{ .Values.controlPlane.autoscaling.minReplicas }}
  {{- end }}
  {{- /* The autoscaler owns the count (control-plane-scaling.yaml). With canaries, Flagger does: this Deployment is
  the canary, scaled to zero between releases, and its copy idleo-control-plane-primary serves (canary.yaml). */}}
  selector:
    matchLabels:
      {{- include "idleo.selector" (list . "control-plane") | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # The new pod is ready before the old one goes, so agents always have somewhere to reconnect to.
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "idleo.selector" (list . "control-plane") | nindent 8 }}
        {{- /* Flagger renames the primary's name label (control-plane-primary), so the agents' Service and the
        network policies find the control plane's pods, either version, by this one. */}}
        idleo.in/control-plane: "true"
        {{- include "idleo.controlPlaneClient" . | nindent 8 }}
      annotations:
        # A changed setting rolls the pods.
        checksum/settings: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- include "idleo.podSecurity" 10001 | nindent 6 }}
      priorityClassName: {{ .Values.priorityClasses.core }}
      terminationGracePeriodSeconds: {{ .Values.controlPlane.terminationGracePeriodSeconds }}
      # Copies on different nodes when there are several (ADR 0047); on one node, all on it. Either version's pods
      # count, by the label Flagger leaves alone.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              idleo.in/control-plane: "true"
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/instance: {{ .Release.Name }}
                    idleo.in/control-plane: "true"
      initContainers:
        # On a first install the migration Job runs once the database is up (post-install): until the schema is
        # there, this fails (a division by zero), and the kubelet tries it again. An upgrade's schema is migrated
        # before its pods roll, so this passes at once. It's the database's own image, so this Deployment names that
        # digest, verified with it, and CloudNativePG's pods, which no controller of their own names, are admitted
        # without GHCR or Sigstore when either is down (ADR 0048).
        - name: wait-for-schema
          image: {{ .Values.database.image }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command:
            - psql
            - --no-psqlrc
            - --quiet
            - --host=idleo-database-rw
            - --username=idleo_app
            - --dbname={{ .Values.database.name }}
            - --command=select 1 / (to_regclass('modulith.event_publication') is not null)::int
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.applicationSecret }}
                  key: password
            - name: PGCONNECT_TIMEOUT
              value: "5"
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 32Mi }
          {{- include "idleo.containerSecurity" . | nindent 10 }}
      containers:
        - name: control-plane
          image: {{ include "idleo.image" (list . "control-plane") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          {{- include "idleo.controlPlaneEnv" . | nindent 10 }}
          ports:
            - { name: http, containerPort: 8080 }
            - { name: agents, containerPort: 9443 }
            - { name: scanner-api, containerPort: 8095 }
            - { name: metrics, containerPort: {{ .Values.controlPlane.metricsPort }} }
          # The JVM starts in tens of seconds; liveness waits for it.
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
            failureThreshold: 3
          # The database and a CA inside its validity (ADR 0036): out of rotation, not restarted, when either is gone.
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
            failureThreshold: 2
          lifecycle:
            preStop:
              sleep:
                seconds: {{ .Values.controlPlane.preStopSeconds }}
          resources:
            {{- toYaml .Values.controlPlane.resources | nindent 12 }}
          {{- include "idleo.containerSecurity" . | nindent 10 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            {{- if .Values.development.catalog }}
            - { name: catalog, mountPath: /etc/idleo/catalog, readOnly: true }
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 64Mi }
        {{- with .Values.development.catalog }}
        - name: catalog
          configMap: { name: {{ . }} }
        {{- end }}
{{- if not .Values.canary.enabled }}
---
# The web API for the ingress, and the scanner's internal API (ADR 0042), inside the cluster only. With canaries,
# Flagger makes this Service (for the primary) and its -primary and -canary siblings, with every port (canary.yaml).
apiVersion: v1
kind: Service
metadata:
  name: idleo-control-plane
  labels:
    {{- include "idleo.labels" (list . "control-plane") | nindent 4 }}
spec:
  selector:
    {{- include "idleo.selector" (list . "control-plane") | nindent 4 }}
  ports:
    - { name: http, port: 8080, targetPort: http }
    - { name: scanner-api, port: 8095, targetPort: scanner-api }
{{- end }}
---
# The agents' port (ADR 0010): TCP straight to the control plane, so their mutual TLS ends there and nowhere before.
# A load balancer of its own, not the ingress: a restart or upgrade of Traefik never drops an agent's stream, and the
# control plane sees each agent's own address (externalTrafficPolicy: Local). During a canary it reaches both
# versions' pods: traffic weights don't apply to long-lived streams, so either version serves any agent (ADR 0046).
apiVersion: v1
kind: Service
metadata:
  name: idleo-control-plane-agents
  labels:
    {{- include "idleo.labels" (list . "control-plane") | nindent 4 }}
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    idleo.in/control-plane: "true"
  ports:
    - { name: agents, port: {{ .Values.controlPlane.agentPort }}, targetPort: agents, protocol: TCP }
---
# Who may reach the control plane: the ingress on the web port (so X-Forwarded-For from the pod network is the
# ingress's), the scanner on its internal API, the in-cluster Prometheus on the meters' port, and anyone on the
# agents' port, which mutual TLS guards. With canaries, also the canary's load on the web port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: idleo-control-plane
  labels:
    {{- include "idleo.labels" (list . "control-plane") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      idleo.in/control-plane: "true"
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- include "idleo.ingressPeer" . | nindent 8 }}
      ports:
        - { port: http, protocol: TCP }
    - from:
        - podSelector:
            matchLabels:
              {{- include "idleo.selector" (list . "scanner") | nindent 14 }}
      ports:
        - { port: scanner-api, protocol: TCP }
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - { port: metrics, protocol: TCP }
    {{- if .Values.canary.enabled }}
    - from:
        - podSelector:
            matchLabels:
              {{- include "idleo.selector" (list . "canary-load") | nindent 14 }}
      ports:
        - { port: http, protocol: TCP }
    {{- end }}
    - ports:
        - { port: agents, protocol: TCP }
