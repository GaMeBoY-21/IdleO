{{- if .Values.web.enabled }}
# The renter app, the website, the host site and the admin site (web/Dockerfile, ADR 0058): nginx, the app on 8080, the
# website on 8081, the host site on 8082 and the admin site on 8083.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: idleo-web
  labels:
    {{- include "idleo.labels" (list . "web") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "idleo.selector" (list . "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "idleo.selector" (list . "web") | nindent 8 }}
    spec:
      {{- include "idleo.podSecurity" 101 | nindent 6 }}
      initContainers:
        {{- include "idleo.networkPolicyWait" $ | nindent 8 }}
      containers:
        - name: web
          image: {{ include "idleo.image" (list . "web") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - { name: app, containerPort: 8080 }
            - { name: site, containerPort: 8081 }
            - { name: host, containerPort: 8082 }
            - { name: admin, containerPort: 8083 }
          readinessProbe:
            httpGet: { path: /sign-in/, port: app }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: site }
            periodSeconds: 10
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          {{- include "idleo.containerSecurity" . | nindent 10 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 16Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: idleo-web
  labels:
    {{- include "idleo.labels" (list . "web") | nindent 4 }}
spec:
  selector:
    {{- include "idleo.selector" (list . "web") | nindent 4 }}
  ports:
    - { name: app, port: 8080, targetPort: app }
    - { name: site, port: 8081, targetPort: site }
    - { name: host, port: 8082, targetPort: host }
    - { name: admin, port: 8083, targetPort: admin }
---
# The ingress reaches the four sites. The web server itself reaches nothing, not even DNS: it serves files.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: idleo-web
  labels:
    {{- include "idleo.labels" (list . "web") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "idleo.selector" (list . "web") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- include "idleo.ingressPeer" . | nindent 8 }}
      ports:
        - { port: app, protocol: TCP }
        - { port: site, protocol: TCP }
        - { port: host, protocol: TCP }
        - { port: admin, protocol: TCP }
{{- end }}
