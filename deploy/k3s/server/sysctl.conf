# The kernel settings the kubelet expects (ADR 0048), which deploy/k3s/server/config.yaml's protect-kernel-defaults
# makes it insist on instead of setting: /etc/sysctl.d/90-kubelet.conf on the server, applied (sysctl -p) before k3s
# first starts.
vm.panic_on_oom=0
vm.overcommit_memory=1
kernel.panic=10
kernel.panic_on_oops=1
