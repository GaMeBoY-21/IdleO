# The release up.sh --gitops built on this machine (ADR 0046): the chart and images in the cluster's own registry,
# pinned by the digests it pushed (the ConfigMap flux-system/local-release). A chart built here has no signature from
# the images workflow, so this one source isn't verified; canary-test.sh has this cluster verify a real one, staging's,
# with the same verify block.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: idleo-chart
  namespace: idleo
spec:
  # The registry's own port on k3d's network (this machine reaches it as localhost:5050; the nodes' containerd maps
  # the images' k3d-idleo-registry:5050 to it, but Flux's controllers connect to it directly).
  url: oci://k3d-idleo-registry:5000/charts/idleo
  insecure: true
  ref:
    digest: ${CHART_DIGEST}
  verify: null
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: idleo
  namespace: idleo
spec:
  values:
    images:
      tag: "${IMAGE_TAG}"
      digests:
        control-plane: ${CONTROL_PLANE_DIGEST}
        web: ${WEB_DIGEST}
        scanner: ${SCANNER_DIGEST}
