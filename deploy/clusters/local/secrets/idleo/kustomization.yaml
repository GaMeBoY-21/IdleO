# The local cluster's Secrets, SOPS files encrypted for the local age key (.sops.yaml), made by scripts/k8s/secrets.sh
# --make: development's database passwords, the control plane's secrets from the development CA and keys, and the
# local CA for the Gateway's certificate.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - database.yaml
  - control-plane.yaml
  - local-ca.yaml
