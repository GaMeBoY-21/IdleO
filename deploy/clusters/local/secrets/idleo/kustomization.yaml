# The local cluster's Secrets, SOPS files encrypted for the local age key (.sops.yaml), made by scripts/k8s/secrets.sh
# --make: development's database users (CloudNativePG's basic-auth Secrets) and the development MinIO's keys for the
# database's backups, the control plane's secrets from the development CA and keys, Valkey's password, and the local CA
# for the Gateway's certificate.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - database-migration.yaml
  - database-application.yaml
  - backup-storage.yaml
  - control-plane.yaml
  - local-ca.yaml
  - valkey.yaml
