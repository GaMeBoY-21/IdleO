# cert-manager, Flagger and the in-cluster Prometheus (deploy/infrastructure/base, ADR 0046); no remote write here.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  interval: 1h
  path: ./deploy/infrastructure/base
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
