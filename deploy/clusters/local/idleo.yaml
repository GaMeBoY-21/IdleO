# IdleO's release on the Mac (ADR 0046): idleo/, as staging's and production's, with the images and chart up.sh built
# and pushed to the cluster's own registry, whose digests come from the ConfigMap flux-system/local-release it makes.
# It is healthy when the release is installed and the control plane's canary has been promoted.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: idleo
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure
  interval: 10m
  path: ./deploy/clusters/local/idleo
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: local-release
  timeout: 30m
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: idleo
      namespace: idleo
    - apiVersion: flagger.app/v1beta1
      kind: Canary
      name: idleo-control-plane
      namespace: idleo
  healthCheckExprs:
    - apiVersion: flagger.app/v1beta1
      kind: Canary
      current: status.phase in ['Initialized', 'Succeeded']
      failed: status.phase == 'Failed'
