# The Mac's cluster only (ADR 0048): the source controller reaches the cluster's own registry, a container on k3d's
# Docker network (k3d-idleo-registry:5000), for the chart up.sh builds and pushes there.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: local-registry
  namespace: flux-system
spec:
  podSelector:
    matchLabels:
      app: source-controller
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 172.16.0.0/12
      ports:
        - { port: 5000, protocol: TCP }
