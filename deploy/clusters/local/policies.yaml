# What the cluster admits (deploy/policies, ADR 0048): images pinned and from the allowed repositories, no privileged
# pods, and signatures checked by Kyverno, once the infrastructure (Kyverno with it) is ready, and before IdleO's
# release.
# The Mac's copy adds its own registry and development's stand-ins to the allowed list.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: policies
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure
  interval: 1h
  path: ./deploy/policies/local
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
