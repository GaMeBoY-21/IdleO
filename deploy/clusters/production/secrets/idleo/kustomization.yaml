# IdleO's Secrets in production: idleo-database-migration and idleo-database-application (kubernetes.io/basic-auth, the
# database's two users), idleo-backup-storage (R2's ACCESS_KEY_ID and ACCESS_SECRET_KEY for the database's backups,
# ADR 0047), idleo-control-plane and idleo-valkey (Valkey's one user's password, ADR 0048), each a SOPS file encrypted
# for production's age key (.sops.yaml). They are made with the server (S5; docs/runbooks/deploying.md, "Secrets"); until
# then there are none.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: []
