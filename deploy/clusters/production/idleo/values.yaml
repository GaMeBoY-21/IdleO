# Production's values (ADR 0046; the chart's defaults are production's, deploy/helm/idleo/values.yaml). Renters' own
# images stay off (no scanner, and IMAGES_ENABLED unset) until the scanner is measured on the real server (ADR 0042),
# and the prod profile refuses every development setting (ProductionSettingsGuard). The release itself, the chart's
# and the images' digests, is release.yaml.
controlPlane:
  profiles: prod,cluster

# The database's backups (ADR 0047) in R2: its address and bucket come from the Secret r2-backups (flux-system), which
# Flux substitutes here (idleo.yaml); the keys are the Secret idleo-backup-storage. Both are made with the server (S5).
database:
  backups:
    endpoint: ${R2_BACKUPS_ENDPOINT}
    destination: s3://${R2_BACKUPS_BUCKET}/production
