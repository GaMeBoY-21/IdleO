# Staging's values (ADR 0046): production's settings on its own hosts, with test-mode payment keys (ADR 0039) in its
# Secret. Its server and issuer come with production's (S5). The release itself, the chart's and the images' digests,
# is release.yaml, which a pull request moves after every build of main.
controlPlane:
  profiles: prod,cluster

gateway:
  hosts:
    api: api.staging.idleo.in
    app: app.staging.idleo.in
    site: staging.idleo.in

tls:
  issuer:
    kind: ClusterIssuer
    name: letsencrypt-staging

# The database's backups (ADR 0047) in R2: its address and bucket come from the Secret r2-backups (flux-system), which
# Flux substitutes here (idleo.yaml); the keys are the Secret idleo-backup-storage. Both are made with the server (S5).
database:
  backups:
    endpoint: ${R2_BACKUPS_ENDPOINT}
    destination: s3://${R2_BACKUPS_BUCKET}/staging
