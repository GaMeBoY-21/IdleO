# IdleO's namespace (ADR 0048): Pod Security "restricted", enforced; every pod in the chart meets it.
apiVersion: v1
kind: Namespace
metadata:
  name: idleo
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
---
# The namespace's default service account mounts no token (ADR 0048; kube-bench 5.1.5): every pod here that calls the
# Kubernetes API has an account of its own.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: idleo
automountServiceAccountToken: false
