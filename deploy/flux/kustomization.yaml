# Flux v2.9.6 (ADR 0046), the same in every cluster: its four controllers (source, kustomize, helm and notification),
# exported once with the Flux CLI's own image and committed, so an upgrade is a reviewed diff:
#
#   docker run --rm ghcr.io/fluxcd/flux-cli:v2.9.6 install --export \
#     --components source-controller,kustomize-controller,helm-controller,notification-controller \
#     > deploy/flux/gotk-components.yaml
#
# and each controller's image pinned by digest here. Flux reads this repository over HTTPS with no token and never
# writes to it (deploy/clusters/<env>/flux-system/sync.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gotk-components.yaml
images:
  - name: ghcr.io/fluxcd/source-controller
    digest: sha256:6a6693172589f8ff26123a231d5fa6ceb194a6efb4dc647cdf057c959f76a2e3
  - name: ghcr.io/fluxcd/kustomize-controller
    digest: sha256:2ebeaa341da77d52b6abbbba5efcee0450d47f8b42f0e6f33b08f9020262d606
  - name: ghcr.io/fluxcd/helm-controller
    digest: sha256:0d52fff5c4d476277b8fcb6beb9041e269adb5db943fe69f5a806ea0c92b1511
  - name: ghcr.io/fluxcd/notification-controller
    digest: sha256:840f318265ee26f0d2c48a158bf7896b22aa4e998e320a18646309f0e40b15da
patches:
  # A new commit cancels a health check still waiting on the last one, so reverting a release that is failing its
  # canary applies at once rather than after the failing one's 30-minute timeout.
  - target:
      kind: Deployment
      name: kustomize-controller
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --feature-gates=CancelHealthCheckOnNewRevision=true
