# Flux v2.10.0 (ADR 0046), the same in every cluster: its four controllers (source, kustomize, helm and notification),
# exported once with the Flux CLI's own image and committed, so an upgrade is a reviewed diff:
#
#   docker run --rm ghcr.io/fluxcd/flux-cli:v2.10.0 install --export \
#     --components source-controller,kustomize-controller,helm-controller,notification-controller \
#     > deploy/flux/gotk-components.yaml
#
# and each controller's image pinned by digest here. Flux reads this repository over HTTPS with no token and never
# writes to it (deploy/clusters/<env>/flux-system/sync.yaml). Its namespace enforces Pod Security "restricted", and
# network.yaml replaces the network policies it ships (ADR 0048).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gotk-components.yaml
  - network.yaml
  - service-account.yaml
images:
  - name: ghcr.io/fluxcd/source-controller
    newTag: v1.10.1@sha256:611b6bca3eae95bcff471414d1fb14a4ab83d7f14e609cccef2bd389c121f37e
  - name: ghcr.io/fluxcd/kustomize-controller
    newTag: v1.10.1@sha256:37db29b25dae35b881a5e064acedb0cc954442da453a39eaa0eab7a90dbecc4e
  - name: ghcr.io/fluxcd/helm-controller
    newTag: v1.7.1@sha256:54526cc6ed1202d71d44c310676448065664f3255ad671d9a69ac26f904e617a
  - name: ghcr.io/fluxcd/notification-controller
    newTag: v1.10.0@sha256:9f58b9532ec9d3ccf539cd3ccdf283477a5dcb7777b922db5477d8bbd4d3767c
patches:
  # Pod Security "restricted" enforced, not only warned of (ADR 0048): Flux's controllers already meet it.
  - target:
      kind: Namespace
      name: flux-system
    patch: |
      - op: add
        path: /metadata/labels/pod-security.kubernetes.io~1enforce
        value: restricted
      - op: add
        path: /metadata/labels/pod-security.kubernetes.io~1enforce-version
        value: latest
  # Flux's own network policies let every controller reach anything; network.yaml says exactly what each may.
  - target:
      kind: NetworkPolicy
      name: allow-egress|allow-scraping|allow-webhooks
    patch: |
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: ignored
  # A new commit cancels a health check still waiting on the last one, so reverting a release that is failing its
  # canary applies at once rather than after the failing one's 30-minute timeout.
  - target:
      kind: Deployment
      name: kustomize-controller
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --feature-gates=CancelHealthCheckOnNewRevision=true
