# The pods deploy/policies/tests/kyverno-test.yaml admits or refuses (ADR 0048). The signed ones are real: staging's
# control plane of 41d14c0 and the vendors' pinned releases; "unsigned" is that build's own CycloneDX attestation, a
# digest under our name that nobody signed. The Deployments are checked as they're written (the policies' autogen).
