# No privileged container, no host network, PID or IPC namespace, and no folder of the node's (ADR 0048). Pod Security
# "restricted" already refuses these in every namespace we own; this says so in plain words, and holds even in a
# namespace someone forgot to label. Native, like images-pinned.yaml: the API server checks it, Kyverno or not.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: idleo-pods-unprivileged
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods, pods/ephemeralcontainers]
  variables:
    - name: containers
      expression: >-
        object.spec.containers
        + (has(object.spec.initContainers) ? object.spec.initContainers : [])
        + (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers : [])
  validations:
    - expression: >-
        !variables.containers.exists(c, has(c.securityContext) && has(c.securityContext.privileged)
          && c.securityContext.privileged)
      messageExpression: >-
        'no container may be privileged: ' + variables.containers.filter(c, has(c.securityContext)
          && has(c.securityContext.privileged) && c.securityContext.privileged).map(c, c.name).join(', ')
      reason: Forbidden
    - expression: "!has(object.spec.volumes) || !object.spec.volumes.exists(v, has(v.hostPath))"
      messageExpression: >-
        'no pod may mount a folder of the node (hostPath): '
        + object.spec.volumes.filter(v, has(v.hostPath)).map(v, v.name).join(', ')
      reason: Forbidden
    - expression: >-
        !(has(object.spec.hostNetwork) && object.spec.hostNetwork)
        && !(has(object.spec.hostPID) && object.spec.hostPID)
        && !(has(object.spec.hostIPC) && object.spec.hostIPC)
      message: no pod may use the node's network, process or IPC namespace (hostNetwork, hostPID, hostIPC)
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: idleo-pods-unprivileged
spec:
  policyName: idleo-pods-unprivileged
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - { key: kubernetes.io/metadata.name, operator: NotIn, values: [kube-system] }
