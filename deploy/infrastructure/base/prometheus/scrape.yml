# What the in-cluster Prometheus scrapes (ADR 0046): the control plane's pods on their internal metrics port (the
# chart's container port named metrics; the primary's and a canary's both, told apart by the app label Flagger gives
# each), and Flagger's own meters, which say how each canary went (flagger_canary_status).
scrape_configs:
  - job_name: control-plane
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [idleo]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        regex: metrics
        action: keep
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      # control-plane for the canary's pods, control-plane-primary for the primary's.
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        target_label: app
  - job_name: flagger
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [flagger-system]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_container_port_number]
        regex: flagger;8080
        action: keep
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
