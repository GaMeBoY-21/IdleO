# What the in-cluster Prometheus scrapes (ADR 0046, 0047): the control plane's pods on their internal metrics port (the
# chart's container port named metrics; the primary's and a canary's both, told apart by the app label Flagger gives
# each), the database's instances (CloudNativePG's meters and its backup plugin's, on 9187), and Flagger's own meters,
# which say how each canary went (flagger_canary_status).
scrape_configs:
  - job_name: control-plane
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [idleo]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_idleo_in_control_plane, __meta_kubernetes_pod_container_port_name]
        regex: true;metrics
        action: keep
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      # control-plane for the canary's pods, control-plane-primary for the primary's.
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        target_label: app
  - job_name: database
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [idleo]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_cnpg_io_cluster, __meta_kubernetes_pod_container_port_number]
        regex: .+;9187
        action: keep
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
        target_label: cluster
  - job_name: flagger
    # Its meters carry the canary's own namespace label, which must win over the pod's.
    honor_labels: true
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [flagger-system]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_container_port_number]
        regex: flagger;8080
        action: keep
