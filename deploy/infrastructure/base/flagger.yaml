# Flagger v1.45.0 (ADR 0046): canary releases of the control plane through the Gateway API (k3s's Traefik), judged by
# the in-cluster Prometheus. Its chart is pinned by digest and its signature checked against Flagger's own release
# workflow before Flux installs it; its image is pinned by digest too.
apiVersion: v1
kind: Namespace
metadata:
  name: flagger-system
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
---
# The namespace's default service account mounts no token (ADR 0048; kube-bench 5.1.5): every pod here that calls the
# Kubernetes API has an account of its own.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: flagger-system
automountServiceAccountToken: false
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: flagger
  namespace: flagger-system
spec:
  interval: 1h
  url: oci://ghcr.io/fluxcd/charts/flagger
  ref:
    # 1.45.0
    digest: sha256:a442a581eec96b8ca45df6c5d2b8a5a7a00fc7de2aac80a96675ae978095b672
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://token\.actions\.githubusercontent\.com$
        subject: ^https://github\.com/fluxcd/flagger/\.github/workflows/release\.yml@refs/tags/v1\.45\.0$
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flagger
  namespace: flagger-system
spec:
  interval: 1h
  releaseName: flagger
  chartRef:
    kind: OCIRepository
    name: flagger
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  # The chart sets a security context on its container only; the pod gets one too (Trivy's KSV-0118).
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: flagger
            patch: |
              - op: add
                path: /spec/template/spec/securityContext
                value: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
  values:
    image:
      tag: 1.45.0@sha256:15b372d35012f9ae450f9030bc82217369c0aee082ed5a5225830010cf972b2b
    meshProvider: gatewayapi:v1
    # Pod Security "restricted" (ADR 0048): the chart's own context is only a user and a read-only root.
    securityContext:
      enabled: true
      context:
        runAsNonRoot: true
        runAsUser: 10001
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        seccompProfile:
          type: RuntimeDefault
    metricsServer: http://prometheus.monitoring:9090
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 128Mi }
---
# Deny by default (ADR 0048). Flagger reaches DNS, the Kubernetes API (it moves the HTTPRoute's weights) and the
# in-cluster Prometheus (each canary's checks); only Prometheus reaches it, for its meters.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: flagger-system
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dns-and-api
  namespace: flagger-system
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    - to:
        - ipBlock:
            cidr: 10.43.0.1/32
      ports:
        - { port: 443, protocol: TCP }
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - { port: 6443, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flagger
  namespace: flagger-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: flagger
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - { port: 8080, protocol: TCP }
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - { port: 9090, protocol: TCP }
