# What every cluster runs beside IdleO (ADR 0046, 0047, 0048), applied by Flux before the policies and the idleo
# release: the priority classes and Kyverno (which checks every image's signature), cert-manager (the Gateway's
# certificates), CloudNativePG and its backup plugin (the database), Flagger (canary releases of the control
# plane) and a small Prometheus that Flagger judges each canary by and that keeps the database's meters. Staging and
# production add Prometheus's remote write (../remote-write/).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - priority-classes.yaml
  - kyverno.yaml
  - cert-manager.yaml
  - cloudnative-pg.yaml
  - flagger.yaml
  - prometheus
